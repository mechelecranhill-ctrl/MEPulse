<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Closing System</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body{
margin:0;
font-family:-apple-system,system-ui,sans-serif;
background:linear-gradient(60deg,#0b3d91,#0077b6,#00b4d8);
min-height:100vh;
}

.glass{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(15px);
border-radius:18px;
padding:20px;
max-width:1000px;
margin:20px auto;
}

h2{color:white}

select,input,textarea{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-top:5px;
}

label{
font-size:11px;
font-weight:700;
color:#fff;
margin-top:10px;
display:block;
}

/* HEADER */
.glass-header {
width: 100%; height: 60px;
background: radial-gradient(circle at top, rgba(255,255,255,.15), transparent 35%),
linear-gradient(60deg, #0b3d91 0%, #0077b6 40%, #00b4d8 100%);
display:flex;
align-items:center;
justify-content:center;
position: relative; /* WAJIB supaya z-index di bawah berkesan (tanpa ini, z-index diabaikan sebab elemen 'static') */
z-index: 1000;
}

.form-tabs {
display:flex;
gap:8px;
}

.form-tabs button {
padding:8px 16px;
border-radius:15px;
background:rgba(255,255,255,.2);
color:white;
border:none;
font-size:12px;
cursor:pointer;
}

.form-tabs button.active{
background:white;
color:#0b3d91;
}

.card{
background:rgba(255,255,255,0.25);
padding:12px;
border-radius:12px;
margin-top:10px;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

.primary{background:#007AFF;color:white}
.green{background:#34C759;color:white}

.checklist label{
display:flex;
gap:10px;
align-items:center;
font-size:12px;
color:white;
margin:6px 0;
}
    </style>

    <link rel="stylesheet" href="style.css">

    <script src="session.js"></script>
    <script src="sidebar.js" defer>

    </script>
</head>

<body>

    <app-sidebar></app-sidebar>

<div class="glass-header">
<div class="form-tabs">
<button class="active" onclick="showTab(event,'cpc')">CPC</button>
<button onclick="showTab(event,'cmgd')">CMGD</button>
<button onclick="showTab(event,'sfa')">SFA</button>
</div>
</div>

<div class="glass">

<h2><i class="fa fa-file-contract"></i> Closing Contract</h2>

<label>Unit</label>
<select id="unit" onchange="loadContracts()"></select>

<label>Contract</label>
<select id="contract" onchange="loadData()"></select>

<!-- CPC -->
<div id="cpcTab">

<div class="card">
<b style="color:white">Contract Status</b>
<div id="contractEnd" style="color:#fff"></div>
</div>

<div class="card checklist">
<b style="color:white">CPC Checklist</b>

<label><input type="checkbox" id="c1"> Tracking Form</label>
<label><input type="checkbox" id="c2"> CPC Form</label>
<label><input type="checkbox" id="c3"> LPK</label>

</div>

<button id="btnCPC" class="btn primary" onclick="saveCPC()">Submit CPC</button>
</div>

<!-- CMGD -->
<div id="cmgdTab" style="display:none">

<div class="card">
<b style="color:white">CMGD Status</b>
<div id="cmgdStatus"></div>
</div>

<label>CMGD Date</label>
<input type="date" id="cmgd">

<label>Defect Status</label>
<select id="defect">
<option>Completed</option>
<option>Pending</option>
</select>

<label>Remarks</label>
<textarea id="cmgdRemark"></textarea>

<button id="btnCMGD" class="btn primary" onclick="saveCMGD()">Submit CMGD</button>
</div>

<!-- SFA -->
<div id="sfaTab" style="display:none">

<div class="card">
<b style="color:white">SFA Status</b>
<div id="sfaStatus"></div>
</div>

<label>SFA Date</label>
<input type="date" id="sfa">

<label>Final Account</label>
<input type="number" id="final">

<label>Retention</label>
<input type="number" id="retention">

<label>PG Release</label>
<input type="number" id="pg">

<label>Remarks</label>
<textarea id="sfaRemark"></textarea>

<button id="btnSFA" class="btn green" onclick="saveSFA()">CLOSE CONTRACT</button>
</div>

</div>

<script>
const API_URL = "https://me-connect-api.mech-elec-ranhill.workers.dev";

const headers = {
    "Content-Type": "application/json"
};

let contract = null;
let currentClosing = null;


/* =========================================================
   HELPERS
========================================================= */

function getEl(id) {
    return document.getElementById(id);
}

function formatDate(date) {
    if (!(date instanceof Date) || isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}

function addMonthsSafe(date, months) {
    const result = new Date(date);

    const originalDay = result.getDate();

    result.setMonth(result.getMonth() + months);

    /*
     * Handle month overflow.
     * Contoh:
     * 31 Jan + 1 bulan tidak boleh menjadi 03 Mac.
     */
    if (result.getDate() !== originalDay) {
        result.setDate(0);
    }

    return result;
}

async function apiFetch(url, options = {}) {

    const config = {
        ...options,
        headers: {
            ...headers,
            ...(options.headers || {})
        }
    };

    const response = await fetch(url, config);

    if (!response.ok) {
        let errorText = "";

        try {
            errorText = await response.text();
        } catch (e) {
            errorText = "";
        }

        throw new Error(
            `API Error ${response.status}: ${errorText || response.statusText}`
        );
    }

    return response;
}


/* =========================================================
   TAB
========================================================= */

function showTab(event, type) {

    document.querySelectorAll(".form-tabs button")
        .forEach(button => {
            button.classList.remove("active");
        });

    event.target.classList.add("active");

    getEl("cpcTab").style.display =
        type === "cpc" ? "block" : "none";

    getEl("cmgdTab").style.display =
        type === "cmgd" ? "block" : "none";

    getEl("sfaTab").style.display =
        type === "sfa" ? "block" : "none";
}


/* =========================================================
   LOAD UNITS
========================================================= */

async function loadUnits() {

    try {

        const response = await apiFetch(
            `${API_URL}/rest/v1/units?select=id,unit_name`
        );

        const data = await response.json();

        const unitSelect = getEl("unit");

        unitSelect.innerHTML =
            '<option value="">Select Unit</option>';

        if (!Array.isArray(data)) {
            throw new Error("Invalid units response");
        }

        data.forEach(unit => {

            const option = document.createElement("option");

            option.value = unit.id;
            option.textContent = unit.unit_name;

            unitSelect.appendChild(option);
        });

        if (data.length > 0) {

            unitSelect.value = data[0].id;

            await loadContracts();
        }

    } catch (error) {

        console.error("Error loading units:", error);

        alert(
            "Gagal mendapatkan Unit.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   LOAD CONTRACTS
========================================================= */

async function loadContracts() {

    const unitId = getEl("unit").value;

    const contractSelect = getEl("contract");

    contractSelect.innerHTML =
        '<option value="">Loading...</option>';

    resetClosingForm();

    if (!unitId) {

        contractSelect.innerHTML =
            '<option value="">Select Contract</option>';

        return;
    }

    try {

        const response = await apiFetch(
            `${API_URL}/rest/v1/contract` +
            `?unit_id=eq.${encodeURIComponent(unitId)}` +
            `&select=id,contract_code,contract_name,contract_start,contract_end,contract_sum` +
            `&order=contract_start.asc`
        );

        const data = await response.json();

        contractSelect.innerHTML =
            '<option value="">Select Contract</option>';

        if (!Array.isArray(data)) {
            throw new Error("Invalid contract response");
        }

        data.forEach(item => {

            const option = document.createElement("option");

            option.value = item.id;
            option.textContent =
                item.contract_code +
                (item.contract_name
                    ? ` - ${item.contract_name}`
                    : "");

            contractSelect.appendChild(option);
        });

    } catch (error) {

        console.error("Error loading contracts:", error);

        contractSelect.innerHTML =
            '<option value="">Unable to load contracts</option>';

        alert(
            "Gagal mendapatkan Contract.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   RESET FORM
========================================================= */

function resetClosingForm() {

    contract = null;
    currentClosing = null;

    getEl("contractEnd").innerHTML = "";

    getEl("cmgdStatus").innerHTML = "";

    getEl("sfaStatus").innerHTML = "";

    getEl("cmgd").value = "";
    getEl("defect").value = "Completed";
    getEl("cmgdRemark").value = "";

    getEl("sfa").value = "";
    getEl("final").value = "";
    getEl("retention").value = "";
    getEl("pg").value = "";
    getEl("sfaRemark").value = "";

    getEl("c1").checked = false;
    getEl("c2").checked = false;
    getEl("c3").checked = false;

    getEl("btnCPC").style.display = "none";
    getEl("btnCMGD").style.display = "none";
    getEl("btnSFA").style.display = "none";
}


/* =========================================================
   LOAD CONTRACT DATA
========================================================= */

async function loadData() {

    const contractId = getEl("contract").value;

    resetClosingForm();

    if (!contractId) {
        return;
    }

    try {

        /*
         * Get contract
         */

        const contractResponse = await apiFetch(
            `${API_URL}/rest/v1/contract` +
            `?id=eq.${encodeURIComponent(contractId)}` +
            `&select=*`
        );

        const contractRows = await contractResponse.json();

        if (!Array.isArray(contractRows) || !contractRows.length) {

            throw new Error("Contract tidak dijumpai.");
        }

        contract = contractRows[0];


        /*
         * Get existing closing record.
         *
         * Ini penting supaya:
         * - CPC status boleh dipaparkan semula
         * - CMGD data boleh dipaparkan semula
         * - SFA data boleh dipaparkan semula
         */

        try {

            const closingResponse = await apiFetch(
                `${API_URL}/rest/v1/contract_closing` +
                `?contract_id=eq.${encodeURIComponent(contract.id)}` +
                `&select=*`
            );

            const closingRows = await closingResponse.json();

            currentClosing =
                Array.isArray(closingRows) && closingRows.length
                    ? closingRows[0]
                    : null;

        } catch (closingError) {

            /*
             * Jika endpoint closing belum wujud / belum support GET,
             * contract masih boleh digunakan.
             */

            console.warn(
                "Unable to load contract closing record:",
                closingError
            );

            currentClosing = null;
        }


        /*
         * Contract end date
         */

        const today = new Date();

        const contractEnd = new Date(
            contract.contract_end
        );

        if (isNaN(contractEnd.getTime())) {

            throw new Error(
                "contract_end tidak sah untuk contract ini."
            );
        }


        /*
         * CPC
         *
         * CPC eligible apabila kontrak telah tamat.
         */

        const cpcEligible =
            today >= contractEnd;


        /*
         * CMGD
         *
         * CMGD = 6 bulan selepas contract end.
         */

        const cmgdDate =
            addMonthsSafe(contractEnd, 6);

        const cmgdEligible =
            today >= cmgdDate;


        /*
         * SFA
         *
         * SFA = 1 tahun 6 bulan
         *      = 18 bulan selepas contract end.
         */

        const sfaDate =
            addMonthsSafe(contractEnd, 18);

        const sfaEligible =
            today >= sfaDate;


        /* =====================================================
           CPC STATUS
        ===================================================== */

        if (currentClosing &&
            String(currentClosing.cpc_status || "").toUpperCase() === "COMPLETED") {

            getEl("contractEnd").innerHTML =
                "✅ CPC COMPLETED";

            getEl("btnCPC").style.display = "none";

        } else if (cpcEligible) {

            getEl("contractEnd").innerHTML =
                "✅ Eligible for CPC<br>" +
                `<small>Contract ended: ${formatDate(contractEnd)}</small>`;

            getEl("btnCPC").style.display = "block";

        } else {

            getEl("contractEnd").innerHTML =
                "⏳ Contract ends: " +
                formatDate(contractEnd);

            getEl("btnCPC").style.display = "none";
        }


        /* =====================================================
           CMGD STATUS
        ===================================================== */

        if (currentClosing &&
            currentClosing.cmgd_date) {

            getEl("cmgdStatus").innerHTML =
                "✅ CMGD COMPLETED<br>" +
                `<small>Date: ${formatDate(
                    new Date(currentClosing.cmgd_date)
                )}</small>`;

            getEl("cmgd").value =
                String(currentClosing.cmgd_date).substring(0, 10);

            if (currentClosing.defect_status) {
                getEl("defect").value =
                    currentClosing.defect_status;
            }

            if (currentClosing.cmgd_remarks) {
                getEl("cmgdRemark").value =
                    currentClosing.cmgd_remarks;
            }

            getEl("btnCMGD").style.display = "none";

        } else if (cmgdEligible) {

            getEl("cmgdStatus").innerHTML =
                "✅ Eligible for CMGD<br>" +
                `<small>Eligible date: ${formatDate(cmgdDate)}</small>`;

            getEl("btnCMGD").style.display = "block";

            /*
             * Default CMGD date = eligibility date.
             */

            getEl("cmgd").value =
                cmgdDate.toISOString().substring(0, 10);

        } else {

            getEl("cmgdStatus").innerHTML =
                "⏳ Available after: " +
                formatDate(cmgdDate);

            getEl("btnCMGD").style.display = "none";
        }


        /* =====================================================
           SFA STATUS
        ===================================================== */

        if (currentClosing &&
            currentClosing.sfa_date) {

            getEl("sfaStatus").innerHTML =
                "✅ SFA COMPLETED<br>" +
                `<small>Date: ${formatDate(
                    new Date(currentClosing.sfa_date)
                )}</small>`;

            getEl("sfa").value =
                String(currentClosing.sfa_date).substring(0, 10);

            if (currentClosing.final_account != null) {
                getEl("final").value =
                    currentClosing.final_account;
            }

            if (currentClosing.retention_release != null) {
                getEl("retention").value =
                    currentClosing.retention_release;
            }

            if (currentClosing.pg_release != null) {
                getEl("pg").value =
                    currentClosing.pg_release;
            }

            if (currentClosing.sfa_remarks) {
                getEl("sfaRemark").value =
                    currentClosing.sfa_remarks;
            }

            getEl("btnSFA").style.display = "none";

        } else if (sfaEligible) {

            getEl("sfaStatus").innerHTML =
                "✅ Eligible for SFA<br>" +
                `<small>Eligible date: ${formatDate(sfaDate)}</small>`;

            getEl("btnSFA").style.display = "block";

            /*
             * Default SFA date = eligibility date.
             */

            getEl("sfa").value =
                sfaDate.toISOString().substring(0, 10);

        } else {

            getEl("sfaStatus").innerHTML =
                "⏳ Available after: " +
                formatDate(sfaDate);

            getEl("btnSFA").style.display = "none";
        }

    } catch (error) {

        console.error("Error loading contract data:", error);

        alert(
            "Gagal mendapatkan data contract.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   SAVE CPC
========================================================= */

async function saveCPC() {

    if (!contract) {

        alert("Sila pilih contract dahulu.");

        return;
    }


    /*
     * Checklist
     */

    if (
        !getEl("c1").checked ||
        !getEl("c2").checked ||
        !getEl("c3").checked
    ) {

        alert(
            "Sila lengkapkan semua CPC checklist."
        );

        return;
    }


    /*
     * Double-check eligibility
     */

    const contractEnd =
        new Date(contract.contract_end);

    if (new Date() < contractEnd) {

        alert(
            "Contract masih belum tamat. CPC belum boleh dibuat."
        );

        return;
    }


    const button = getEl("btnCPC");

    button.disabled = true;
    button.innerText = "Saving...";


    try {

        /*
         * Jika closing record sudah wujud,
         * PATCH record tersebut.
         *
         * Jika belum wujud,
         * POST record baru.
         */

        if (currentClosing && currentClosing.id) {

            await apiFetch(
                `${API_URL}/rest/v1/contract_closing` +
                `?id=eq.${encodeURIComponent(currentClosing.id)}`,
                {
                    method: "PATCH",
                    body: JSON.stringify({
                        cpc_status: "COMPLETED"
                    })
                }
            );

        } else {

            const response = await apiFetch(
                `${API_URL}/rest/v1/contract_closing`,
                {
                    method: "POST",
                    body: JSON.stringify({
                        contract_id: contract.id,
                        cpc_status: "COMPLETED"
                    })
                }
            );

            /*
             * Simpan returned record jika Worker
             * memulangkannya.
             */

            try {

                const rows = await response.json();

                if (Array.isArray(rows) && rows.length) {
                    currentClosing = rows[0];
                }

            } catch (e) {
                // Response mungkin kosong.
            }
        }


        alert("CPC saved successfully.");

        await loadData();

    } catch (error) {

        console.error("Error saving CPC:", error);

        alert(
            "Gagal save CPC.\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;
        button.innerText = "Submit CPC";
    }
}


/* =========================================================
   SAVE CMGD
========================================================= */

async function saveCMGD() {

    if (!contract) {

        alert("Sila pilih contract dahulu.");

        return;
    }


    const cmgdDateValue =
        getEl("cmgd").value;

    if (!cmgdDateValue) {

        alert("Sila masukkan CMGD Date.");

        return;
    }


    /*
     * CMGD eligibility:
     * contract end + 6 months
     */

    const contractEnd =
        new Date(contract.contract_end);

    const eligibleDate =
        addMonthsSafe(contractEnd, 6);

    const selectedDate =
        new Date(cmgdDateValue);


    if (new Date() < eligibleDate) {

        alert(
            "CMGD belum eligible.\n\n" +
            "Available after: " +
            formatDate(eligibleDate)
        );

        return;
    }


    /*
     * CMGD date tidak boleh sebelum eligibility date.
     */

    if (selectedDate < eligibleDate) {

        alert(
            "CMGD Date tidak boleh sebelum " +
            formatDate(eligibleDate)
        );

        return;
    }


    const button = getEl("btnCMGD");

    button.disabled = true;
    button.innerText = "Saving...";


    try {

        const payload = {
            contract_id: contract.id,
            cmgd_date: cmgdDateValue,
            defect_status: getEl("defect").value,
            cmgd_remarks: getEl("cmgdRemark").value
        };


        /*
         * Jika closing record sudah ada:
         * update record contract tersebut.
         */

        if (currentClosing && currentClosing.id) {

            await apiFetch(
                `${API_URL}/rest/v1/contract_closing` +
                `?id=eq.${encodeURIComponent(currentClosing.id)}`,
                {
                    method: "PATCH",
                    body: JSON.stringify(payload)
                }
            );

        } else {

            const response = await apiFetch(
                `${API_URL}/rest/v1/contract_closing`,
                {
                    method: "POST",
                    body: JSON.stringify(payload)
                }
            );

            try {

                const rows = await response.json();

                if (Array.isArray(rows) && rows.length) {
                    currentClosing = rows[0];
                }

            } catch (e) {
                // Empty response.
            }
        }


        alert("CMGD saved successfully.");

        await loadData();

    } catch (error) {

        console.error("Error saving CMGD:", error);

        alert(
            "Gagal save CMGD.\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;
        button.innerText = "Submit CMGD";
    }
}


/* =========================================================
   SAVE SFA
========================================================= */

async function saveSFA() {

    if (!contract) {

        alert("Sila pilih contract dahulu.");

        return;
    }


    const sfaDateValue =
        getEl("sfa").value;

    if (!sfaDateValue) {

        alert("Sila masukkan SFA Date.");

        return;
    }


    /*
     * SFA eligibility:
     *
     * Contract End
     * +
     * 18 months
     */

    const contractEnd =
        new Date(contract.contract_end);

    const eligibleDate =
        addMonthsSafe(contractEnd, 18);

    const selectedDate =
        new Date(sfaDateValue);


    if (new Date() < eligibleDate) {

        alert(
            "SFA belum eligible.\n\n" +
            "Available after: " +
            formatDate(eligibleDate)
        );

        return;
    }


    /*
     * SFA Date tidak boleh sebelum
     * eligibility date.
     */

    if (selectedDate < eligibleDate) {

        alert(
            "SFA Date tidak boleh sebelum " +
            formatDate(eligibleDate)
        );

        return;
    }


    /*
     * Confirm sebelum close contract.
     */

    const confirmed =
        confirm(
            "Adakah anda pasti mahu CLOSE CONTRACT ini?"
        );

    if (!confirmed) {
        return;
    }


    const button = getEl("btnSFA");

    button.disabled = true;
    button.innerText = "Closing...";


    try {

        const payload = {
            contract_id: contract.id,

            sfa_date: sfaDateValue,

            final_account:
                getEl("final").value === ""
                    ? null
                    : Number(getEl("final").value),

            retention_release:
                getEl("retention").value === ""
                    ? null
                    : Number(getEl("retention").value),

            pg_release:
                getEl("pg").value === ""
                    ? null
                    : Number(getEl("pg").value),

            sfa_remarks:
                getEl("sfaRemark").value,

            status: "CLOSED"
        };


        /*
         * Existing closing record
         */

        if (currentClosing && currentClosing.id) {

            await apiFetch(
                `${API_URL}/rest/v1/contract_closing` +
                `?id=eq.${encodeURIComponent(currentClosing.id)}`,
                {
                    method: "PATCH",
                    body: JSON.stringify(payload)
                }
            );

        } else {

            const response = await apiFetch(
                `${API_URL}/rest/v1/contract_closing`,
                {
                    method: "POST",
                    body: JSON.stringify(payload)
                }
            );

            try {

                const rows = await response.json();

                if (Array.isArray(rows) && rows.length) {
                    currentClosing = rows[0];
                }

            } catch (e) {
                // Empty response.
            }
        }


        alert(
            "Contract Closed Successfully."
        );

        await loadData();

    } catch (error) {

        console.error("Error closing contract:", error);

        alert(
            "Gagal close contract.\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;
        button.innerText = "CLOSE CONTRACT";
    }
}


/* =========================================================
   INIT
========================================================= */

document.addEventListener("DOMContentLoaded", () => {
    loadUnits();
});
</script>
</body>
</html>
