<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Attendance Logs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #ffffff;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            margin: 0; padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #1d1d1f;
        }

        .desktop-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 30px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .title-group h2 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
        .title-group p { margin: 5px 0 0 0; color: #86868b; font-size: 14px; font-weight: 600; }

        .btn-back {
            background: #007AFF; color: white; border: none;
            padding: 12px 24px; border-radius: 10px; cursor: pointer;
            font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .btn-back:hover { background: #0056b3; }

        /* Container Table */
        .table-container {
            flex-grow: 1;
            background: #fff;
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            position: sticky;
            top: 0;
            background: #fbfbfd;
            z-index: 10;
        }

        th {
            padding: 18px 20px;
            font-size: 13px;
            text-transform: uppercase;
            color: #86868b;
            border-bottom: 2px solid #f2f2f7;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            font-size: 15px;
            border-bottom: 1px solid #f2f2f7;
            font-weight: 500;
        }

        tr:hover { background-color: #f9f9fb; }

        .badge {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            display: inline-block;
            color: white;
            min-width: 100px;
            text-align: center;
        }
        .bg-blue { background: #007AFF; }
        .bg-red { background: #FF3B30; }

        .timestamp { font-size: 12px; color: #86868b; }

        #loadingOverlay {
            text-align: center; padding: 100px; font-weight: bold; color: #007AFF;
        }

        /* Custom Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            width: 85%; max-width: 340px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #1d1d1f; }
        .modal-desc { font-size: 13.5px; color: #666; margin-bottom: 20px; line-height: 1.4; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .modal-btn-ok { background: #007AFF; color: white; width: 100%; }
    </style>
</head>
<body>

<div class="desktop-wrapper">
    <div class="header-section">
        <div class="title-group">
            <h2><i class="fa-solid fa-database" style="color: #007AFF;"></i> Attendance Response Log</h2>
            <p id="statsInfo">Retrieving data from database...</p>
        </div>
        <button class="btn-back" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-house"></i> Return to Menu
        </button>
    </div>

    <div class="table-container">
        <table id="responseTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Reason / Activity</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Logged Time</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        <div id="loadingOverlay"><i class="fas fa-spinner fa-spin"></i> CHECKING DATABASE...</div>
    </div>
</div>

<!-- CUSTOM MODAL HTML -->
<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <div id="modalTitle" class="modal-title">Notice</div>
        <div id="modalDesc" class="modal-desc">Message content goes here.</div>
        <div id="modalButtons" class="modal-buttons">
            <button class="modal-btn modal-btn-ok" onclick="closeModal()">OK</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://me-connect-api.mech-elec-ranhill.workers.dev";

    function showModal(title, text) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDesc').innerText = text;
        document.getElementById('customModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    async function loadDesktopData() {
        const tbody = document.getElementById('tableBody');
        const overlay = document.getElementById('loadingOverlay');
        const stats = document.getElementById('statsInfo');

        try {
            const res = await fetch(`${API_URL}/attendance`);
            if (!res.ok) throw new Error('Network response was not ok');
            
            const data = await res.json();
            
            overlay.style.display = 'none';
            tbody.innerHTML = "";
            stats.innerText = `RECORDS FOUND: ${data.length} ENTRIES RETRIEVED`;

            data.forEach(item => {
                const isCuti = ((item.reason || "").toUpperCase().match(/CUTI|SAKIT|HALFDAY|LEAVE|MC|OFF/));
                const badgeClass = isCuti ? "bg-red" : "bg-blue";
                
                const logDate = item.created_at 
                    ? new Date(item.created_at).toLocaleString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                      }) 
                    : '-';

                const row = `
                    <tr>
                        <td style="font-weight:bold; color:#000;">
                            ${(item.name || "").toUpperCase()}
                        </td>
                        <td>${item.position || "-"}</td>
                        <td>
                            <span class="badge ${badgeClass}">
                                ${(item.reason || "-").toUpperCase()}
                            </span>
                        </td>
                        <td>${item.start_date || "-"}</td>
                        <td>${item.end_date || "-"}</td>
                        <td class="timestamp">${logDate}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

        } catch (err) {
            overlay.innerHTML = "<span style='color:red;'>DATABASE ERROR. UNABLE TO RETRIEVE DATA.</span>";
            console.error(err);
            showModal("System Error", "Failed to load attendance records from database. Please check your network connection or API status.");
        }
    }

    window.onload = loadDesktopData;
</script>

</body>
</html>
