    <script>
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

// ============ ROLE / PERMISSION CONTEXT (KONGSI SEMUA PAGE) ============
const ACT_ROLES = {
    TECH: ['JURUTEKNIK', 'JURUTEKNIK KANAN', 'EKSEKUTIF', 'EKSEKUTIF KANAN'],
    UNIT_EXEC: ['EKSEKUTIF', 'EKSEKUTIF KANAN'],
    SECTION_HEAD: ['KETUA SEKSYEN'],
    DEPT_HEAD: ['KETUA JABATAN']
};

async function getPermissionContext() {
    const _permHeaders = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
    const isAdmin = localStorage.getItem('userId') === '@dm1n' || localStorage.getItem('role') === 'admin';

    const ctx = {
        isAdmin, position: '', userId: null,
        isActingUnitExec: false, isActingSectionHead: false, isDeptHeadActive: false,
        canManageTech: false, canActUnit: false, canActSection: false, canActDept: false
    };

    if (isAdmin) {
        ctx.canManageTech = true; ctx.canActUnit = true; ctx.canActSection = true; ctx.canActDept = true;
        return ctx;
    }

    try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return ctx;
        ctx.userId = user.id;

        try {
            const sRes = await fetch(`${SB_URL}/rest/v1/staff?id=eq.${user.id}&select=position`, { headers: _permHeaders });
            const sRows = await sRes.json();
            ctx.position = (sRows[0]?.position || '').trim().toUpperCase();
        } catch (e) { console.error('Failed to load staff position:', e); }

        try {
            const uRes = await fetch(`${SB_URL}/rest/v1/staff_unit_assignment?staff_id=eq.${user.id}&is_acting=eq.true&select=unit_id`, { headers: _permHeaders });
            ctx.isActingUnitExec = (await uRes.json()).length > 0;
        } catch (e) {}

        try {
            const secRes = await fetch(`${SB_URL}/rest/v1/staff_section_assignment?staff_id=eq.${user.id}&is_acting=eq.true&select=section_id`, { headers: _permHeaders });
            ctx.isActingSectionHead = (await secRes.json()).length > 0;
        } catch (e) {}

        try {
            const dRes = await fetch(`${SB_URL}/rest/v1/department_head?staff_id=eq.${user.id}&active=eq.true&select=is_acting`, { headers: _permHeaders });
            ctx.isDeptHeadActive = (await dRes.json()).length > 0;
        } catch (e) {}

        ctx.canManageTech = ACT_ROLES.TECH.includes(ctx.position);
        ctx.canActUnit = ACT_ROLES.UNIT_EXEC.includes(ctx.position) || ctx.isActingUnitExec;
        ctx.canActSection = ACT_ROLES.SECTION_HEAD.includes(ctx.position) || ctx.isActingSectionHead;
        ctx.canActDept = ACT_ROLES.DEPT_HEAD.includes(ctx.position) || ctx.isDeptHeadActive; // covers Pemangku KJ (row aktif dgn is_acting)
    } catch (err) {
        console.error('Permission context error:', err);
    }
    return ctx;
}

        let renderedBlueformSeqs = new Set();

        async function fetchDashboard() {
            try {
                const perm = await getPermissionContext();
window.__lastPerm = perm;
                const isAdmin = perm.isAdmin;
                let unitsPreset = [];
                let activeUnitIds = null;

                if (!isAdmin) {
                    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
                    if (userError || !user) {
                        showEmptyRow('Please log in first.');
                        return;
                    }

                    const { data: assignments, error: assError } = await supabaseClient
                        .from('staff_section_assignment')
                        .select('section_id')
                        .eq('staff_id', user.id)
                        .eq('active', true);

                    if (assError) throw assError;
                    const activeSectionIds = (assignments || []).map(a => a.section_id);

                    if (activeSectionIds.length === 0) {
                        showEmptyRow('Your account has not been assigned to any section.');
                        return;
                    }

                    const { data: unitsInSection, error: unitsError } = await supabaseClient
                        .from('units')
                        .select('id, unit_name')
                        .in('section_id', activeSectionIds);

                    if (unitsError) throw unitsError;
                    unitsPreset = unitsInSection || [];
                    activeUnitIds = unitsPreset.map(u => u.id);

                    if (activeUnitIds.length === 0) {
                        showEmptyRow('No units registered under your section.');
                        return;
                    }
                } else {
                    const { data: allUnits } = await supabaseClient.from('units').select('id, unit_name');
                    unitsPreset = allUnits || [];
                }

                let workOrdersQuery = supabaseClient
                    .from('work_orders')
                    .select(`
                        id, work_id, status, sequence_no, district,
                        contract!inner (id, contract_name, contract_code, unit_id)
                    `)
                    .eq('status', 'APP-EXEC');
                if (!isAdmin) workOrdersQuery = workOrdersQuery.in('contract.unit_id', activeUnitIds);

                const { data: workOrders, error } = await workOrdersQuery;
                if (error) throw error;

                const { data: allQuotes, error: quoteError } = await supabaseClient
                    .from('quotations')
                    .select('work_id, pdf_url');

                if (!quoteError && allQuotes) {
                    const quoteMap = {};
                    allQuotes.forEach(q => { if (q.work_id) quoteMap[q.work_id] = q.pdf_url; });
                    workOrders.forEach(item => { item.mapped_pdf_url = quoteMap[item.work_id] || null; });
                }
 renderUnitContractView('table-sect-container', unitsPreset, workOrders, perm.canActSection, {
                    approveStatus: 'APP-HOS',
                    rejectStatus: 'HOS-REJ',
                    emptyMsg: 'Awaiting Executive approval.'
                });

            } catch (err) {
                console.error("Error loading data:", err.message);
                alert("Failed to load data: " + err.message);
            }
        }

        function showEmptyRow(message) {
            document.getElementById('table-sect-container').innerHTML = `
                <div class="text-center py-8 text-sm text-gray-400 italic bg-gray-50 rounded-lg border border-dashed border-gray-300">
                    <i class="fa-solid fa-inbox block text-xl mb-1 text-gray-300"></i> ${message}
                </div>`;
        }

function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (!content || !icon) return;
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // ============ UNIT -> CONTRACT ACCORDION (ikut style Executive) ============
        function renderUnitContractView(containerId, units, orders, canAct, opts) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const unitsMap = {};
            (units || []).forEach(u => { unitsMap[u.id] = { id: u.id, name: u.unit_name || 'Unit', contracts: {} }; });

            (orders || []).forEach(item => {
                const c = Array.isArray(item.contract) ? item.contract[0] : item.contract;
                const unitId = c?.unit_id || 'UNKNOWN';
                if (!unitsMap[unitId]) unitsMap[unitId] = { id: unitId, name: 'Unit Lain', contracts: {} };
                const cId = c?.id || item.contract_id || 'UNKNOWN-C';
                if (!unitsMap[unitId].contracts[cId]) {
                    unitsMap[unitId].contracts[cId] = { id: cId, code: c?.contract_code || 'No Code', name: c?.contract_name || 'No Name', orders: [] };
                }
                unitsMap[unitId].contracts[cId].orders.push(item);
            });

            const unitList = Object.values(unitsMap).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            if (unitList.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs italic">${opts.emptyMsg}</div>`;
                return;
            }

            const renderedSeqs = new Set();

            unitList.forEach(unit => {
                const contracts = Object.values(unit.contracts);
                const totalItems = contracts.reduce((s, c) => s + c.orders.length, 0);

                let unitHtml = `
                    <div class="flex items-center gap-2 mb-2 px-1 pt-1">
                        <i class="fa-solid fa-sitemap text-gray-400 text-sm"></i>
                        <h3 class="text-sm font-extrabold text-gray-700 uppercase tracking-wide">${unit.name}</h3>
                        <span class="text-[10px] bg-gray-100 text-gray-500 font-bold px-2 py-0.5 rounded-full">${totalItems} item</span>
                    </div>
                `;

                if (contracts.length === 0) {
                    unitHtml += `
                        <div class="text-center py-4 text-gray-400 text-xs italic bg-gray-50 rounded-lg border border-dashed border-gray-300 mb-4">
                            <i class="fa-solid fa-inbox block text-lg mb-1 text-gray-300"></i> ${opts.emptyMsg}
                        </div>`;
                } else {
                    contracts.forEach(contract => {
                        const seqGroups = buildSequenceGroups(contract.orders);
                        const accId = `acc-${containerId}-${String(contract.id).replace(/[^a-zA-Z0-9]/g, '-')}`;
                        const iconId = `icon-${accId}`;

                        unitHtml += `
                            <div class="bg-gray-50 rounded-lg border border-gray-200 shadow-xs mb-3 overflow-hidden">
                                <button type="button" onclick="toggleAccordion('${accId}','${iconId}')"
                                        class="w-full bg-amber-50 hover:bg-amber-100/80 border-amber-200 px-3 py-2.5 flex items-center justify-between gap-2 transition-colors cursor-pointer text-left border-b">
                                    <div class="flex items-center gap-2 min-w-0 flex-1">
                                        <span class="bg-amber-600 text-white text-[10px] px-1.5 py-0.5 rounded font-mono shadow-xs shrink-0">${contract.code}</span>
                                        <span class="font-bold text-gray-800 text-xs leading-tight break-words">${contract.name}</span>
                                    </div>
                                    <div class="flex items-center gap-2 shrink-0">
                                        <span class="text-[11px] bg-white text-gray-600 border border-gray-300 font-semibold px-2 py-0.5 rounded-full whitespace-nowrap shadow-2xs">${contract.orders.length}</span>
                                        <i id="${iconId}" class="fa-solid fa-chevron-down text-gray-500 text-xs transition-transform duration-200"></i>
                                    </div>
                                </button>
                                <div id="${accId}" class="hidden overflow-x-auto bg-white transition-all duration-200">
                                    <table class="min-w-full divide-y divide-gray-200 text-xs">
                                        <thead class="bg-gray-50">
                                            <tr>
                                                <th class="px-3 py-2 text-left font-medium text-gray-500 uppercase tracking-wider">Work ID</th>
                                                <th class="px-3 py-2 text-center font-medium text-gray-500 uppercase tracking-wider w-40">Reference</th>
                                                <th class="px-3 py-2 text-right font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="bg-white divide-y divide-gray-200">
                        `;

                        contract.orders.forEach(item => {
                            const seq = (item.sequence_no || '').trim();
                            const groupKey = seq ? getBlueformGroupKey(item) : null;
                            const dedupeKey = groupKey ? `${contract.id}::${groupKey}` : null;
                            const isFirstInGroup = !dedupeKey || !renderedSeqs.has(dedupeKey);

                            let fullSetBtnHtml;
                            if (isFirstInGroup) {
                                if (dedupeKey) renderedSeqs.add(dedupeKey);
                                const groupItems = groupKey ? (seqGroups[groupKey] || [item]) : [item];
                                const countLabel = groupItems.length > 1 ? ` (${groupItems.length})` : '';
                                const serializedGroup = encodeURIComponent(JSON.stringify(groupItems));
                                fullSetBtnHtml = `
                                    <button onclick="previewFullSet('${serializedGroup}')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-2.5 py-1 rounded-lg text-[11px] shadow-xs cursor-pointer inline-flex items-center gap-1 transition-all">
                                        <i class="fa-solid fa-print"></i> Blueform${countLabel}
                                    </button>`;
                            } else {
                                fullSetBtnHtml = `<span class="text-[10px] text-gray-400 italic">Refer to first row seq ${seq}</span>`;
                            }

                            const actionHtml = canAct ? `
                                <div class="inline-flex items-center gap-1">
                                    <button onclick="processAction('${item.work_id}', '${opts.rejectStatus}')" class="text-white px-2 py-1 rounded bg-red-600 hover:bg-red-700 font-medium transition-all shadow-xs cursor-pointer whitespace-nowrap" title="Reject"><i class="fa-solid fa-xmark"></i></button>
                                    <button onclick="processAction('${item.work_id}', '${opts.approveStatus}')" class="text-white px-2.5 py-1 rounded bg-amber-600 hover:bg-amber-700 font-medium transition-all shadow-xs cursor-pointer whitespace-nowrap" title="Approve"><i class="fa-solid fa-check"></i></button>
                                </div>
                            ` : `<span class="text-[10px] text-gray-400 italic font-semibold px-1"><i class="fa-solid fa-eye mr-1"></i>View Only</span>`;

                            unitHtml += `
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="px-3 py-2.5 whitespace-nowrap font-mono text-gray-900 font-medium text-left">${item.work_id}${seq ? ` <span class="text-gray-400 text-[11px]">(${seq})</span>` : ''}</td>
                                    <td class="px-3 py-2.5 whitespace-nowrap text-center">${fullSetBtnHtml}</td>
                                    <td class="px-3 py-2.5 whitespace-nowrap text-right">${actionHtml}</td>
                                </tr>`;
                        });

                        unitHtml += `</tbody></table></div></div>`;
                    });
                }

                const unitBlock = document.createElement('div');
                unitBlock.className = 'mb-4';
                unitBlock.innerHTML = unitHtml;
                container.appendChild(unitBlock);
            });
        }

        // ============ PDF -> IMAGE PAGE RENDERING (matches Technician view) ============
        async function renderPdfPagesAsElements(pdfUrl) {
            const pages = [];
            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const baseViewport = page.getViewport({ scale: 1 });
                    const scale = (794 * 2) / baseViewport.width;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.width = '100%';
                    img.style.display = 'block';
                    img.alt = `Quotation page ${i}`;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'print-page bg-white shadow-lg';
                    pageDiv.style.width = '210mm';
                    pageDiv.style.boxSizing = 'border-box';
                    pageDiv.appendChild(img);
                    pages.push(pageDiv);

                    canvas.width = 0;
                    canvas.height = 0;
                }
            } catch (err) {
                console.error('Failed to render PDF:', pdfUrl, err);
                const errDiv = document.createElement('div');
                errDiv.className = 'print-page bg-white p-8 shadow-lg w-[210mm] min-h-[297mm] flex items-center justify-center text-center';
                errDiv.innerHTML = `
                    <div>
                        <i class="fa-solid fa-triangle-exclamation text-xl text-amber-500 block mb-2"></i>
                        <p class="text-sm text-gray-600">Failed to display PDF.</p>
                        <a href="${pdfUrl}" target="_blank" class="text-blue-500 underline text-xs">Open PDF in new tab</a>
                    </div>`;
                pages.push(errDiv);
            }
            return pages;
        }

        async function previewFullSet(escapedGroupData) {
            const groupItems = JSON.parse(decodeURIComponent(escapedGroupData));
            const container = document.getElementById('bulkPagesContainer');

            container.innerHTML = '<div class="text-white text-sm p-4 animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Bundling Blueform documents...</div>';
            document.getElementById('bulkPreviewPage').style.display = 'block';

            try {
                let compositeHtml = '';
                const ids = groupItems.map(g => g.id);

                const payload = ids.length > 1
                    ? await buildBlueformDataGroup(ids)
                    : await buildBlueformData(ids[0]);

                if (payload && typeof buildBlueformHTML === 'function') {
                    compositeHtml += buildBlueformHTML(payload);
                } else {
                    compositeHtml += `
                        <div class="print-page bg-white p-8 shadow-lg w-[210mm] min-h-[297mm] text-red-500 font-bold flex items-center justify-center">
                            Error: buildBlueformData or buildBlueformHTML logic failed.
                        </div>
                    `;
                }

                container.innerHTML = compositeHtml;

                const linkedPdfs = [...new Set(groupItems.map(g => g.mapped_pdf_url).filter(Boolean))];

                if (linkedPdfs.length > 0) {
                    for (const pdfUrl of linkedPdfs) {
                        const pageEls = await renderPdfPagesAsElements(pdfUrl);
                        pageEls.forEach(el => container.appendChild(el));
                    }
                } else {
                    const noPdfDiv = document.createElement('div');
                    noPdfDiv.className = 'print-page bg-white p-12 shadow-lg w-[210mm] min-h-[297mm] flex flex-col items-center justify-center text-center';
                    noPdfDiv.style.color = 'gray';
                    noPdfDiv.innerHTML = `
                        <i class="fa-solid fa-file-pdf text-4xl text-gray-300 mb-2"></i>
                        <p class="text-sm font-semibold text-gray-600">No Linked Quotation PDF Found</p>
                        <p class="text-xs text-gray-400">Only the Blueform page will be printed for this record.</p>`;
                    container.appendChild(noPdfDiv);
                }

            } catch (error) {
                console.error("Error creating Blueform preview:", error);
                container.innerHTML = `<div class="text-red-400 p-4 font-mono text-xs">Error bundling documents: ${error.message}</div>`;
            }
        }

        function closeBulkPreview() {
            document.getElementById('bulkPreviewPage').style.display = 'none';
            document.getElementById('bulkPagesContainer').innerHTML = '';
        }

        // Handles both Approve and Reject (with a reason) status changes
        async function processAction(workId, nextStatus) {
            const perm = window.__lastPerm;
            if (perm && !perm.canActSection) { alert('Anda tiada kebenaran untuk membuat tindakan ini (View Only).'); return; }
            let updatePayload = { status: nextStatus };
            
            if (nextStatus === 'HOS-REJ') {
                const reason = prompt("Please enter the rejection reason:");
                if (reason === null) return; // Cancel action if the prompt is dismissed
                if (!reason.trim()) {
                    alert("A rejection reason is required!");
                    return;
                }
                updatePayload.reject_reason = reason.trim();
            } else {
                if (!confirm(`Are you sure you want to change the status of Work ID: ${workId} to ${nextStatus}?`)) return;
                updatePayload.reject_reason = null;

                if (nextStatus === 'APP-HOS') {
                    const stamps = await mergeApprovalStamp('work_orders', workId, 'section_head');
                    if (stamps) updatePayload.approval_stamps = stamps;
                }
            }

            try {
                const { error } = await supabaseClient
                    .from('work_orders')
                    .update(updatePayload)
                    .eq('work_id', workId);

                if (error) throw error;

                alert(`Successfully updated to status ${nextStatus}!`);
                fetchDashboard();

            } catch (err) {
                console.error("Error during processing:", err.message);
                alert("Failed to update status: " + err.message);
            }
        }

        window.onload = fetchDashboard;
    </script>
</body>
</html>
