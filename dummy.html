<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usage Trend Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">

<style>
:root{
    --ios-blue:#007AFF;
    --ios-green:#34C759;
    --ios-red:#FF3B30;
    --bg:#f2f2f7;
}

body{
    margin:0;
    font-family:-apple-system,system-ui,sans-serif;
    background:var(--bg);
    padding:15px;
}

/* HEADER */
.header{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.title{
    font-size:18px;
    font-weight:800;
    color:var(--ios-blue);
}

.subtitle{
    font-size:12px;
    color:#8e8e93;
}

/* ============================================================
   LIFECYCLE - BRANCH / TREE TIMELINE
   AWARD
      │
      ├── WO
      │    value
      │
      └── INTERIM
           value
             │
             └── CPC ── CMGD ── SFA
   ============================================================ */

.lifecycle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
    background:white;
    padding:18px 15px;
    border-radius:15px;
    margin-bottom:15px;
    overflow-x:auto;
}

/* AWARD */
.lifecycle-award{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:75px;
    flex-shrink:0;
}

.lifecycle-award .dot{
    margin-bottom:5px;
}

/* Branch area */
.lifecycle-branch{
    position:relative;
    width:180px;
    height:112px;
    flex-shrink:0;
}

/* Main split line from AWARD */
.branch-main{
    position:absolute;
    left:0;
    top:56px;
    width:32px;
    height:2px;
    background:#e5e5ea;
}

/* Vertical split */
.branch-split{
    position:absolute;
    left:32px;
    top:20px;
    width:2px;
    height:72px;
    background:#e5e5ea;
}

/* Upper branch to WO */
.branch-wo{
    position:absolute;
    left:32px;
    top:20px;
    width:48px;
    height:2px;
    background:#e5e5ea;
}

/* Lower branch to INTERIM */
.branch-interim{
    position:absolute;
    left:32px;
    top:92px;
    width:48px;
    height:2px;
    background:#e5e5ea;
}

/* WO node */
.branch-node-wo{
    position:absolute;
    left:80px;
    top:4px;
}

/* INTERIM node */
.branch-node-interim{
    position:absolute;
    left:80px;
    top:76px;
}

/* Node contents */
.branch-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:72px;
}

.branch-node .dot{
    margin-bottom:4px;
}

.branch-node .node-label{
    font-size:10px;
    font-weight:700;
    color:#1c1c1e;
    line-height:1.1;
}

.timeline-count{
    margin-top:2px;
    font-size:11px;
    font-weight:800;
    color:var(--ios-blue);
    line-height:1;
}

.timeline-count .count-value{
    color:var(--ios-blue);
}

/* Merge area after WO / INTERIM */
.lifecycle-merge{
    position:relative;
    width:52px;
    height:112px;
    flex-shrink:0;
}

/* Upper branch enters merge */
.merge-wo{
    position:absolute;
    left:0;
    top:20px;
    width:20px;
    height:2px;
    background:#e5e5ea;
}

/* Lower branch enters merge */
.merge-interim{
    position:absolute;
    left:0;
    top:92px;
    width:20px;
    height:2px;
    background:#e5e5ea;
}

/* Vertical merge */
.merge-vertical{
    position:absolute;
    left:20px;
    top:20px;
    width:2px;
    height:72px;
    background:#e5e5ea;
}

/* Single line leaving merge */
.merge-main{
    position:absolute;
    left:20px;
    top:56px;
    width:32px;
    height:2px;
    background:#e5e5ea;
}

/* Normal lifecycle node after merge */
.lifecycle-normal{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:62px;
    flex-shrink:0;
}

.lifecycle-normal .dot{
    margin-bottom:5px;
}

.lifecycle-normal span{
    font-size:10px;
    font-weight:700;
    color:#1c1c1e;
}

/* Connecting line */
.lifecycle-line{
    width:38px;
    height:2px;
    background:#e5e5ea;
    flex-shrink:0;
}

/* Existing step styles retained for compatibility */
.step{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:70px;
}

.dot{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#e5e5ea;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.done .dot{
    background:var(--ios-green);
    color:white;
}

.current .dot{
    background:var(--ios-blue);
    color:white;
}

.overdue .dot{
    background:var(--ios-red);
    color:white;
}

.line{
    flex:1;
    height:3px;
    background:#e5e5ea;
    border-radius:2px;
}

/* SUMMARY */
.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.card{
    background:white;
    padding:12px;
    border-radius:15px;
    text-align:center;
}

.label{
    font-size:10px;
    color:#8e8e93;
    font-weight:700;
}

.value{
    font-size:16px;
    font-weight:800;
    margin-top:5px;
    color:var(--ios-blue);
}

/* CHART */
.chartBox{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:15px;
    overflow:hidden;
}

th,td{
    padding:10px;
    font-size:12px;
    text-align:left;
    border-bottom:1px solid #eee;
}

th{
    background:#f9f9fb;
}

.timeline-count {
    font-size: 10px;
    font-weight: 800;
    color: var(--ios-blue);
    margin-top: 3px;
    line-height: 1.1;
}

.timeline-count .count-label {
    color: #8e8e93;
    margin-right: 2px;
}

.timeline-count .count-value {
    font-size: 11px;
    color: var(--ios-blue);
}

.timeline-wo {
    margin-top: 3px;
}

.timeline-interim {
    margin-top: 3px;
}

/* MOBILE */
@media(max-width:768px){
    .summary{
        grid-template-columns:repeat(2,1fr);
    }
        .timeline-count {
        font-size: 9px;
    }

    .timeline-count .count-value {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="title">CONTRACT HEALTH DASHBOARD</div>
    <div class="subtitle">Memuatkan data kontrak...</div>
</div>

<div class="lifecycle">

    <!-- AWARD -->
    <div class="lifecycle-award done">
        <div class="dot"><i class="fa fa-check"></i></div>
        <span>AWARD</span>
    </div>

    <!-- AWARD -> SPLIT -> WO / INTERIM -->
    <div class="lifecycle-branch">

        <div class="branch-main"></div>
        <div class="branch-split"></div>

        <div class="branch-wo"></div>
        <div class="branch-interim"></div>

        <!-- WO branch -->
        <div class="branch-node branch-node-wo done">
            <div class="dot"><i class="fa fa-check"></i></div>
            <div class="node-label">WO</div>
            <div class="timeline-count">
                <span class="count-value" id="woCount">0</span>
            </div>
        </div>

        <!-- INTERIM branch -->
        <div class="branch-node branch-node-interim current">
            <div class="dot"><i class="fa fa-clock"></i></div>
            <div class="node-label">INTERIM</div>
            <div class="timeline-count">
                <span class="count-value" id="interimCount">0</span>
            </div>
        </div>

    </div>

    <!-- WO + INTERIM -> MERGE -->
    <div class="lifecycle-merge">
        <div class="merge-wo"></div>
        <div class="merge-interim"></div>
        <div class="merge-vertical"></div>
        <div class="merge-main"></div>
    </div>

    <!-- CPC -->
    <div class="lifecycle-normal">
        <div class="dot">CPC</div>
        <span>CPC</span>
    </div>

    <div class="lifecycle-line"></div>

    <!-- CMGD -->
    <div class="lifecycle-normal">
        <div class="dot">CMGD</div>
        <span>CMGD</span>
    </div>

    <div class="lifecycle-line"></div>

    <!-- SFA -->
    <div class="lifecycle-normal">
        <div class="dot">SFA</div>
        <span>SFA</span>
    </div>

</div>

<div class="summary">
    <div class="card">
        <div class="label">CONTRACT VALUE</div>
        <div class="value" id="contractValue">RM 0.00</div>
    </div>

    <div class="card">
        <div class="label">USED</div>
        <div class="value" id="usedValue">RM 0.00</div>
    </div>

    <div class="card">
        <div class="label">BALANCE</div>
        <div class="value" id="balanceValue">RM 0.00</div>
    </div>

    <div class="card">
        <div class="label">PROGRESS</div>
        <div class="value" id="progressValue">0%</div>
    </div>
</div>

<div class="chartBox">
    <canvas id="chart"></canvas>
</div>

<table>
<thead>
<tr>
    <th>Month</th>
    <th>Planned</th>
    <th>Actual</th>
    <th>Variance</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const API_URL = "https://me-connect-api.mech-elec-ranhill.workers.dev";
const headers = {
    "Content-Type": "application/json"
};

let chartInstance = null;

function formatRM(value){
    return "RM " + Number(value || 0).toLocaleString("en-MY", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function updateRecordCounts(woCount, interimCount){
    const woEl = document.getElementById("woCount");
    const interimEl = document.getElementById("interimCount");

    if(woEl){
        woEl.innerText = Number(woCount || 0).toLocaleString("en-MY");
    }

    if(interimEl){
        interimEl.innerText = Number(interimCount || 0).toLocaleString("en-MY");
    }
}

async function loadDashboard(){
    try{
        // ID kontrak dikekalkan seperti fungsi asal.
        const contractId = 2;

        /* ==========================
           CONTRACT FETCH - CLOUDFLARE
        ========================== */
        const contractRes = await fetch(
            `${API_URL}/rest/v1/contract?id=eq.${encodeURIComponent(contractId)}&select=*`,
            { headers }
        );

        if(!contractRes.ok){
            throw new Error(`Gagal mendapatkan kontrak: HTTP ${contractRes.status}`);
        }

        const contractRows = await contractRes.json();
        const contract = Array.isArray(contractRows) ? contractRows[0] : null;

        if(!contract) {
            document.querySelector(".subtitle").innerHTML =
                `<span style="color:red;font-weight:bold;">Ralat: Kontrak ID ${contractId} tidak dijumpai!</span>`;
            updateRecordCounts(0, 0);
            return;
        }

        document.querySelector(".subtitle").innerHTML =
            (contract.contract_code || "N/A") + " • " +
            (contract.contract_name || "Tiada Nama Kontrak");

        /* ==========================
           WO + INTERIMS FETCH
           Kedua-duanya run simultaneously.
        ========================== */
        const [woRes, interimRes] = await Promise.all([
            fetch(
                `${API_URL}/rest/v1/work_orders?contract_id=eq.${encodeURIComponent(contractId)}&select=id,status`,
                { headers }
            ),
            fetch(
                `${API_URL}/rest/v1/interims?contract_id=eq.${encodeURIComponent(contractId)}&order=claim_date.asc&select=*`,
                { headers }
            )
        ]);

        if(!woRes.ok){
            throw new Error(`Gagal mendapatkan Work Order: HTTP ${woRes.status}`);
        }

        if(!interimRes.ok){
            throw new Error(`Gagal mendapatkan Interim: HTTP ${interimRes.status}`);
        }

        const rawWorkOrders = await woRes.json();
        const interims = await interimRes.json();

        /* ============================================================
           WO COUNT
           Abaikan:
           CANCEL / EXEC-REJ / HOS-REJ / HOD-REJ
           ============================================================ */
        const ignoredWOStatuses = new Set([
            "CANCEL",
            "EXEC-REJ",
            "HOS-REJ",
            "HOD-REJ"
        ]);

        const validWorkOrders = (Array.isArray(rawWorkOrders) ? rawWorkOrders : [])
            .filter(row => {
                const status = String(row.status || "")
                    .trim()
                    .toUpperCase();

                return !ignoredWOStatuses.has(status);
            });

        const safeInterims = Array.isArray(interims) ? interims : [];

        /* ==========================
           WO / INTERIM COUNT UPDATE
        ========================== */
        updateRecordCounts(
            validWorkOrders.length,
            safeInterims.length
        );

        const contractValue = Number(contract.contract_sum || 0);

        const totalUsed = safeInterims.reduce((sum, row) =>
            sum + Number(row.net_amount || row.claim_amount || 0), 0
        );

        const balance = contractValue - totalUsed;
        const progress = contractValue
            ? ((totalUsed / contractValue) * 100).toFixed(1)
            : 0;

        /* ==========================
           KPI INTERFACE UPDATE
        ========================== */
        document.getElementById("contractValue").innerText = formatRM(contractValue);
        document.getElementById("usedValue").innerText = formatRM(totalUsed);
        document.getElementById("balanceValue").innerText = formatRM(balance);
        document.getElementById("progressValue").innerText = progress + "%";

        /* ==========================
           MONTHLY DATA PROCESSING
        ========================== */
        const monthlyMap = {};

        safeInterims.forEach(item => {
            if(!item.claim_date) return;

            const date = new Date(item.claim_date);
            const month = date.toLocaleString("en", { month: "short" });

            monthlyMap[month] =
                (monthlyMap[month] || 0) +
                Number(item.net_amount || item.claim_amount || 0);
        });

        let months = Object.keys(monthlyMap);
        let actual = Object.values(monthlyMap);

        if(months.length === 0) {
            months = ["Jan", "Feb", "Mar"];
            actual = [0, 0, 0];
        }

        const planned = months.map(() => contractValue / 12);

        buildChart(months, planned, actual);
        buildTable(Object.keys(monthlyMap), planned, actual);
        updateLifecycle(contract, safeInterims);

    } catch(err) {
        console.error("Ralat Papan Pemuka:", err);
        updateRecordCounts(0, 0);
        alert(err.message || "Gagal memuatkan data dari Cloudflare Worker.");
    }
}

function buildChart(months, planned, actual){
    const ctx = document.getElementById("chart");
    if(!ctx) return;
    if(chartInstance){ chartInstance.destroy(); }

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: months,
            datasets: [
                { label: "Planned", data: planned, borderColor: "#8e8e93", borderDash: [6,4], fill: false, tension: 0.3 },
                { label: "Actual Interim Claims", data: actual, borderColor: "#007AFF", backgroundColor: "rgba(0,122,255,0.15)", fill: true, tension: 0.35, pointRadius: 5 }
            ]
        },
        options: { responsive: true, plugins: { legend: { position: "top" } }, scales: { y: { beginAtZero: true } } }
    });
}

function buildTable(months, planned, actual){
    const body = document.getElementById("tableBody");
    if(!body) return;
    body.innerHTML = "";

    if(months.length === 0) {
        body.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#8e8e93;">Tiada rekod tuntutan interim ditemui</td></tr>`;
        return;
    }

    months.forEach((m, i) => {
        const variance = (actual[i] || 0) - (planned[i] || 0);
        const color = variance > 0 ? "#FF3B30" : "#34C759";
        body.innerHTML += `<tr><td>${m}</td><td>${formatRM(planned[i])}</td><td>${formatRM(actual[i])}</td><td style="color:${color}; font-weight:700;">${formatRM(variance)}</td></tr>`;
    });
}

function updateLifecycle(contract, interims){
    const awardNode = document.querySelector(".lifecycle-award");
    const woNode = document.querySelector(".branch-node-wo");
    const interimNode = document.querySelector(".branch-node-interim");

    if(!awardNode || !woNode || !interimNode) return;

    awardNode.classList.remove("done", "current", "overdue");
    woNode.classList.remove("done", "current", "overdue");
    interimNode.classList.remove("done", "current", "overdue");

    /*
     * AWARD is completed once the contract exists.
     */
    if(contract){
        awardNode.classList.add("done");
    }

    /*
     * WO is the first branch after award.
     * Its count is displayed by updateRecordCounts().
     */
    woNode.classList.add("done");

    /*
     * INTERIM becomes current once at least one interim exists.
     * Otherwise WO remains the active stage.
     */
    if(interims.length > 0){
        interimNode.classList.add("current");
    } else {
        woNode.classList.remove("done");
        woNode.classList.add("current");
    }

    /*
     * Contract ended -> move lifecycle to CPC.
     * The branch remains visible; only CPC becomes active.
     */
    const cpcNode = document.querySelectorAll(".lifecycle-normal")[0];
    const cmgdNode = document.querySelectorAll(".lifecycle-normal")[1];
    const sfaNode = document.querySelectorAll(".lifecycle-normal")[2];

    [cpcNode, cmgdNode, sfaNode].forEach(node => {
        if(node) node.classList.remove("done", "current", "overdue");
    });

    if(contract && contract.contract_end){
        const today = new Date();
        const endDate = new Date(contract.contract_end);

        if(!isNaN(endDate.getTime()) && today > endDate){
            interimNode.classList.remove("current");
            interimNode.classList.add("done");

            if(cpcNode){
                cpcNode.classList.add("current");
            }
        }
    }
}

window.addEventListener("DOMContentLoaded", () => { loadDashboard(); });
</script>

</body>
</html>
