html, body {

padding: 0;

body {

    margin: 0;
    overflow: hidden;

    background-position: center;
    background-repeat: no-repeat;

<script>

window.addEventListener("DOMContentLoaded", async () => {

    if(typeof checkSession === "function") {
        await checkSession();
    }

    loadSections();

});


/* ==========================================================
   API
========================================================== */

const API_URL =
    "https://me-connect-api.mech-elec-ranhill.workers.dev";


/* ==========================================================
   INDEXEDDB CACHE
========================================================== */

const IDB_NAME = "MEConnectSectionsCache";

const IDB_VERSION = 1;

const IDB_STORE = "datasets";

const IDB_WO_KEY = "work_orders";

const IDB_INTERIM_KEY = "interims";

const IDB_META_KEY = "meta";


let idbPromise = null;


function openSectionsDB() {

    if(idbPromise) {
        return idbPromise;
    }

    idbPromise = new Promise((resolve, reject) => {

        const request = indexedDB.open(
            IDB_NAME,
            IDB_VERSION
        );

        request.onupgradeneeded = event => {

            const db = event.target.result;

            if(!db.objectStoreNames.contains(IDB_STORE)) {

                db.createObjectStore(
                    IDB_STORE
                );

            }

        };

        request.onsuccess = () => {

            resolve(request.result);

        };

        request.onerror = () => {

            console.error(
                "❌ IndexedDB open failed:",
                request.error
            );

            reject(request.error);

        };

    });

    return idbPromise;
}


async function idbGet(key) {

    const db = await openSectionsDB();

    return new Promise((resolve, reject) => {

        const tx = db.transaction(
            IDB_STORE,
            "readonly"
        );

        const store =
            tx.objectStore(IDB_STORE);

        const request =
            store.get(key);

        request.onsuccess = () => {

            resolve(request.result);

        };

        request.onerror = () => {

            reject(request.error);

        };

    });

}


async function idbSet(key, value) {

    const db = await openSectionsDB();

    return new Promise((resolve, reject) => {

        const tx = db.transaction(
            IDB_STORE,
            "readwrite"
        );

        const store =
            tx.objectStore(IDB_STORE);

        const request =
            store.put(value, key);

        request.onsuccess = () => {

            resolve();

        };

        request.onerror = () => {

            reject(request.error);

        };

    });

}


async function idbDelete(key) {

    const db = await openSectionsDB();

    return new Promise((resolve, reject) => {

        const tx = db.transaction(
            IDB_STORE,
            "readwrite"
        );

        const request =
            tx.objectStore(IDB_STORE)
                .delete(key);

        request.onsuccess = () => {

            resolve();

        };

        request.onerror = () => {

            reject(request.error);

        };

    });

}


/* ==========================================================
   CACHE META
========================================================== */

async function getCacheMeta() {

    return await idbGet(IDB_META_KEY);

}


async function setCacheMeta(meta) {

    await idbSet(
        IDB_META_KEY,
        meta
    );

}


/* ==========================================================
   FETCH ALL ROWS
========================================================== */

async function fetchAllRows(url) {

    console.log(
        "🔥 fetchAllRows:",
        url
    );

    let all = [];

    let from = 0;

    const pageSize = 1000;

    while(true) {

        console.log(
            `🔥 Reading rows ${from} - ${from + pageSize - 1}`
        );

        const res = await fetch(
            url,
            {
                headers: {
                    ...headers,
                    Range:
                        `${from}-${from + pageSize - 1}`
                }
            }
        );

        if(!res.ok) {

            throw new Error(
                `HTTP ${res.status} while fetching ${url}`
            );

        }

        const chunk =
            await res.json();

        if(!Array.isArray(chunk)) {

            throw new Error(
                "API returned non-array response"
            );

        }

        all = all.concat(chunk);

        console.log(
            `   ↳ received ${chunk.length}`
        );

        if(chunk.length < pageSize) {

            break;

        }

        from += pageSize;

    }

    console.log(
        `✅ fetchAllRows complete: ${all.length}`
    );

    return all;

}


/* ==========================================================
   GET TABLE COUNT
========================================================== */

async function getTableCount(tableName) {

    try {

        /*
         * Kita minta hanya 1 row tetapi Prefer count=exact
         * supaya Worker/PostgREST boleh pulangkan
         * Content-Range seperti:
         *
         * 0-0/5731
         */

        const res = await fetch(
            `${API_URL}/rest/v1/${tableName}?select=id&limit=1`,
            {
                method: "GET",

                headers: {
                    ...headers,
                    Prefer: "count=exact",
                    Range: "0-0"
                }
            }
        );

        if(!res.ok) {

            console.warn(
                `⚠️ Count request failed for ${tableName}:`,
                res.status
            );

            return null;

        }

        const contentRange =
            res.headers.get("Content-Range");

        console.log(
            `📊 ${tableName} Content-Range:`,
            contentRange
        );

        if(!contentRange) {

            console.warn(
                `⚠️ No Content-Range returned for ${tableName}`
            );

            return null;

        }

        /*
         * Format:
         *
         * 0-0/5731
         *
         * atau
         *
         * */*
         */

        const match =
            contentRange.match(/\/(\d+|\*)$/);

        if(!match) {

            console.warn(
                `⚠️ Unable to parse count for ${tableName}:`,
                contentRange
            );

            return null;

        }

        if(match[1] === "*") {

            return null;

        }

        return Number(match[1]);

    } catch(err) {

        console.warn(
            `⚠️ Count error for ${tableName}:`,
            err
        );

        return null;

    }

}


/* ==========================================================
   GET CACHED DATA
========================================================== */

async function getCachedDataset({
    tableName,
    cacheKey,
    countKey,
    select
}) {

    console.log(
        `📦 Checking cache for ${tableName}...`
    );

    const currentCount =
        await getTableCount(tableName);

    const cachedData =
        await idbGet(cacheKey);

    const meta =
        await getCacheMeta() || {};

    const cachedCount =
        Number(meta[countKey] || 0);


    /*
     * ======================================================
     * CASE 1
     * Count berjaya dibaca
     * dan count sama dengan cache
     * ======================================================
     */

    if(
        currentCount !== null &&
        currentCount === cachedCount &&
        Array.isArray(cachedData)
    ) {

        console.log(
            `⚡ CACHE HIT: ${tableName} (${cachedData.length} rows)`
        );

        return cachedData;

    }


    /*
     * ======================================================
     * CASE 2
     * Count berubah
     * ======================================================
     */

    if(
        currentCount !== null &&
        currentCount !== cachedCount
    ) {

        console.log(
            `🔄 CACHE INVALID: ${tableName} ${cachedCount} → ${currentCount}`
        );

    }


    /*
     * ======================================================
     * CASE 3
     * Cache belum ada
     * ======================================================
     */

    if(!Array.isArray(cachedData)) {

        console.log(
            `🆕 No cache found for ${tableName}`
        );

    }


    /*
     * ======================================================
     * REBUILD CACHE
     *
     * IMPORTANT:
     * Jangan filter status di URL.
     *
     * Semua WO mesti disimpan.
     *
     * CLAIMED / VO / CANCEL
     * semuanya masuk cache.
     * ======================================================
     */

    console.log(
        `🔄 Fetching fresh ${tableName}...`
    );

    const data =
        await fetchAllRows(
            `${API_URL}/rest/v1/${tableName}?${select}`
        );


    /*
     * Simpan dataset dahulu.
     */

    await idbSet(
        cacheKey,
        data
    );


    /*
     * Count sebenar daripada data yang diterima
     * lebih dipercayai jika API count tidak tersedia.
     */

    const realCount =
        data.length;


    const newMeta =
        await getCacheMeta() || {};


    newMeta[countKey] =
        currentCount !== null
            ? currentCount
            : realCount;


    newMeta[
        `${countKey}_updated_at`
    ] = Date.now();


    await setCacheMeta(
        newMeta
    );


    console.log(
        `💾 CACHE SAVED: ${tableName} (${data.length} rows)`
    );


    return data;

}


/* ==========================================================
   GLOBAL DOM
========================================================== */

/* ==========================================================
   FORMAT RM
========================================================== */

function formatRM(value) {

    return "RM " +
        Number(value).toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


/* ==========================================================
   FIND PROVISIONAL SUM KEY
========================================================== */

function findProvisionalSumKey(
    breakdown
) {

    if(!breakdown) {
        return null;
    }

    return Object.keys(
        breakdown
    ).find(k => {

        const item =
            breakdown[k];

        if(
            typeof item === "object" &&
            item.desc
        ) {

            return item.desc
                .toUpperCase()
                .trim() ===
                "PROVISIONAL SUM";

        }

        return false;

    });

}


/* ==========================================================
   PROVISIONAL SUM BALANCE
========================================================== */

function getProvisionalSumBalance(c) {

    const breakdown =
        c.contract_sections_breakdown ||
        {};

    const cache =
        contractClaimCache[c.id] ||
        {
            interimUsed: {},
            woUsed: {}
        };

    const voBreakdown =
        c.vo_breakdown ||
        {};


    const pSumKey =
        findProvisionalSumKey(
            breakdown
        );


    if(!pSumKey) {

        return {
            budget: 0,
            used: 0,
            balance: 0
        };

    }


    const keyUpper =
        pSumKey
            .toUpperCase()
            .trim();


    const pSumValue =
        breakdown[pSumKey] ||
        0;


    const baseAmt =
        Number(
            typeof pSumValue === "object"
                ? (
                    pSumValue.amt ||
                    pSumValue.amount ||
                    0
                )
                : pSumValue
        ) || 0;


    let voAmt = 0;


    Object.values(
        voBreakdown
    ).forEach(vo => {

        if(
            vo &&
            vo.breakdown &&
            vo.breakdown[pSumKey]
        ) {

            voAmt += Number(
                vo.breakdown[pSumKey].amt ||
                0
            );

        }

    });


    const budget =
        baseAmt + voAmt;


    const totalInterimClaim =
        Number(
            cache.interimUsed[keyUpper] ||
            0
        );


    const totalOngoingWO =
        Number(
            cache.woUsed[keyUpper] ||
            0
        );


    const used =
        totalInterimClaim +
        totalOngoingWO;


    const balance =
        budget - used;


    return {
        budget,
        used,
        balance
    };

}


/* ==========================================================
   FINANCIAL DEFICIT RISK
========================================================== */

function isFinancialDeficitRisk(c) {

    if(
        !c.contract_start ||
        !c.contract_end ||
        !c.contract_sections_breakdown
    ) {

        return false;

    }


    const hariIni =
        new Date();


    const start =
        new Date(
            c.contract_start
        );


    const end =
        new Date(
            c.contract_end
        );


    if(end < hariIni) {

        return false;

    }


    const totalMonths =
        Math.max(
            1,
            (
                (
                    end.getFullYear() -
                    start.getFullYear()
                ) * 12
            ) +
            (
                end.getMonth() -
                start.getMonth()
            )
        );


    let monthsElapsed =
        (
            (
                hariIni.getFullYear() -
                start.getFullYear()
            ) * 12
        ) +
        (
            hariIni.getMonth() -
            start.getMonth()
        ) +
        1;


    monthsElapsed =
        Math.min(
            totalMonths,
            Math.max(
                1,
                monthsElapsed
            )
        );


    const breakdown =
        c.contract_sections_breakdown ||
        {};


    const pSumKey =
        findProvisionalSumKey(
            breakdown
        );


    if(!pSumKey) {

        return false;

    }


    const financial =
        getProvisionalSumBalance(c);


    if(financial.budget === 0) {

        return false;

    }


    const plannedTotalToDate =
        (
            financial.budget /
            totalMonths
        ) *
        monthsElapsed;


    return (
        financial.used >
        plannedTotalToDate
    );

}


/* ==========================================================
   OPEN DETAIL
========================================================== */

function openDetail(type) {

    const configs = {

        ongoing: {

            title:
                "Ongoing Contracts",

            color:
                "#4ade80",

            render: c => ({

                code:
                    c.contract_code ||
                    c.id,

                sub:
                    c.contract_name ||
                    "",

                subClass:
                    ""

            })

        },


        renewal: {

            title:
                "Renewals Within 6 Months",

            color:
                "#fde047",

            render: c => ({

                code:
                    c.contract_code ||
                    c.id,

                sub:
                    c.contract_end
                        ? "Ends: " +
                          formatDate(
                              c.contract_end
                          )
                        : "",

                subClass:
                    "warn"

            })

        },


        cpc: {

            title:
                "Available for Closing",

            color:
                "#c084fc",

            render: c => ({

                code:
                    c.contract_code ||
                    c.id,

                sub:
                    c.contract_end
                        ? "Ended: " +
                          formatDate(
                              c.contract_end
                          )
                        : "",

                subClass:
                    ""

            })

        },


        risk: {

            title:
                "Financial Deficit Risk (S.O.R)",

            color:
                "#ff6b6b",

            render: c => {

                const financial =
                    getProvisionalSumBalance(
                        c
                    );


                let remainingText =
                    "Overdue";


                if(c.contract_end) {

                    const hariIni =
                        new Date();


                    const tarikhTamat =
                        new Date(
                            c.contract_end
                        );


                    if(
                        tarikhTamat >
                        hariIni
                    ) {

                        let diffY =
                            tarikhTamat.getFullYear() -
                            hariIni.getFullYear();


                        let diffM =
                            tarikhTamat.getMonth() -
                            hariIni.getMonth();


                        if(
                            tarikhTamat.getDate() <
                            hariIni.getDate()
                        ) {

                            diffM--;

                        }


                        if(diffM < 0) {

                            diffM += 12;

                            diffY--;

                        }


                        let parts = [];


                        if(diffY > 0) {

                            parts.push(
                                `${diffY} Year`
                            );

                        }


                        if(
                            diffM > 0 ||
                            parts.length === 0
                        ) {

                            parts.push(
                                `${diffM} Month`
                            );

                        }


                        remainingText =
                            "Duration: " +
                            parts.join(" ");

                    }

                }


                return {

                    code:
                        c.contract_code ||
                        c.id,

                    sub: `
                        <div
                            style="
                                font-size:11px;
                                color:#fde047;
                                font-weight:600;
                                margin-bottom:2px;
                            "
                        >
                            <i
                                class="fa-regular fa-clock"
                                style="
                                    font-size:10px;
                                    margin-right:3px;
                                "
                            ></i>
                            ${remainingText}
                        </div>

                        <div
                            class="danger"
                            style="font-weight:600;"
                        >
                            Balance:
                            ${formatRM(
                                financial.balance
                            )}
                        </div>
                    `,

                    subClass:
                        ""

                };

            }

        }

    };


    const cfg =
        configs[type];


    if(!cfg) {
        return;
    }


    const list =
        currentLists[type];


    detailPanelTitle.textContent =
        cfg.title;


    detailPanelTitle.style.color =
        cfg.color;


    detailPanelTitle.style.opacity =
        "1";


    if(list.length === 0) {

        detailList.innerHTML = `
            <div
                style="
                    opacity:0.4;
                    font-size:13px;
                    text-align:center;
                    margin-top:20px;
                "
            >
                No contracts
            </div>
        `;

    } else {

        detailList.innerHTML =
            list.map(c => {

                const rendered =
                    cfg.render(c);


                return `
                    <div class="detail-item">

                        <span
                            class="detail-item-code"
                        >
                            ${rendered.code}
                        </span>

                        <span
                            class="
                                detail-item-sub
                                ${rendered.subClass}
                            "
                        >
                            ${rendered.sub}
                        </span>

                    </div>
                `;

            }).join("");

    }


    detailPanel.classList.add(
        "visible"
    );

}


/* ==========================================================

function formatDate(dateStr) {

    const d =
        new Date(dateStr);


    return d.toLocaleDateString(
        "ms-MY",
        {
            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"
        }
    );

}

    if(
        n.includes("SELENGGARA")
    ) {

        return "MaintHelm.png";

    }


    if(
        n.includes("PEMATUHAN")
    ) {

        return "CompHelm.png";

    }


    if(
        n.includes("ASET")
    ) {

        return "AssetFinHelm.png";

    if(

    ) {

        return "ProjectsHelm.png";

    }


    if(
        n.includes("ADMIN")
    ) {

        return "AdminHelm.png";

    }


    return null;

}

/* ==========================================================
   LOAD SECTIONS
========================================================== */

async function loadSections(){

    console.count(
        "🔥 loadSections CALLED"
    );


    try {

        /*
         * ==================================================
         * SECTIONS
         * ==================================================
         */

        const sectionsPromise =
            fetch(
                `${API_URL}/rest/v1/me_sections?select=*,units(*,contract(id,contract_code,contract_name,contract_start,contract_end,contract_sum,contract_sections_breakdown,vo_breakdown))`,
                {
                    headers
                }
            )
            .then(r => {

                if(!r.ok) {

                    throw new Error(
                        `Sections HTTP ${r.status}`
                    );

                }

                return r.json();

            });


        /*
         * ==================================================
         * INTERIMS CACHE
         * ==================================================
         */

        const interimsPromise =
            allInterimsCache
                ? Promise.resolve(
                    allInterimsCache
                )
                : getCachedDataset({

                    tableName:
                        "interims",

                    cacheKey:
                        IDB_INTERIM_KEY,

                    countKey:
                        "interims_count",

                    select:
                        "select=contract_id,claim_breakdown"

                })
                .then(data => {

                    allInterimsCache =
                        data;

                    return data;

                });


        /*
         * ==================================================
         * WORK ORDERS CACHE
         *
         * IMPORTANT:
         * ALL STATUS DIAMBIL.
         *
         * Jangan:
         *
         * ?status=not.in.(...)
         *
         * kerana Financial Deficit Risk
         * perlu dataset lengkap.
         * ==================================================
         */

        const workOrdersPromise =
            allWorkOrdersCache
                ? Promise.resolve(
                    allWorkOrdersCache
                )
                : getCachedDataset({

                    tableName:
                        "work_orders",

                    cacheKey:
                        IDB_WO_KEY,

                    countKey:
                        "work_orders_count",

                    select:
                        "select=contract_id,section_category,additional,status"

                })
                .then(data => {

                    allWorkOrdersCache =
                        data;

                    return data;

                });


        /*
         * ==================================================
         * PARALLEL
         * ==================================================
         */

        const [
            sections,
            allInterims,
            allWOs
        ] = await Promise.all([

            sectionsPromise,

            interimsPromise,

            workOrdersPromise

        ]);


        console.log(
            "📊 Dataset ready:",
            {
                sections:
                    sections.length,

                interims:
                    allInterims.length,

                work_orders:
                    allWOs.length
            }
        );


        contractClaimCache = {};

        contractPSumKeyCache = {};


        /*
         * ==================================================
         * BUILD PSUM CACHE
         * ==================================================
         */

        sections.forEach(sec => {

            (sec.units || [])
                .forEach(u => {

                    (u.contract || [])
                        .forEach(c => {

                            if(
                                !c.id ||
                                !c.contract_sections_breakdown
                            ) {

                                return;

                            }


                            const pKey =
                                findProvisionalSumKey(
                                    c.contract_sections_breakdown
                                );


                            if(pKey) {

                                contractPSumKeyCache[c.id] =
                                    pKey
                                        .toUpperCase()
                                        .trim();

                            }

                        });

                });

        });


        /*
         * ==================================================
         * 1. ACCUMULATE INTERIM CLAIMS
         * ==================================================
         */

        allInterims.forEach(im => {

            if(
                !im.contract_id ||
                !im.claim_breakdown
            ) {

                return;

            }


            if(
                !contractClaimCache[
                    im.contract_id
                ]
            ) {

                contractClaimCache[
                    im.contract_id
                ] = {

                    interimUsed: {},

                    woUsed: {}

                };

            }


            Object.entries(
                im.claim_breakdown
            )
            .forEach(
                ([s, val]) => {

                    const amt =
                        Number(
                            typeof val === "object"
                                ? (
                                    val.amt ||
                                    val.amount ||
                                    0
                                )
                                : val
                        ) || 0;


                    const keyUpper =
                        s
                            .toUpperCase()
                            .trim();


                    contractClaimCache[
                        im.contract_id
                    ].interimUsed[
                        keyUpper
                    ] =
                        (
                            contractClaimCache[
                                im.contract_id
                            ].interimUsed[
                                keyUpper
                            ] || 0
                        ) + amt;

                }
            );

        });


        /*
         * ==================================================
         * 2. ACCUMULATE WORK ORDERS
         *
         * FILTER HANYA DI SINI.
         *
         * Cache TIDAK ditapis.
         * ==================================================
         */

        allWOs.forEach(wo => {

            if(!wo.contract_id) {
                return;
            }


            const statusUpper =
                wo.status
                    ? wo.status
                        .toUpperCase()
                        .trim()
                    : "";


            /*
             * CLAIMED
             *
             * Jangan padam daripada cache.
             * Tetapi jangan masuk sebagai ongoing WO.
             */

            if(
                statusUpper ===
                "CLAIMED"
            ) {

                return;

            }


            /*
             * VO
             */

            if(
                statusUpper ===
                "VARIATION ORDER" ||
                statusUpper ===
                "VO"
            ) {

                return;

            }


            /*
             * CANCEL
             */

            if(
                statusUpper ===
                "CANCEL"
            ) {

                return;

            }


            if(
                !contractClaimCache[
                    wo.contract_id
                ]
            ) {

                contractClaimCache[
                    wo.contract_id
                ] = {

                    interimUsed: {},

                    woUsed: {}

                };

            }


            const pSumKeyRaw =
                contractPSumKeyCache[
                    wo.contract_id
                ];


            /*
             * SECTION CATEGORY
             */

            if(
                wo.section_category
            ) {

                Object.entries(
                    wo.section_category
                )
                .forEach(
                    ([s, val]) => {

                        const amt =
                            Number(
                                typeof val === "object"
                                    ? (
                                        val.amt ||
                                        val.amount ||
                                        0
                                    )
                                    : val
                            ) || 0;


                        if(amt <= 0) {
                            return;
                        }


                        const keyUpper =
                            s
                                .toUpperCase()
                                .trim();


                        contractClaimCache[
                            wo.contract_id
                        ].woUsed[
                            keyUpper
                        ] =
                            (
                                contractClaimCache[
                                    wo.contract_id
                                ].woUsed[
                                    keyUpper
                                ] || 0
                            ) + amt;

                    }
                );

            }


            /*
             * ADDITIONAL → PROVISIONAL SUM
             */

            const secCat =
                wo.section_category ||
                {};


            const hasPSumInCat =
                Object.keys(
                    secCat
                ).some(
                    k =>
                        k
                            .toUpperCase()
                            .trim() ===
                        (
                            pSumKeyRaw
                                ? pSumKeyRaw
                                    .toUpperCase()
                                    .trim()
                                : "PROVISIONAL SUM"
                        )
                );


            const add =
                Number(
                    wo.additional || 0
                );


            if(
                add > 0 &&
                !hasPSumInCat
            ) {

                if(pSumKeyRaw) {

                    const pKeyUpper =
                        pSumKeyRaw
                            .toUpperCase()
                            .trim();


                    contractClaimCache[
                        wo.contract_id
                    ].woUsed[
                        pKeyUpper
                    ] =
                        (
                            contractClaimCache[
                                wo.contract_id
                            ].woUsed[
                                pKeyUpper
                            ] || 0
                        ) + add;

                }

            }

        });


        /*
         * ==================================================
         * BUILD WHEEL
         * ==================================================
         */

        items =
            sections.map(sec => ({

                id:
                    sec.id,

                title:
                    sec.section_name,

                units:
                    sec.units || []

            }));


        stepAngle =
            360 / items.length;


        createWheel();


    } catch(err) {

        console.error(
            "❌ Failed to load sections:",
            err
        );

    }

}


/* ==========================================================
   CREATE WHEEL
========================================================== */

function createWheel(){

    wheel.innerHTML = "";


    items.forEach(item => {

        const el =
            document.createElement(
                "div"
            );


        el.className =
            "item";


        const src =
            getHelmSrc(
                item.title
            );


        if(src) {

            el.innerHTML =
                `<img src="${src}" class="section-helm">`;

        } else {

            el.innerText =
                item.title;

        }


        wheel.appendChild(el);

    });


    itemEls =
        document.querySelectorAll(
            ".item"
        );


    itemEls.forEach(
        (el, i) => {

            el.addEventListener(
                "click",
                e => {

                    closeDetail();


                    if(!isMobile) {

                        let diff =
                            i - index;


                        if(
                            diff >
                            items.length / 2
                        ) {

                            diff -=
                                items.length;

                        }


                        if(
                            diff <
                            -items.length / 2
                        ) {

                            diff +=
                                items.length;

                        }


                        baseAngle -=
                            diff *
                            stepAngle;


                        index = i;


                        update();

                        render();

                        return;

                    }


                    index = i;


                    update();

                    render();


                    dismissFloating();


                    const img =
                        el.querySelector(
                            ".section-helm"
                        );


                    document.body.classList.add(
                        "hide-wheel"
                    );


                    if(img) {

                        const r =
                            img.getBoundingClientRect();


                        const fl =
                            document.createElement(
                                "img"
                            );


                        fl.src =
                            img.src;


                        fl.className =
                            "floating-helm";


                        fl.style.transition =
                            "none";


                        fl.style.top =
                            r.top + "px";


                        fl.style.left =
                            r.left + "px";


                        fl.style.width =
                            r.width + "px";


                        fl.style.height =
                            r.height + "px";


                        document.body.appendChild(
                            fl
                        );


                        currentFloating =
                            fl;


                        requestAnimationFrame(
                            () => {

                                requestAnimationFrame(
                                    () => {

                                        fl.style.transition =
                                            "";


                                        const cardH =
                                            card.offsetHeight ||
                                            220;


                                        const cardTop =
                                            window.innerHeight -
                                            cardH -
                                            20;


                                        fl.style.left =
                                            (
                                                window.innerWidth /
                                                2 -
                                                r.width /
                                                2
                                            ) + "px";


                                        fl.style.top =
                                            (
                                                cardTop -
                                                r.height -
                                                12
                                            ) + "px";

                                    }
                                );

                            }
                        );

                    }


                    setTimeout(
                        () => {

                            card.classList.add(
                                "show-mobile"
                            );

                        },
                        120
                    );

                }
            );

        }
    );


    positionItems();

    update();

    render();

}


/* ==========================================================
   FLOATING
========================================================== */

function dismissFloating(){

    if(currentFloating) {

        currentFloating.remove();

        currentFloating =
            null;

    }

}


/* ==========================================================
   POSITION
========================================================== */

function positionItems(){

    itemEls.forEach(
        (el, i) => {

            const theta =
                (
                    i /
                    items.length
                ) *
                Math.PI *
                2;


            const x =
                Math.cos(theta) *
                radius;


            const y =
                Math.sin(theta) *
                radius;


            const size =
                el.offsetWidth;


            el.style.left =
                `calc(50% + ${x}px - ${size/2}px)`;


            el.style.top =
                `calc(50% + ${y}px - ${size/2}px)`;

        }
    );

}


/* ==========================================================
   UPDATE DATA CARD
========================================================== */

function update(){

    if(itemEls.length === 0) {
        return;
    }


    closeDetail();


    itemEls.forEach(
        e =>
            e.classList.remove(
                "active"
            )
    );


    itemEls[index]
        .classList.add(
            "active"
        );


    const item =
        items[index];


    activeSection = {

        id:
            item.id,

        name:
            item.title

    };


    const newBgClass =
        getBackgroundClass(
            item.title
        );


    document.body.classList.remove(
        "bg-maint"
    );


    document.body.classList.add(
        newBgClass
    );


    title.innerText =
        item.title;


    cardTitle.innerText =
        item.title;


    currentLists = {

        ongoing: [],

        renewal: [],

        cpc: [],

        risk: []

    };


    const hariIni =
        new Date();


    const enamBulanLagi =
        new Date();


    enamBulanLagi.setMonth(
        hariIni.getMonth() + 6
    );


    item.units.forEach(
        u => {

            (u.contract || [])
                .forEach(c => {

                    if(!c.contract_end) {
                        return;
                    }


                    const tarikhTamat =
                        new Date(
                            c.contract_end
                        );


                    if(
                        isFinancialDeficitRisk(c)
                    ) {

                        currentLists
                            .risk
                            .push(c);

                    }


                    if(
                        tarikhTamat <
                        hariIni
                    ) {

                        currentLists
                            .cpc
                            .push(c);

                    } else if(
                        tarikhTamat <=
                        enamBulanLagi
                    ) {

                        currentLists
                            .renewal
                            .push(c);

                    } else {

                        currentLists
                            .ongoing
                            .push(c);

                    }

                });

        });


    cardDesc.innerHTML = `

        <div
            class="status-row"
            onclick="openDetail('ongoing')"
        >

            <span>
                Ongoing Contracts
            </span>

            <span
                class="status-badge"
                style="
                    background:rgba(34,197,94,0.15);
                    color:#4ade80;
                    border:1px solid rgba(34,197,94,0.3);
                "
            >
                ${currentLists.ongoing.length}
            </span>

        </div>


        <div
            class="status-row"
            onclick="openDetail('renewal')"
        >

            <span>
                Contracts Renewals (Within 6M)
            </span>

            <span
                class="status-badge"
                style="
                    background:rgba(234,179,8,0.15);
                    color:#fde047;
                    border:1px solid rgba(234,179,8,0.3);
                "
            >
                ${currentLists.renewal.length}
            </span>

        </div>


        <div
            class="status-row"
            onclick="openDetail('cpc')"
        >

            <span>
                Available for Closing
            </span>

            <span
                class="status-badge"
                style="
                    background:rgba(147,51,234,0.15);
                    color:#c084fc;
                    border:1px solid rgba(147,51,234,0.3);
                "
            >
                ${currentLists.cpc.length}
            </span>

        </div>


        <div
            class="status-row"
            onclick="openDetail('risk')"
        >

            <span>
                Financial Deficit Risk (S.O.R)
            </span>

            <span
                class="status-badge"
                style="
                    background:rgba(255,59,48,0.15);
                    color:#ff6b6b;
                    border:1px solid rgba(255,59,48,0.3);
                "
            >
                ${currentLists.risk.length}
            </span>

        </div>

    `;


    openBtn.innerText =
        "Open Dashboard";


    if(!isMobile) {

        card.classList.remove(
            "show"
        );


        void card.offsetWidth;


        card.classList.add(
            "show"
        );

    }

}


/* ==========================================================
   RENDER
========================================================== */

function render(){

    if(itemEls.length === 0) {
        return;
    }


    wheel.style.transform =
        `translateY(-50%) rotate(${baseAngle}deg)`;


    itemEls.forEach(
        el => {

            el.style.transform =
                `rotate(${-baseAngle}deg) scale(0.9)`;

        }
    );


    const activeScale =
        window.innerWidth >= 1800
            ? 1.35
            : 1.25;


    itemEls[index].style.transform =
        `rotate(${-baseAngle}deg) scale(${activeScale})`;

}


/* ==========================================================
   NAVIGATION
========================================================== */

function next(){

    index =
        (index + 1) %
        items.length;


    baseAngle -=
        stepAngle;


    closeDetail();

    update();

    render();

}


function prev(){

    index =
        (index - 1 + items.length) %
        items.length;


    baseAngle +=
        stepAngle;


    closeDetail();

    update();

    render();

}


/* ==========================================================
   MOUSE WHEEL
========================================================== */

let buffer = 0;


window.addEventListener(
    "wheel",
    e => {

        if(lock) {
            return;
        }


        lock = true;


        buffer +=
            e.deltaY;


        if(buffer > 80) {

            next();

            buffer = 0;

        }


        if(buffer < -80) {

            prev();

            buffer = 0;

        }


        setTimeout(
            () => {
                lock = false;
            },
            120
        );

    },
    {
        passive:true
    }
);


/* ==========================================================
   TOUCH
========================================================== */

let startX = 0;


const isCardOpen =
    () =>
        card.classList.contains(
            "show-mobile"
        );


window.addEventListener(
    "touchstart",
    e => {

        if(isCardOpen()) {
            return;
        }


        startX =
            e.touches[0].clientX;

    },
    {
        passive:true
    }
);


window.addEventListener(
    "touchend",
    e => {

        if(isCardOpen()) {
            return;
        }


        const diff =
            startX -
            e.changedTouches[0].clientX;


        if(
            Math.abs(diff) < 40
        ) {

            return;

        }


        if(diff > 0) {

            next();

        } else {

            prev();

        }

    },
    {
        passive:true
    }
);


/* ==========================================================
   MOBILE CLICK OUTSIDE
========================================================== */

document.addEventListener(
    "click",
    e => {

        if(!isMobile) {
            return;
        }


        if(
            !card.contains(e.target) &&
            !e.target.closest(".item") &&
            e.target.id !== "openBtn"
        ) {

            card.classList.remove(
                "show-mobile"
            );


            document.body.classList.remove(
                "hide-wheel"
            );


            dismissFloating();

            closeDetail();

        }

    }
);


/* ==========================================================
   KEYBOARD
========================================================== */

window.addEventListener(
    "keydown",
    e => {

        if(e.key === "Escape") {

            closeDetail();

        }


        if(
            e.key === "ArrowLeft" ||
            e.key === "ArrowUp"
        ) {

            prev();

        }


        if(
            e.key === "ArrowRight" ||
            e.key === "ArrowDown"
        ) {

            next();

        }

    }
);

</script>


<script>

if("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "cache.js"
    )
    .then(() =>
        console.log(
            "Service Worker Registered"
        )
    )
    .catch(
        err =>
            console.error(
                err
            )
    );

}

</script>
