<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #a1c4fd;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0; padding: 20px;
            color: #1d1d1f;
        }
        .container { max-width: 500px; margin: auto; }
        .header {
            background: rgba(255,255,255,0.8);
            padding: 20px; border-radius: 20px;
            text-align: center; margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .staf-card {
            background: white;
            padding: 15px; border-radius: 15px;
            margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .info-section { flex: 1; padding-right: 10px; }
        .status-section { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

        .badge {
            padding: 6px 12px; border-radius: 10px;
            font-size: 10px; font-weight: bold; color: white;
            min-width: 90px; text-align: center;
        }
        .delete-btn {
            background: rgba(255, 59, 48, 0.1);
            color: #FF3B30;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-btn:hover { background: #FF3B30; color: white; }

        .status-hadir { background: #34C759; } 
        .status-kerja { background: #007AFF; } 
        .status-cuti { background: #FF3B30; } 

        .btn-group { display: flex; gap: 8px; align-items: center; }

        .refresh-btn { 
            background: none; 
            border: none;
            color: #007AFF; 
            cursor: pointer;
            font-size: 18px;
            padding: 5px 0 5px 10px; 
            margin: 0;
            display: inline-flex; justify-content: center; align-items: center;
        }

        .tv-btn {
            background: #5856D6; color: white; border: none;
            padding: 8px 12px; border-radius: 10px; cursor: pointer;
            font-weight: bold; font-size: 12px;
        }

        .refresh-btn:disabled, .tv-btn:disabled, .res-btn:disabled { opacity: 0.6; pointer-events: none; }

        .res-btn {
            background: #34C759; color: white; border: none;
            padding: 8px 12px; border-radius: 10px; cursor: pointer;
            font-weight: bold; font-size: 12px;
        }

        h2 { margin: 10px 0 0 0; letter-spacing: 1px; font-size: 20px; }

        /* Custom Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            width: 85%; max-width: 320px;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #1d1d1f; }
        .modal-desc { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.4; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .modal-btn-confirm { background: #FF3B30; color: white; }
        .modal-btn-cancel { background: #E5E5EA; color: #1d1d1f; }
        .modal-btn-ok { background: #007AFF; color: white; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="display:flex; justify-content:space-between; align-items: center;">
            <button onclick="window.location.href='index.html'" style="border:none; background:none; color:#007AFF; cursor:pointer; font-weight: bold; font-size: 14px;">
                <i class="fa-solid fa-chevron-left"></i> RETURN
            </button>

            <div class="btn-group">
                <button class="tv-btn" onclick="window.location.href='dashboard-tv.html'">
                    <i class="fa-solid fa-tv"></i> TV MODE
                </button>
                <button class="res-btn" onclick="window.location.href='dashboard-response.html'">
                    <i class="fa-solid fa-clipboard-list"></i> RESPONSE
                </button>
                <button id="refBtnText" class="refresh-btn" onclick="fetchAllStatus(true)" title="Refresh Staff List">
                    <i id="refIcon" class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>
        <h2>ATTENDANCE RECORDS</h2>
        <p id="todayDate" style="font-size:12px; opacity:0.6; font-weight: bold; margin-top: 5px;"></p>
    </div>

    <div id="mainList">Retrieving Attendance Lists</div>
</div>

<!-- CUSTOM MODAL HTML -->
<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <div id="modalTitle" class="modal-title">Notice</div>
        <div id="modalDesc" class="modal-desc">Message content goes here.</div>
        <div id="modalButtons" class="modal-buttons"></div>
    </div>
</div>

<script>
    const API_URL = "https://me-connect-api.mech-elec-ranhill.workers.dev";

    // Custom Popup Dialog Handler
    function showModal(title, text, type = 'alert', onConfirm = null) {
        const modal = document.getElementById('customModal');
        const mTitle = document.getElementById('modalTitle');
        const mDesc = document.getElementById('modalDesc');
        const mBtns = document.getElementById('modalButtons');

        mTitle.innerText = title;
        mDesc.innerText = text;
        mBtns.innerHTML = '';

        if (type === 'confirm') {
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'modal-btn modal-btn-cancel';
            cancelBtn.innerText = 'Cancel';
            cancelBtn.onclick = closeModal;

            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'modal-btn modal-btn-confirm';
            confirmBtn.innerText = 'Confirm';
            confirmBtn.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };

            mBtns.appendChild(cancelBtn);
            mBtns.appendChild(confirmBtn);
        } else {
            const okBtn = document.createElement('button');
            okBtn.className = 'modal-btn modal-btn-ok';
            okBtn.innerText = 'OK';
            okBtn.onclick = closeModal;
            mBtns.appendChild(okBtn);
        }

        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    async function fetchAllStatus(forceRefresh = false) {
        const list = document.getElementById('mainList');
        const icon = document.getElementById('refIcon');
        const btn = document.getElementById('refBtnText');

        list.innerHTML = "<div style='text-align:center; padding:20px;'>CHECKING DATABASE</div>";

        if(forceRefresh && icon && btn) {
            btn.disabled = true;
            icon.classList.add('fa-spin');
        }

        const hierarki = {
            'KETUA JABATAN': 1, 'KETUA SEKSYEN': 2, 'EKSEKUTIF KANAN': 3,
            'EKSEKUTIF': 4, 'JURUTEKNIK': 5, 'PENYELIA PENTADBIRAN': 6,
            'PEMBANTU PENTADBIRAN': 7, 'KERANI': 8
        };

        try {
            let allStaff = [];
            const CACHE_KEY = 'staff_data_cache';
            const CACHE_TIME_KEY = 'staff_data_time';
            const ONE_DAY = 24 * 60 * 60 * 1000;

            if (forceRefresh) {
                console.log("Clearing outdated staff cache...");
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(CACHE_TIME_KEY);
            }

            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
            const now = new Date().getTime();

            if (cachedData && cachedTime && (now - cachedTime < ONE_DAY)) {
                console.log("Using staff data from browser cache...");
                allStaff = JSON.parse(cachedData);
            } else {
                console.log("Fetching latest staff data from Worker API...");
                const resS = await fetch(API_URL + '/staff');
                allStaff = await resS.json();
                
                localStorage.setItem(CACHE_KEY, JSON.stringify(allStaff));
                localStorage.setItem(CACHE_TIME_KEY, now.toString());
            }

            console.log("Fetching live absence status from Worker API...");
            const resA = await fetch(API_URL + '/attendance');
            const allAtt = await resA.json();

            const sekarang = new Date();
            const hariIni = new Date(sekarang.getFullYear(), sekarang.getMonth(), sekarang.getDate()).getTime();

            allStaff.sort((a, b) => {
                const jA = (a.position || "").toUpperCase().trim();
                const jB = (b.position || "").toUpperCase().trim();
                return (hierarki[jA] || 99) - (hierarki[jB] || 99) ||
                    (a.name || "").localeCompare(b.name || "");
            });

            list.innerHTML = "";

            allStaff.forEach(staf => {
                const sNama = (staf.name || "").toUpperCase().trim();

                const record = allAtt.find(a => {
                    const namaAtt = (a.name || "").toUpperCase().trim();
                    if (namaAtt !== sNama) return false;

                    const tMulaParts = a.start_date.split('-');
                    const tAkhirParts = a.end_date.split('-');
                    
                    const tMula = new Date(tMulaParts[0], tMulaParts[1] - 1, tMulaParts[2]).getTime();
                    const tAkhir = new Date(tAkhirParts[0], tAkhirParts[1] - 1, tAkhirParts[2]).getTime();
                    
                    return hariIni >= tMula && hariIni <= tAkhir;
                });

                let sText = "PRESENT";
                let sClass = "status-hadir";
                let sSub = (staf.position || "").toUpperCase();
                let deleteButtonHtml = "";

                if (record) {
                    sText = (record.reason || "OFFSITE").toUpperCase();
                    sClass = (sText.includes("CUTI") || sText.includes("SAKIT") || sText.includes("LEAVE") || sText.includes("HALFDAY")) ? "status-cuti" : "status-kerja";
                    sSub = sSub + " • UNTIL: " + record.end_date;

                    deleteButtonHtml = `
                        <button class="delete-btn" onclick="padamRekod('${record.id}', '${sNama}')">
                            <i class="fa-solid fa-xmark"></i> PRESENT
                        </button>`;
                }

                list.innerHTML += `
                    <div class="staf-card">
                        <div class="info-section">
                            <div style="font-weight:bold; font-size:14px;">${sNama}</div>
                            <div style="font-size:10px; color:gray; margin-top:3px;">${sSub}</div>
                        </div>
                        <div class="status-section">
                            <div class="badge ${sClass}">${sText}</div>
                            ${deleteButtonHtml}
                        </div>
                    </div>`;
            });

            if (forceRefresh && icon && btn) {
                showModal("Success", "Staff list & attendance records updated successfully!");
            }

        } catch (err) {
            list.innerHTML = "<div style='color:red; text-align:center;'>ERROR: " + err.message.toUpperCase() + "</div>";
        } finally {
            if (icon && btn) {
                btn.disabled = false;
                icon.classList.remove('fa-spin');
            }
        }
    }

    function padamRekod(id, name) {
        showModal(
            "Confirm Action",
            `Are you sure ${name} is now PRESENT?`,
            'confirm',
            async () => {
                try {
                    const res = await fetch(
                        `${API_URL}/attendance/${id}`,
                        { method: 'DELETE' }
                    );

                    if (!res.ok) {
                        const err = await res.text();
                        throw new Error(err);
                    }

                    showModal("Success", "Record deleted. Status updated to PRESENT.");
                    fetchAllStatus(false);

                } catch (err) {
                    console.error(err);
                    showModal("Error", "Failed to delete record: " + err.message);
                }
            }
        );
    }

    const opsi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-US', opsi).toUpperCase();

    window.onload = () => fetchAllStatus(false);
</script>

</body>
</html>
