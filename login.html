<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://me-connect-api.mech-elec-ranhill.workers.dev; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline';">
<title>M&E Connect Sign In</title>

<link rel="preload" href="Submarine.png" as="image" type="image/png">
<link rel="preload" href="logo.svg" as="image" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css?family=Lato:300,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:'Lato',sans-serif;
    background:#fff;
}

.floating-home-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100001;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    color: white;
    text-decoration: none;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.floating-home-btn i {
    font-size: 18px;
    transition: transform 0.3s ease;
}

.floating-home-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    color: #ffffff;
}

.floating-home-btn:hover i {
    transform: scale(1.1);
}

.floating-home-btn:active {
    transform: translateY(-1px) scale(0.98);
}

@media (max-width: 768px) {
    .floating-home-btn {
        top: 15px;
        left: 15px;
        width: 42px;
        height: 42px;
    }
    .floating-home-btn i {
        font-size: 16px;
    }
}

.header{
    position:relative;
    text-align:center;
    overflow:hidden;
    background:
    radial-gradient(circle at top,
        rgba(255,255,255,.15),
        transparent 35%),
    linear-gradient(
        60deg,
        #0b3d91 0%,
        #0077b6 40%,
        #00b4d8 100%
    );
    color:white;
    overflow:visible;
}

.header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at 20% 80%,
        rgba(255,255,255,.18),
        transparent 25%),
    radial-gradient(circle at 80% 20%,
        rgba(255,255,255,.10),
        transparent 30%);
    filter:blur(40px);
    animation:fogMove 10s ease-in-out infinite alternate;
}

@keyframes fogMove{
    from{ transform:translateX(-30px) translateY(0); }
    to{ transform:translateX(30px) translateY(-20px); }
}

.flex{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.inner-header{
    position:relative;
    z-index:20; 
    height:65dvh;
    width:100%;
    margin:0;
    padding:0;
    flex-direction:column;
}

.login-box{
    position:absolute;
    top:calc(50% + 90px);
    left:50%;
    transform:translateX(-50%) translateY(20px);
    width:320px;
    max-width:90%;
    display:flex;
    flex-direction:column;
    gap:10px;
    opacity:0;
    pointer-events:none;
    z-index:10000;
}

.login-box input{
    width:100%;
    padding:14px 16px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.20);
    border-radius:14px;
    color:white;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-sizing:border-box;
    outline:none;
    transition:.25s;
}

.login-box input::placeholder{
    color:rgba(255,255,255,.75);
}

.login-box input:focus{
    border-color:rgba(255,255,255,.45);
    background:rgba(255,255,255,.20);
    box-shadow:0 0 0 3px rgba(255,255,255,.10);
}

.password-wrapper{
    position:relative;
    width:100%;
}

.password-wrapper input{
    padding-right:50px;
}

.toggle-password{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:rgba(255,255,255,.85);
}

.toggle-password i{
    font-size:18px;
    line-height:1;
}

.login-box button{
    margin-top:5px;
    border-radius:14px;
    height:48px;
    padding:0 16px;
    cursor:pointer;
    background:rgba(34,197,94,0.18);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(34,197,94,0.35);
    color:rgba(0,0,0,0.85);
    font-weight:700;
    box-shadow:0 8px 25px rgba(34,197,94,0.25);
    transition:.25s;
}

.login-box button:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}
    .login-box .guest-btn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.45);
    box-shadow:none;
    color:#fff;
}

.login-box.show{
    animation:fadeLogin .8s ease forwards;
    pointer-events:auto;
}

@keyframes fadeLogin {
    from {
        opacity:0;
        transform:translateX(-50%) translateY(30px);
    }
    to {
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

.fish{
    position:absolute;
    width:180px;
    height:auto;
    right:-250px;
    top:42%;
    transform:translateY(-50%);
    z-index:30;
    opacity:0;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.25));
}

.fish.start{
    animation:fishSwim 3s ease forwards;
}

@keyframes fishSwim{
    0%{
        right:-250px;
        opacity:0;
        transform:translateY(-50%);
    }
    10%{
        opacity:1;
    }
    45%{
        right:50%;
        transform:translate(50%,-50%);
    }
    60%{
        right:50%;
        opacity:1;
        transform:translate(50%,-50%) scale(1.05);
    }
    100%{
        right:120%;
        opacity:0;
        transform:translateY(-50%);
    }
}

h1{
    font-weight:300;
    letter-spacing:2px;
    font-size:48px;
    margin-top:20px;
    opacity:0;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.35));
}

h1.start{
    animation:fadeUp 1s ease forwards;
    animation-delay:2s;
}

.logo{
    width:140px;
    height:auto;
    opacity:0;
    clip-path:circle(0% at 50% 50%);
    filter:drop-shadow(0 0 20px rgba(255,255,255,.35)) drop-shadow(0 10px 25px rgba(0,0,0,.2));
}

.logo.start{
    animation:waterReveal 1.4s cubic-bezier(.2,.8,.2,1) forwards, floatLogo 7s ease-in-out infinite 4s;
    animation-delay:2s,4s;
}

@keyframes waterReveal{
    0%{
        opacity:0;
        clip-path:circle(0% at 50% 50%);
        filter:blur(10px);
        transform:scale(.8);
    }
    40%{
        opacity:1;
    }
    100%{
        opacity:1;
        clip-path:circle(150% at 50% 50%);
        filter:blur(0px);
        transform:scale(1);
    }
}

@keyframes floatLogo{
    0%{ transform:translateY(0px); }
    50%{ transform:translateY(-10px); }
    100%{ transform:translateY(0px); }
}

.waves{
    position:relative;
    width:100%;
    height:15vh;
    margin-bottom:-7px;
    min-height:100px;
    max-height:150px;
    z-index:1;
}

.parallax > use{
    animation:move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
}

.parallax > use:nth-child(1){ animation-delay:-2s; animation-duration:7s; }
.parallax > use:nth-child(2){ animation-delay:-3s; animation-duration:10s; }
.parallax > use:nth-child(3){ animation-delay:-4s; animation-duration:13s; }
.parallax > use:nth-child(4){ animation-delay:-5s; animation-duration:20s; }

@keyframes move-forever{
    0%{ transform:translate3d(-90px,0,0); }
    100%{ transform:translate3d(85px,0,0); }
}

.login-options {
    display:flex;
    justify-content:flex-end;
    align-items:center;
    width:100%;
    margin-top:2px;
}

.content{
    position:relative;
    height:20dvh;
    text-align:center;
    background:white;
}

p{
    letter-spacing:1px;
    font-size:14px;
    color:#333;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){
    .waves{
        height:40px;
        min-height:40px;
    }
    .content{
        height:30vh;
    }
    h1{
        font-size:24px;
    }
    .logo{
        width:110px;
    }
}

input{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    border-radius:14px;
    box-sizing:border-box;
    outline:none;
}

.logo-click{
    position:relative;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-ripple{
    position:absolute;
    width:140px;
    height:140px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    opacity:0;
    pointer-events:none;
}

.logo-ripple.start.ripple-a{
    animation:logoRipple 3s ease-out infinite;
    animation-delay:3.2s;
}

.logo-ripple.start.ripple-b{
    animation:logoRipple 3s ease-out infinite;
    animation-delay:4.2s;
}

@keyframes logoRipple{
    0%{
        transform:scale(.8);
        opacity:0;
    }
    15%{
        opacity:.6;
    }
    100%{
        transform:scale(2.2);
        opacity:0;
    }
}
</style>
</head>

<body>
<div class="header">
    <a href="#" onclick="goBack()" class="floating-home-btn" title="Main Menu">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="inner-header flex">
        <img src="Submarine.png" class="fish">

        <div class="logo-click">
            <div class="logo-ripple ripple-a"></div>
            <div class="logo-ripple ripple-b"></div>
            <img src="logo.svg" class="logo">
        </div>

        <h1>M&E Connect</h1>

        <div id="loginBox" class="login-box">
            <input id="username" type="text" placeholder="Employee ID">
            <div class="password-wrapper">
                <input id="password" type="password" placeholder="Password">
                <span id="togglePassword" class="toggle-password">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <div class="login-options">
                <div style="font-size:12px;">
                    <a href="#" onclick="forgotPassword()" style="color:#fff; opacity:0.8; text-decoration:none;">
                        Forgot password?
                    </a>
                </div>
            </div>

            <button onclick="login()">Login</button>
            <button class="guest-btn" onclick="guestLogin()">Continue as Guest</button>
        </div>
    </div>

    <div>
        <svg class="waves"
             xmlns="http://www.w3.org/2000/svg"
             xmlns:xlink="http://www.w3.org/1999/xlink"
             viewBox="0 24 150 28"
             preserveAspectRatio="none"
             shape-rendering="auto">
            <defs>
                <path id="gentle-wave"
                      d="M-160 44c30 0 58-18 88-18s58 18 88 18
                         58-18 88-18 58 18 88 18v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#ffffff" />
            </g>
        </svg>
    </div>
</div>

<div class="content flex">
    <p>M&E | Mechanical & Electrical Department</p>
</div>

<script>
const API_URL = "https://me-connect-api.mech-elec-ranhill.workers.dev";

function showCustomPopup(message) {
    return new Promise((resolve) => {
        const style = document.createElement('style');
        style.textContent = `
            @keyframes agFadeIn { from { opacity: 0; } to { opacity: 1; } }
            @keyframes agPopIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        `;
        document.head.appendChild(style);

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999999;animation:agFadeIn 0.2s ease-out;';

        const box = document.createElement('div');
        box.style.cssText = 'background:#ffffff;padding:28px 24px;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);width:100%;max-width:360px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;animation:agPopIn 0.25s cubic-bezier(0.16,1,0.3,1);box-sizing:border-box;margin:16px;';

        const iconContainer = document.createElement('div');
        iconContainer.style.cssText = 'width:56px;height:56px;background:#fef2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;';
        iconContainer.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

        const title = document.createElement('h3');
        title.style.cssText = 'margin:0 0 8px 0;font-size:18px;font-weight:600;color:#0f172a;';
        title.textContent = 'M&E Connect';

        const msg = document.createElement('p');
        msg.style.cssText = 'margin:0 0 24px 0;font-size:14px;color:#64748b;line-height:1.5;';
        msg.textContent = message;

        const btn = document.createElement('button');
        btn.style.cssText = 'width:100%;background:#2563eb;color:#ffffff;border:none;padding:10px 16px;font-size:14px;border-radius:8px;cursor:pointer;font-weight:500;transition:background 0.2s;outline:none;';
        btn.textContent = 'OK';

        btn.onmouseover = () => btn.style.background = '#1d4ed8';
        btn.onmouseout = () => btn.style.background = '#2563eb';

        btn.onclick = () => {
            document.body.removeChild(overlay);
            document.head.removeChild(style);
            resolve();
        };

        box.appendChild(iconContainer);
        box.appendChild(title);
        box.appendChild(msg);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    });
}

function getRedirectTarget() {
    const from = new URLSearchParams(window.location.search).get("from");
    return from === "userdirectory" ? "userdirectory.html" : "sections.html";
}

async function login(){
    const employeeId = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if(!employeeId || !pass){
        await showCustomPopup("Please enter Employee ID and Password.");
        return;
    }

    try{
        const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                employee_id: employeeId,
                password: pass
            })
        });

        const result = await res.json();

        if(!res.ok || !result.success || !result.staff){
            await showCustomPopup(result.error || "Employee ID atau Password tidak sah.");
            return;
        }

        const staffData = result.staff;

        localStorage.setItem("loggedIn","true");
        localStorage.setItem("staff_id",staffData.id);
        localStorage.setItem("userId",staffData.employee_id);
        localStorage.setItem("employee_id",staffData.employee_id);
        localStorage.setItem("staff_name",staffData.name);
        localStorage.setItem("role",staffData.position || "");
        localStorage.setItem("avatar_url",staffData.avatar_url || "");
        localStorage.setItem("phone_no",staffData.phone_no || "");
        localStorage.setItem("initial",staffData.initial || "");
        localStorage.setItem("signature",staffData.signature || "");
        localStorage.setItem("me_user",staffData.employee_id);
        localStorage.setItem("lastActivity",Date.now());
        localStorage.setItem("me_token", result.token || "");

        window.location.href = getRedirectTarget();

    }catch(err){
        console.error(err);
        await showCustomPopup("Server Error");
    }
}

    async function guestLogin(){
    try{
        const res = await fetch(`${API_URL}/guest-login`, { method: "POST" });
        const result = await res.json();

        if(!res.ok || !result.success || !result.token){
            await showCustomPopup("Guest access is not available right now.");
            return;
        }

        // Buang sesi lama tetapi kekalkan nama pengguna yang diingat
        const keepUser = localStorage.getItem("me_user");
        localStorage.clear();
        if (keepUser) localStorage.setItem("me_user", keepUser);

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("role", "guest");
        localStorage.setItem("staff_name", "Guest");
        localStorage.setItem("me_token", result.token);
        localStorage.setItem("lastActivity", Date.now());

        window.location.href = "sections.html";

    }catch(err){
        console.error(err);
        await showCustomPopup("Server Error");
    }
}
    
async function forgotPassword() {
    await showCustomPopup("Please contact administrator to change password");
}

window.addEventListener("load", () => {
    const savedUser = localStorage.getItem("me_user");
    if(savedUser){
        document.getElementById("username").value = savedUser;
    }

    const fish = document.querySelector(".fish");
    const logo = document.querySelector(".logo");
    const title = document.querySelector("h1");
    const ripples = document.querySelectorAll(".logo-ripple");

    function startAnimation(){
        fish.classList.add("start");
        logo.classList.add("start");
        title.classList.add("start");
        ripples.forEach(r => {
            r.classList.add("start");
        });
        setTimeout(()=>{
            document.getElementById("loginBox").classList.add("show");
        },3200);
    }

    if(fish.complete){
        startAnimation();
    } else {
        fish.onload = startAnimation;
    }
});

const togglePassword = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");
const icon = togglePassword.querySelector("i");

togglePassword.addEventListener("click", () => {
    if(passwordInput.type === "password"){
        passwordInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        passwordInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
});

function goBack(){
    window.location.href = "index.html";
}
</script>
</body>
</html>
