<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com https://me-connect-api.mech-elec-ranhill.workers.dev; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; script-src 'self' 'unsafe-inline';">
<title>M&E Connect Sign In</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
    text-decoration: none;
    list-style: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    background: #fff;
}

.container {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #fff;
    overflow: hidden;
}

.container h1 {
    font-size: 36px;
    margin: -10px 0;
}

.container p {
    font-size: 14.5px;
    margin: 15px 0;
}

form {
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
}

.floating-home-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    background: #ffffff;
    border-radius: 50%;
    color: #2563eb;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.floating-home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
}

.form-box {
    position: absolute;
    right: 0;
    width: 50%;
    height: 100%;
    background: #fff;
    display: flex;
    align-items: center;
    color: #333;
    text-align: center;
    padding: 40px;
    z-index: 1;
    transition:
        0.6s ease-in-out 1.2s,
        visibility 0s 1s;
}

.container.active .form-box {
    right: 50%;
}

.form-box.guest {
    visibility: hidden;
}

.container.active .form-box.guest {
    visibility: visible;
}

.input-box {
    position: relative;
    margin: 30px 0;
}

.input-box input {
    width: 100%;
    padding: 13px 50px 13px 20px;
    background: #eee;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    color: #333;
    font-weight: 500;
}

.input-box input:focus {
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.45);
}

.input-box input::placeholder {
    color: #888;
    font-weight: 400;
}

.input-box > i {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: #333;
}

.toggle-password {
    position: absolute;
    right: 0;
    top: 0;
    width: 50px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #333;
    font-size: 18px;
}

.forgot-link {
    margin: -15px 0 15px;
}

.forgot-link a {
    font-size: 14.5px;
    color: #333;
    cursor: pointer;
}

.btn {
    width: 100%;
    height: 48px;
    background: #2563eb;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: #fff;
    font-weight: 600;
    transition: background 0.2s ease;
}

.btn:hover {
    background: #1d4ed8;
}

.toggle-box {
    position: absolute;
    width: 100%;
    height: 100%;
}

.toggle-box::before {
    content: "";
    position: absolute;
    left: -250%;
    width: 300%;
    height: 100%;
    background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.15), transparent 35%),
        linear-gradient(60deg, #0b3d91 0%, #0077b6 40%, #00b4d8 100%);
    background-attachment: fixed;
    background-size: 50vw 100vh, 50vw 100vh;
    border-radius: 150px;
    z-index: 2;
    transition: 1.8s ease-in-out;
}

.container.active .toggle-box::before {
    left: 50%;
}

.toggle-panel {
    position: absolute;
    width: 50%;
    height: 100%;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 2;
    transition: 0.6s ease-in-out;
}

.toggle-panel.toggle-left {
    left: 0;
    transition-delay: 1.2s;
}

.container.active .toggle-panel.toggle-left {
    left: -50%;
    transition-delay: 0.6s;
}

.toggle-panel.toggle-right {
    right: -50%;
    transition-delay: 0.6s;
}

.container.active .toggle-panel.toggle-right {
    right: 0;
    transition-delay: 1.2s;
}

.toggle-panel p {
    margin-bottom: 20px;
}

.toggle-panel .btn {
    width: 170px;
    height: 46px;
    background: transparent;
    border: 2px solid #fff;
    box-shadow: none;
    transition: background 0.2s ease, color 0.2s ease;
}

.toggle-panel .btn:hover {
    background: #fff;
    color: #0b3d91;
}

@media screen and (max-width: 650px) {
    .floating-home-btn {
        top: 16px;
        left: 16px;
        width: 38px;
        height: 38px;
    }

    .form-box {
        bottom: 0;
        width: 100%;
        height: 70%;
        padding: 20px 30px;
        overflow-y: auto;
    }

    .container.active .form-box {
        right: 0;
        bottom: 30%;
    }

    .input-box {
        margin: 20px 0;
    }

    .toggle-box::before {
        left: 0;
        top: -270%;
        width: 100%;
        height: 300%;
        border-radius: 20vw;
        background-size: 100vw 100vh, 100vw 100vh;
        background-size: 100vw 100dvh, 100vw 100dvh;
    }

    .container.active .toggle-box::before {
        left: 0;
        top: 70%;
    }

    .container.active .toggle-panel.toggle-left {
        left: 0;
        top: -30%;
    }

    .toggle-panel {
        width: 100%;
        height: 30%;
    }

    .toggle-panel.toggle-left {
        top: 0;
    }

    .toggle-panel.toggle-right {
        right: 0;
        bottom: -30%;
    }

    .container.active .toggle-panel.toggle-right {
        bottom: 0;
    }

    .toggle-panel h1 {
        font-size: 26px;
        margin: 0;
    }

    .toggle-panel p {
        margin: 6px 0 12px;
    }

    .toggle-panel .btn {
        height: 40px;
        font-size: 15px;
    }
}

@media screen and (max-width: 400px) {
    .form-box {
        padding: 16px 22px;
    }
}
</style>
</head>

<body>

<div class="container" id="container">
    <a href="#" onclick="goBack()" class="floating-home-btn" title="Main Menu">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="form-box login" id="loginBox">
        <form id="loginForm" novalidate>
            <h1>Login</h1>

            <div class="input-box">
                <input id="username" type="text" placeholder="Employee ID" autocomplete="username">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input id="password" type="password" placeholder="Password" autocomplete="current-password">
                <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <div class="forgot-link">
                <a href="#" onclick="forgotPassword(); return false;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <div class="form-box guest" id="guestBox">
        <form id="guestForm" novalidate>
            <h1>Guest Login</h1>

            <div class="input-box">
                <input id="guestName" type="text" placeholder="Full Name" autocomplete="name">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input id="guestEmail" type="email" placeholder="Email" autocomplete="email">
                <i class="fa-solid fa-envelope"></i>
            </div>

            <button type="submit" class="btn">Continue</button>
        </form>
    </div>

    <div class="toggle-box">
        <div class="toggle-panel toggle-left">
            <h1>Hello, Welcome!</h1>
            <p>Are you a guest?</p>
            <button type="button" class="btn" onclick="switchPanel(true)">Guest Login</button>
        </div>

        <div class="toggle-panel toggle-right">
            <h1>Welcome Back!</h1>
            <p>Are you a staff member?</p>
            <button type="button" class="btn" onclick="switchPanel(false)">Staff Login</button>
        </div>
    </div>
</div>

<script>
const API_URL = "https://me-connect-api.mech-elec-ranhill.workers.dev";

function showCustomPopup(message) {
    return new Promise((resolve) => {
        const style = document.createElement('style');
        style.textContent = `
            @keyframes agFadeIn { from { opacity: 0; } to { opacity: 1; } }
            @keyframes agPopIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        `;
        document.head.appendChild(style);

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:999999;animation:agFadeIn 0.2s ease-out;';

        const box = document.createElement('div');
        box.style.cssText = 'background:#ffffff;padding:28px 24px;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);width:100%;max-width:360px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;animation:agPopIn 0.25s cubic-bezier(0.16,1,0.3,1);box-sizing:border-box;margin:16px;';

        const iconContainer = document.createElement('div');
        iconContainer.style.cssText = 'width:56px;height:56px;background:#fef2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;';
        iconContainer.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;

        const title = document.createElement('h3');
        title.style.cssText = 'margin:0 0 8px 0;font-size:18px;font-weight:600;color:#0f172a;';
        title.textContent = 'M&E Connect';

        const msg = document.createElement('p');
        msg.style.cssText = 'margin:0 0 24px 0;font-size:14px;color:#64748b;line-height:1.5;';
        msg.textContent = message;

        const btn = document.createElement('button');
        btn.style.cssText = 'width:100%;background:#2563eb;color:#ffffff;border:none;padding:10px 16px;font-size:14px;border-radius:8px;cursor:pointer;font-weight:500;transition:background 0.2s;outline:none;';
        btn.textContent = 'OK';

        btn.onmouseover = () => btn.style.background = '#1d4ed8';
        btn.onmouseout = () => btn.style.background = '#2563eb';

        btn.onclick = () => {
            document.body.removeChild(overlay);
            document.head.removeChild(style);
            resolve();
        };

        box.appendChild(iconContainer);
        box.appendChild(title);
        box.appendChild(msg);
        box.appendChild(btn);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
    });
}

function getRedirectTarget() {
    const from = new URLSearchParams(window.location.search).get("from");
    return from === "userdirectory" ? "userdirectory.html" : "sections.html";
}

function getActiveInputs() {
    return {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value.trim()
    };
}

async function login(){
    const { username: employeeId, password: pass } = getActiveInputs();

    if(!employeeId || !pass){
        await showCustomPopup("Please enter Employee ID and Password.");
        return;
    }

    try{
        const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                employee_id: employeeId,
                password: pass
            })
        });

        const result = await res.json();

        if(!res.ok || !result.success || !result.staff){
            await showCustomPopup(result.error || "Employee ID atau Password tidak sah.");
            return;
        }

        const staffData = result.staff;

        localStorage.setItem("loggedIn","true");
        localStorage.setItem("staff_id",staffData.id);
        localStorage.setItem("userId",staffData.employee_id);
        localStorage.setItem("employee_id",staffData.employee_id);
        localStorage.setItem("staff_name",staffData.name);
        localStorage.setItem("role",staffData.position || "");
        localStorage.setItem("avatar_url",staffData.avatar_url || "");
        localStorage.setItem("phone_no",staffData.phone_no || "");
        localStorage.setItem("initial",staffData.initial || "");
        localStorage.setItem("signature",staffData.signature || "");
        localStorage.setItem("me_user",staffData.employee_id);
        localStorage.setItem("lastActivity",Date.now());
        localStorage.setItem("me_token", result.token || "");

        window.location.href = getRedirectTarget();

    }catch(err){
        console.error(err);
        await showCustomPopup("Server Error");
    }
}

async function guestLogin(){
    const name = document.getElementById("guestName").value.trim();
    const email = document.getElementById("guestEmail").value.trim();

    if(!name || !email){
        await showCustomPopup("Please enter your full name and email.");
        return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        await showCustomPopup("Please enter a valid email address.");
        return;
    }

    try{
        const res = await fetch(`${API_URL}/guest-login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email })
        });
        const result = await res.json();

        if(!res.ok || !result.success || !result.token){
            await showCustomPopup("Guest access is not available right now.");
            return;
        }

        const keepUser = localStorage.getItem("me_user");
        localStorage.clear();
        if (keepUser) localStorage.setItem("me_user", keepUser);

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("role", "guest");
        localStorage.setItem("staff_name", name);
        localStorage.setItem("guest_email", email);
        localStorage.setItem("me_token", result.token);
        localStorage.setItem("lastActivity", Date.now());

        window.location.href = "sections.html";

    }catch(err){
        console.error(err);
        await showCustomPopup("Server Error");
    }
}

async function forgotPassword() {
    await showCustomPopup("Please contact administrator to change password");
}

const container = document.getElementById("container");
const loginBox = document.getElementById("loginBox");
const guestBox = document.getElementById("guestBox");

function switchPanel(showGuest){
    container.classList.toggle("active", showGuest);
    loginBox.inert = showGuest;
    guestBox.inert = !showGuest;
}

switchPanel(false);

document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    login();
});

document.getElementById("guestForm").addEventListener("submit", (e) => {
    e.preventDefault();
    guestLogin();
});

window.addEventListener("load", () => {
    const savedUser = localStorage.getItem("me_user");
    const userInput = document.getElementById("username");
    if(savedUser && userInput) userInput.value = savedUser;
});

const toggleBtn = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");
toggleBtn.addEventListener("click", () => {
    const icon = toggleBtn.querySelector("i");
    const show = passwordInput.type === "password";
    passwordInput.type = show ? "text" : "password";
    icon.classList.toggle("fa-eye", !show);
    icon.classList.toggle("fa-eye-slash", show);
    toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

function goBack(){
    window.location.href = "index.html";
}
</script>
</body>
</html>
