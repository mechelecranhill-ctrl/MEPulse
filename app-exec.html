<script>
/* ============================================================
   BLUEFORM APPROVALS - REQUEST FOR APPROVAL
   CLOUDFLARE WORKER VERSION
   ============================================================ */

const API_URL = 'https://me-connect-api.mech-elec-ranhill.workers.dev';

const API_HEADERS = {
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
};

async function apiFetch(path, options = {}) {

    const opts = {
        ...options,
        headers: {
            ...API_HEADERS,
            ...(options.headers || {})
        }
    };

    const response = await fetch(`${API_URL}${path}`, opts);

    if (!response.ok) {

        let detail = '';

        try {
            const contentType =
                response.headers.get('content-type') || '';

            if (contentType.includes('application/json')) {
                const body = await response.json();

                detail =
                    body?.error ||
                    body?.message ||
                    body?.detail ||
                    JSON.stringify(body);
            } else {
                detail = await response.text();
            }

        } catch (_) {}

        throw new Error(
            `HTTP ${response.status}${detail ? `: ${detail}` : ''}`
        );
    }

    if (response.status === 204) {
        return null;
    }

    const contentType =
        response.headers.get('content-type') || '';

    if (contentType.includes('application/json')) {
        return await response.json();
    }

    const text = await response.text();

    if (!text) {
        return null;
    }

    try {
        return JSON.parse(text);
    } catch (_) {
        return text;
    }
}


async function apiQuery(table, query = '') {

    return await apiFetch(
        `/rest/v1/${table}${query ? `?${query}` : ''}`
    );
}


function encodeValue(value) {
    return encodeURIComponent(String(value));
}


function buildInFilter(values) {

    const clean = (values || [])
        .filter(v => v !== null && v !== undefined)
        .map(v => String(v));

    return `in.(${clean.join(',')})`;
}


/* ============================================================
   ROLE / PERMISSION CONTEXT
   ============================================================ */

const ACT_ROLES = {

    TECH: [
        'JURUTEKNIK',
        'JURUTEKNIK KANAN',
        'EKSEKUTIF',
        'EKSEKUTIF KANAN'
    ],

    UNIT_EXEC: [
        'EKSEKUTIF',
        'EKSEKUTIF KANAN'
    ],

    SECTION_HEAD: [
        'KETUA SEKSYEN'
    ],

    DEPT_HEAD: [
        'KETUA JABATAN'
    ]
};


/* ============================================================
   GET PERMISSION CONTEXT
   ============================================================ */

async function getPermissionContext() {

    const isAdmin =
        localStorage.getItem('userId') === '@dm1n' ||
        localStorage.getItem('role') === 'admin';

    const ctx = {

        isAdmin,

        position: '',
        userId: null,

        isActingUnitExec: false,
        isActingSectionHead: false,
        isDeptHeadActive: false,

        canManageTech: false,
        canActUnit: false,
        canActSection: false,
        canActDept: false
    };


    /* ---------------------------------------------------------
       ADMIN
       --------------------------------------------------------- */

    if (isAdmin) {

        ctx.canManageTech = true;
        ctx.canActUnit = true;
        ctx.canActSection = true;
        ctx.canActDept = true;

        return ctx;
    }


    try {

        const staffIdRaw =
            localStorage.getItem('staff_id');

        const staffId =
            staffIdRaw !== null
                ? Number(staffIdRaw)
                : null;


        if (
            staffId === null ||
            Number.isNaN(staffId)
        ) {
            return ctx;
        }


        ctx.userId = staffId;


        /* -----------------------------------------------------
           STAFF POSITION
           ----------------------------------------------------- */

        try {

            const staffRows = await apiQuery(
                'staff',
                `id=eq.${encodeValue(staffId)}&select=position`
            );

            ctx.position =
                (
                    staffRows?.[0]?.position ||
                    ''
                )
                .trim()
                .toUpperCase();

        } catch (error) {

            console.error(
                'Failed to load staff position:',
                error
            );
        }


        /* -----------------------------------------------------
           ACTING UNIT
           ----------------------------------------------------- */

        try {

            const unitAssignments = await apiQuery(
                'staff_unit_assignment',
                `staff_id=eq.${encodeValue(staffId)}&is_acting=eq.true&select=unit_id`
            );

            ctx.isActingUnitExec =
                Array.isArray(unitAssignments) &&
                unitAssignments.length > 0;

        } catch (error) {

            console.error(
                'Failed to load unit acting assignment:',
                error
            );

        }


        /* -----------------------------------------------------
           ACTING SECTION
           ----------------------------------------------------- */

        try {

            const sectionAssignments = await apiQuery(
                'staff_section_assignment',
                `staff_id=eq.${encodeValue(staffId)}&is_acting=eq.true&select=section_id`
            );

            ctx.isActingSectionHead =
                Array.isArray(sectionAssignments) &&
                sectionAssignments.length > 0;

        } catch (error) {

            console.error(
                'Failed to load section acting assignment:',
                error
            );

        }


        /* -----------------------------------------------------
           DEPARTMENT HEAD
           ----------------------------------------------------- */

        try {

            const departmentRows = await apiQuery(
                'department_head',
                `staff_id=eq.${encodeValue(staffId)}&active=eq.true&select=is_acting`
            );

            ctx.isDeptHeadActive =
                Array.isArray(departmentRows) &&
                departmentRows.length > 0;

        } catch (error) {

            console.error(
                'Failed to load department head:',
                error
            );

        }


        /* -----------------------------------------------------
           FINAL PERMISSION
           ----------------------------------------------------- */

        ctx.canManageTech =
            ACT_ROLES.TECH.includes(ctx.position);

        ctx.canActUnit =
            ACT_ROLES.UNIT_EXEC.includes(ctx.position) ||
            ctx.isActingUnitExec;

        ctx.canActSection =
            ACT_ROLES.SECTION_HEAD.includes(ctx.position) ||
            ctx.isActingSectionHead;

        ctx.canActDept =
            ACT_ROLES.DEPT_HEAD.includes(ctx.position) ||
            ctx.isDeptHeadActive;

    } catch (error) {

        console.error(
            'Permission context error:',
            error
        );
    }


    return ctx;
}


/* ============================================================
   FETCH DASHBOARD
   ============================================================ */

async function fetchDashboard() {

    try {

        const perm =
            await getPermissionContext();

        window.__perm = perm;


        const isAdmin =
            perm.isAdmin;


        let activeUnitIds = [];

        let scopeIsAll =
            isAdmin;


        /* =====================================================
           DETERMINE UNIT SCOPE
           ===================================================== */

        if (!isAdmin) {

            const staffIdRaw =
                localStorage.getItem('staff_id');

            const currentStaffId =
                staffIdRaw !== null
                    ? Number(staffIdRaw)
                    : null;


            if (
                currentStaffId === null ||
                Number.isNaN(currentStaffId)
            ) {

                showEmptyState(
                    'quotations-container',
                    'Please log in first.'
                );

                showEmptyState(
                    'blueforms-container',
                    'Please log in first.'
                );

                return;
            }


            /* -------------------------------------------------
               KETUA JABATAN
               ------------------------------------------------- */

            if (perm.canActDept) {

                scopeIsAll = true;

            } else {

                const unitIdSet =
                    new Set();


                /* ---------------------------------------------
                   DIRECT UNIT ASSIGNMENT
                   --------------------------------------------- */

                const assignments =
                    await apiQuery(
                        'staff_unit_assignment',
                        `staff_id=eq.${encodeValue(currentStaffId)}&active=eq.true&select=unit_id`
                    );


                (
                    assignments || []
                ).forEach(row => {

                    if (
                        row.unit_id !== null &&
                        row.unit_id !== undefined
                    ) {

                        unitIdSet.add(row.unit_id);

                    }

                });


                /* ---------------------------------------------
                   SECTION ASSIGNMENT
                   --------------------------------------------- */

                if (perm.canActSection) {

                    const secAssignments =
                        await apiQuery(
                            'staff_section_assignment',
                            `staff_id=eq.${encodeValue(currentStaffId)}&active=eq.true&select=section_id`
                        );


                    if (
                        secAssignments &&
                        secAssignments.length > 0
                    ) {

                        const sectionIds =
                            secAssignments
                                .map(row => row.section_id)
                                .filter(
                                    value =>
                                        value !== null &&
                                        value !== undefined
                                );


                        if (sectionIds.length > 0) {

                            const sectionUnits =
                                await apiQuery(
                                    'units',
                                    `section_id=${buildInFilter(sectionIds)}&select=id`
                                );


                            (
                                sectionUnits || []
                            ).forEach(unit => {

                                if (
                                    unit.id !== null &&
                                    unit.id !== undefined
                                ) {

                                    unitIdSet.add(unit.id);

                                }

                            });

                        }

                    }

                }


                activeUnitIds =
                    [...unitIdSet];


                if (
                    activeUnitIds.length === 0
                ) {

                    showEmptyState(
                        'quotations-container',
                        'Your account has not been assigned to any unit.'
                    );

                    showEmptyState(
                        'blueforms-container',
                        'Your account has not been assigned to any unit.'
                    );

                    return;
                }

            }

        }


        /* =====================================================
           LOAD WORK ORDERS
           ===================================================== */

        const quotationStatuses =
            'in.(QUOTATION)';


        const blueformStatuses =
            'in.(BLUEFORM)';


        let quotationOrders =
            await apiQuery(
                'work_orders',
                `status=${quotationStatuses}&select=id,work_id,status,contract_id,pdf_url`
            );


        let blueformOrders =
            await apiQuery(
                'work_orders',
                `status=${blueformStatuses}&select=id,work_id,status,sequence_no,contract_id,district,pdf_url,pending_status`
            );


        quotationOrders =
            quotationOrders || [];


        blueformOrders =
            blueformOrders || [];


        /* =====================================================
           LOAD CONTRACTS
           ===================================================== */

        const allOrders = [
            ...quotationOrders,
            ...blueformOrders
        ];


        const contractIds =
            [
                ...new Set(
                    allOrders
                        .map(row => row.contract_id)
                        .filter(
                            value =>
                                value !== null &&
                                value !== undefined
                        )
                )
            ];


        let contracts = [];


        if (contractIds.length > 0) {

            contracts =
                await apiQuery(
                    'contract',
                    `id=${buildInFilter(contractIds)}&select=id,contract_name,contract_code,unit_id`
                );

        }


        const contractMap =
            new Map(
                (contracts || [])
                    .map(contract => [
                        String(contract.id),
                        contract
                    ])
            );


        /* =====================================================
           ATTACH CONTRACT DATA
           ===================================================== */

        quotationOrders =
            quotationOrders.map(order => {

                const contract =
                    contractMap.get(
                        String(order.contract_id)
                    ) || null;


                return {
                    ...order,
                    contract
                };

            });


        blueformOrders =
            blueformOrders.map(order => {

                const contract =
                    contractMap.get(
                        String(order.contract_id)
                    ) || null;


                return {
                    ...order,
                    contract
                };

            });


        /* =====================================================
           APPLY UNIT SCOPE
           ===================================================== */

        if (!scopeIsAll) {

            const allowedUnits =
                new Set(
                    activeUnitIds.map(
                        value => String(value)
                    )
                );


            quotationOrders =
                quotationOrders.filter(order => {

                    const unitId =
                        order.contract?.unit_id;

                    return (
                        unitId !== null &&
                        unitId !== undefined &&
                        allowedUnits.has(
                            String(unitId)
                        )
                    );

                });


            blueformOrders =
                blueformOrders.filter(order => {

                    const unitId =
                        order.contract?.unit_id;

                    return (
                        unitId !== null &&
                        unitId !== undefined &&
                        allowedUnits.has(
                            String(unitId)
                        )
                    );

                });

        }


        /* =====================================================
           MAP PDF
           ===================================================== */

        blueformOrders.forEach(item => {

            item.mapped_pdf_url =
                item.pdf_url || null;

        });


        /* =====================================================
           RENDER
           ===================================================== */

        renderSection(
            'quotations-container',
            quotationOrders,
            'QUOTATION',
            perm
        );


        renderSection(
            'blueforms-container',
            blueformOrders,
            'BLUEFORM',
            perm
        );


    } catch (error) {

        console.error(
            'Error fetching data:',
            error
        );

        alert(
            'Failed to load dashboard data: ' +
            error.message
        );

    }

}


/* ============================================================
   RENDER SECTION
   ============================================================ */

function renderSection(
    containerId,
    orders,
    type,
    perm
) {

    perm =
        perm ||
        window.__perm ||
        {
            canActUnit: false
        };


    const container =
        document.getElementById(
            containerId
        );


    if (!container) return;


    container.innerHTML = '';


    if (
        !orders ||
        orders.length === 0
    ) {

        showEmptyState(
            containerId,
            `No pending tasks for ${type}.`
        );

        return;
    }


    const contractsMap = {};


    orders.forEach(item => {

        const contractData =
            Array.isArray(item.contract)
                ? item.contract[0]
                : item.contract;


        const cId =
            contractData?.id ||
            item.contract_id ||
            'UNKNOWN-ID';


        const cCode =
            contractData?.contract_code ||
            'No Code';


        const cName =
            contractData?.contract_name ||
            'No Name';


        if (!contractsMap[cId]) {

            contractsMap[cId] = {

                id: cId,
                code: cCode,
                name: cName,
                orders: []

            };

        }


        contractsMap[cId].orders.push(
            item
        );

    });


    const renderedSeqs =
        new Set();


    for (
        const contractId
        in contractsMap
    ) {

        const contract =
            contractsMap[contractId];


        const contractSeqGroups =
            type === 'BLUEFORM'
                ? buildSequenceGroups(
                    contract.orders
                )
                : null;


        const contractSection =
            document.createElement(
                'div'
            );


        contractSection.className =
            'bg-gray-50 rounded-lg border border-gray-200 shadow-xs mb-4 overflow-hidden';


        const headerBg =
            type === 'QUOTATION'
                ? 'bg-emerald-50 hover:bg-emerald-100/80 border-emerald-200'
                : 'bg-blue-50 hover:bg-blue-100/80 border-blue-200';


        const badgeBg =
            type === 'QUOTATION'
                ? 'bg-emerald-600'
                : 'bg-blue-600';


        let headerRowHtml = '';


        if (type === 'BLUEFORM') {

            headerRowHtml = `
                <th class="px-3 py-2 text-left font-medium text-gray-500 uppercase tracking-wider">
                    Work ID
                </th>

                <th class="px-3 py-2 text-center font-medium text-gray-500 uppercase tracking-wider w-40">
                    Reference
                </th>

                <th class="px-3 py-2 text-right font-medium text-gray-500 uppercase tracking-wider">
                    Action
                </th>
            `;

        } else {

            headerRowHtml = `
                <th class="px-3 py-2 text-left font-medium text-gray-500 uppercase tracking-wider">
                    Work ID
                </th>

                <th class="px-3 py-2 text-right font-medium text-gray-500 uppercase tracking-wider">
                    Action
                </th>
            `;

        }


        const accordionContentId =
            `acc-${type}-${String(contract.id).replace(
                /[^a-zA-Z0-9]/g,

/* ============================================================
   HTML SAFETY
   ============================================================ */

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


function escapeAttribute(value) {

    return escapeHtml(value);

}


function escapeJs(value) {

    return String(value ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n');

}


/* ============================================================
   ACCORDION
   ============================================================ */

function toggleAccordion(
    contentId,
    iconId
) {

    const content =
        document.getElementById(
            contentId
        );


    const icon =
        document.getElementById(
            iconId
        );


    if (!content || !icon) {
        return;
    }


    if (
        content.classList.contains(
            'hidden'
        )
    ) {

        content.classList.remove(
            'hidden'
        );

        icon.classList.add(
            'rotate-180'
        );

    } else {

        content.classList.add(
            'hidden'
        );

        icon.classList.remove(
            'rotate-180'
        );

    }

}

async function renderPdfPagesAsElements(
    pdfUrl
) {

    const pages = [];


    try {

        const pdf =
            await pdfjsLib
                .getDocument(pdfUrl)
                .promise;


        for (
            let i = 1;
            i <= pdf.numPages;
            i++
        ) {

            const page =
                await pdf.getPage(i);


            const baseViewport =
                page.getViewport({
                    scale: 1
                });


            const scale =
                (794 * 2) /
                baseViewport.width;


            const viewport =
                page.getViewport({
                    scale
                });


            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            await page.render({

                canvasContext:
                    canvas.getContext('2d'),

                viewport

            }).promise;


            const dataUrl =
                canvas.toDataURL(
                    'image/jpeg',
                    0.92
                );


            const img =
                document.createElement(
                    'img'
                );


            img.src = dataUrl;

            img.style.width =
                '100%';

            img.style.display =
                'block';

            img.alt =
                `Quotation page ${i}`;


            const pageDiv =
                document.createElement(
                    'div'
                );


            pageDiv.className =
                'print-page bg-white shadow-lg';


            pageDiv.style.width =
                '210mm';


            pageDiv.style.boxSizing =
                'border-box';


            pageDiv.appendChild(
                img
            );


            pages.push(
                pageDiv
            );


            canvas.width = 0;
            canvas.height = 0;

        }

    } catch (error) {

        console.error(
            'Failed to render PDF:',
            pdfUrl,
            error
        );


        const errDiv =
            document.createElement(
                'div'
            );


        errDiv.className =
            'print-page bg-white p-8 shadow-lg w-[210mm] min-h-[297mm] flex items-center justify-center text-center';


        errDiv.innerHTML = `

            <div>

                <i class="fa-solid fa-triangle-exclamation text-xl text-amber-500 block mb-2"></i>

                <p class="text-sm text-gray-600">
                    Failed to display PDF.
                </p>

                <a
                    href="${escapeAttribute(pdfUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="text-blue-500 underline text-xs">

                    Open PDF in new tab

                </a>

            </div>

        `;


        pages.push(
            errDiv
        );

    }


    return pages;

}


/* ============================================================
   FULL BLUEFORM PREVIEW
   ============================================================ */

async function previewFullSet(
    escapedGroupData
) {

    const groupItems =
        JSON.parse(
            decodeURIComponent(
                escapedGroupData
            )
        );


    const container =
        document.getElementById(
            'bulkPagesContainer'
        );


    container.innerHTML = `

        <div class="text-white text-sm p-4 animate-pulse">

            <i class="fa-solid fa-spinner fa-spin mr-2"></i>

            Bundling full set documents...

        </div>

    `;


    document.getElementById(
        'bulkPreviewPage'
    ).style.display = 'block';


    try {

        let compositeHtml = '';


        const ids =
            groupItems.map(
                item => item.id
            );


        const payload =
            ids.length > 1

                ? await buildBlueformDataGroup(
                    ids
                )

                : await buildBlueformData(
                    ids[0]
                );


        if (
            payload &&
            typeof buildBlueformHTML ===
            'function'
        ) {

            compositeHtml +=
                buildBlueformHTML(
                    payload
                );

        } else {

            compositeHtml += `

                <div class="print-page bg-white p-8 shadow-lg w-[210mm] min-h-[297mm] text-red-500 font-bold flex items-center justify-center">

                    Error:
                    buildBlueformData /
                    buildBlueformHTML
                    logic failed.

                </div>

            `;

        }


        container.innerHTML =
            compositeHtml;


        const linkedPdfs =
            [
                ...new Set(
                    groupItems
                        .map(
                            item =>
                                item.mapped_pdf_url
                        )
                        .filter(Boolean)
                )
            ];


        if (
            linkedPdfs.length > 0
        ) {

            for (
                const pdfUrl
                of linkedPdfs
            ) {

                const pageEls =
                    await renderPdfPagesAsElements(
                        pdfUrl
                    );


                pageEls.forEach(
                    element =>
                        container.appendChild(
                            element
                        )
                );

            }

        } else {

            const noPdfDiv =
                document.createElement(
                    'div'
                );


            noPdfDiv.className =
                'print-page bg-white p-12 shadow-lg w-[210mm] min-h-[297mm] flex flex-col items-center justify-center text-center';


            noPdfDiv.style.color =
                'gray';


            noPdfDiv.innerHTML = `

                <i class="fa-solid fa-file-pdf text-4xl text-gray-300 mb-2"></i>

                <p class="text-sm font-semibold text-gray-600">
                    No Linked Quotation PDF Found
                </p>

                <p class="text-xs text-gray-400">
                    Only the Blueform page will be printed for this record.
                </p>

            `;


            container.appendChild(
                noPdfDiv
            );

        }


    } catch (error) {

        console.error(
            'Error creating blueform preview:',
            error
        );


        container.innerHTML = `

            <div class="text-red-400 p-4 font-mono text-xs">

                Error bundling documents:
                ${escapeHtml(error.message)}

            </div>

        `;

    }

}

/* ============================================================
   STATUS UPDATE
   ============================================================ */

async function executeStatusUpdate(
    workId,
    nextStatus,
    reason = null
) {

    try {

        /* =====================================================
           QUOTATION DECISION
           ===================================================== */

        if (
            nextStatus === 'QUO-REJ' ||
            nextStatus === 'QUO-APP'
        ) {

            const updatePayload = {

                status:
                    nextStatus,

                action_date:
                    new Date().toISOString()

            };


            if (reason !== null) {

                updatePayload.reject_reason =
                    reason;

            }


            await apiFetch(
                `/rest/v1/work_orders?work_id=eq.${encodeValue(workId)}`,
                {
                    method: 'PATCH',
                    body:
                        JSON.stringify(
                            updatePayload
                        )
                }
            );

        }


        /* =====================================================
           BLUEFORM DECISION
           ===================================================== */

        else {

            const stampStage =
                nextStatus === 'APP-EXEC'
                    ? 'exec_signature'
                    : null;


            /*
             * stageGroupDecisionByWorkId()
             * berada dalam blueform.js.
             *
             * Pastikan blueform.js anda juga telah
             * dimigrate ke Cloudflare Worker.
             */

            if (
                typeof stageGroupDecisionByWorkId !==
                'function'
            ) {

                throw new Error(
                    'stageGroupDecisionByWorkId() is not available. Check blueform.js.'
                );

            }


            const result =
                await stageGroupDecisionByWorkId(
                    workId,
                    nextStatus,
                    reason,
                    stampStage
                );


            if (result?.waiting) {

                alert(
                    'Decision saved. Waiting for other Work Orders in the same sequence to be decided first.'
                );

            }

        }


        /* =====================================================
           REFRESH
           ===================================================== */

        await fetchDashboard();


    } catch (error) {

        console.error(
            'Error updating status:',
            error
        );


        alert(
            'Failed to update status: ' +
            error.message
        );

    }

}

window.addEventListener(
    'load',
    fetchDashboard
);

</script>
</body>
</html>
