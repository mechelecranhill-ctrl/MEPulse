<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cetak Cop Diterima</title>
    <style>
        /* Tetapan saiz kertas A4 untuk cetakan */
        @page {
            size: A4;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #555;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Simulasi kertas A4 di skrin */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
            padding: 20mm; 
        }

        /* Kotak Cop - Jejari 2cm = Diameter 4cm (40mm) -> Kita guna 75mm-80mm untuk muat teks */
        .stamp {
            width: 41mm;
            height: 41mm;
            border: 2px solid #0000CC; /* Warna biru cop */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #0000CC;
            position: absolute;
            top: 240mm; 
            left: 30mm;
            box-sizing: border-box;
            padding-top: 5mm; /* Jarak 5mm dari radius atas ke DITERIMA */
        }

        /* Font Arial Bold untuk DITERIMA */
        .stamp-title {
            font-family: 'Arial', sans-serif;
            font-size: 16pt;
            font-weight: bold;
            letter-spacing: 0.2px;
            margin-bottom: 5mm; /* Jarak 6mm dari DITERIMA ke tarikh */
            transform: scaleY(1.3);
        }

        /* Font Arial Bold untuk Tarikh */
        .stamp-date {
            font-family: 'Arial', sans-serif;
            font-size: 13pt;
            font-weight: bold;
            letter-spacing: 0.2px;
            margin-bottom: 4mm;
            transform: scaleY(1.25);
        }

        /* Font Arial Narrow untuk Bahagian Jabatan */
        .stamp-footer {
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 9.2pt;
            font-weight: bold;
            line-height: 1;
            letter-spacing: 0.2px;
        }

        .stamp-footer .line-1 {
            margin-bottom: 0.5mm; /* Jarak 1mm antara JABATAN M&E dan RANHILL SAJ SDN BHD */
        }

        /* Buang background kelabu dan bayang semasa print */
        @media print {
            body {
                background: none;
            }
            .a4-page {
                box-shadow: none;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="a4-page">
        <!-- Reka bentuk Cop -->
        <div class="stamp">
            <div class="stamp-title">DITERIMA</div>
            <!-- Tarikh automatik hari ini -->
            <div class="stamp-date" id="current-date"></div>
            <div class="stamp-footer">
                <div class="line-1">JABATAN M&E</div>
                <div>RANHILL SAJ SDN BHD</div>
            </div>
        </div>
    </div>

    <script>
        // Script untuk letak tarikh secara automatik (Format: 12 JUN 2026)
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        const today = new Date();
        const day = String(today.getDate()).padStart(2, '0');
        const month = months[today.getMonth()];
        const year = today.getFullYear();
        
        document.getElementById('current-date').innerText = `${day} ${month} ${year}`;
    </script>

</body>
</html>
