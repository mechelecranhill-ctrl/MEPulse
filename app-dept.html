    <script src="blueform.js"></script>
    <script>
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

// ============ ROLE / PERMISSION CONTEXT (KONGSI SEMUA PAGE) ============
const ACT_ROLES = {
    TECH: ['JURUTEKNIK', 'JURUTEKNIK KANAN', 'EKSEKUTIF', 'EKSEKUTIF KANAN'],
    UNIT_EXEC: ['EKSEKUTIF', 'EKSEKUTIF KANAN'],
    SECTION_HEAD: ['KETUA SEKSYEN'],
    DEPT_HEAD: ['KETUA JABATAN']
};

// Only these sections should be shown on this dashboard
const ALLOWED_SECTION_NAMES = ['SEKSYEN SELENGGARA', 'SEKSYEN PEMATUHAN PERATURAN'];

async function getPermissionContext() {
    const _permHeaders = { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
    const isAdmin = localStorage.getItem('userId') === '@dm1n' || localStorage.getItem('role') === 'admin';

    const ctx = {
        isAdmin, position: '', userId: null,
        isActingUnitExec: false, isActingSectionHead: false, isDeptHeadActive: false,
        canManageTech: false, canActUnit: false, canActSection: false, canActDept: false
    };

    if (isAdmin) {
        ctx.canManageTech = true; ctx.canActUnit = true; ctx.canActSection = true; ctx.canActDept = true;
        return ctx;
    }

    try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return ctx;
        ctx.userId = user.id;

        try {
            const sRes = await fetch(`${SB_URL}/rest/v1/staff?id=eq.${user.id}&select=position`, { headers: _permHeaders });
            const sRows = await sRes.json();
            ctx.position = (sRows[0]?.position || '').trim().toUpperCase();
        } catch (e) { console.error('Failed to load staff position:', e); }

        try {
            const uRes = await fetch(`${SB_URL}/rest/v1/staff_unit_assignment?staff_id=eq.${user.id}&is_acting=eq.true&select=unit_id`, { headers: _permHeaders });
            ctx.isActingUnitExec = (await uRes.json()).length > 0;
        } catch (e) {}

        try {
            const secRes = await fetch(`${SB_URL}/rest/v1/staff_section_assignment?staff_id=eq.${user.id}&is_acting=eq.true&select=section_id`, { headers: _permHeaders });
            ctx.isActingSectionHead = (await secRes.json()).length > 0;
        } catch (e) {}

        try {
            const dRes = await fetch(`${SB_URL}/rest/v1/department_head?staff_id=eq.${user.id}&active=eq.true&select=is_acting`, { headers: _permHeaders });
            ctx.isDeptHeadActive = (await dRes.json()).length > 0;
        } catch (e) {}

        ctx.canManageTech = ACT_ROLES.TECH.includes(ctx.position);
        ctx.canActUnit = ACT_ROLES.UNIT_EXEC.includes(ctx.position) || ctx.isActingUnitExec;
        ctx.canActSection = ACT_ROLES.SECTION_HEAD.includes(ctx.position) || ctx.isActingSectionHead;
        ctx.canActDept = ACT_ROLES.DEPT_HEAD.includes(ctx.position) || ctx.isDeptHeadActive; // covers Pemangku KJ (row aktif dgn is_acting)
    } catch (err) {
        console.error('Permission context error:', err);
    }
    return ctx;
}

        let renderedBlueformSeqs = new Set();

        async function fetchDashboard() {
            try {
                const perm = await getPermissionContext();
                window.__lastPerm = perm;
                const isAdmin = perm.isAdmin;

                const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
                if (!isAdmin && (userError || !user)) {
                    showEmptyRow('Please log in first.');
                    return;
                }

                // AKSES VIEW DIBUKA UNTUK SEMUA STAFF YANG LOG MASUK.
                // Tindakan (approve/reject) tetap disekat ikut perm.canActDept semasa render.

                const { data: allSections, error: sectionsErr } = await supabaseClient
                    .from('me_sections')
                    .select('id, section_name');
                if (sectionsErr) console.error('Failed to load sections:', sectionsErr.message);
                const sectionsPreset = (allSections || []).filter(s =>
                    ALLOWED_SECTION_NAMES.includes((s.section_name || '').trim().toUpperCase())
                );
                const allowedSectionIds = new Set(sectionsPreset.map(s => s.id));

                const { data: allUnits, error: unitsErr } = await supabaseClient
                    .from('units')
                    .select('id, unit_name, section_id');
                if (unitsErr) console.error('Failed to load units:', unitsErr.message);
                const unitsPreset = (allUnits || []).filter(u => allowedSectionIds.has(u.section_id));

                const { data: workOrders, error } = await supabaseClient
                    .from('work_orders')
                    .select(`
                        id, work_id, status, sequence_no, district, pdf_url, pending_status,
                        contract (id, contract_name, contract_code, unit_id)
                    `)
                    .eq('status', 'APP-HOS');

                if (error) throw error;

                workOrders.forEach(item => { item.mapped_pdf_url = item.pdf_url || null; });
                
                renderSectionUnitContractView('table-dept-container', sectionsPreset, unitsPreset, workOrders, perm.canActDept, {
                    approveStatus: 'APP-HOD',
                    rejectStatus: 'HOD-REJ',
                    emptyMsg: 'Awaiting Section Head / HOS approval.'
                });

            } catch (err) {
                console.error("Error loading data:", err.message);
                alert("Failed to load data: " + err.message);
            }
        }

        function showEmptyRow(message) {
            document.getElementById('table-dept-container').innerHTML = `
                <div class="text-center py-8 text-sm text-gray-400 italic bg-gray-50 rounded-lg border border-dashed border-gray-300">
                    <i class="fa-solid fa-inbox block text-xl mb-1 text-gray-300"></i> ${message}
                </div>`;
        }

function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (!content || !icon) return;
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // ============ SECTION -> UNIT -> CONTRACT ACCORDION ============
        function renderSectionUnitContractView(containerId, sections, units, orders, canAct, opts) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            // 1. Bina rangka Seksyen -> Unit (preset, walaupun tiada data lagi)
            const sectionsMap = {};
            (sections || []).forEach(s => {
                sectionsMap[s.id] = { id: s.id, name: s.section_name || 'Seksyen', units: {} };
            });

            const unitToSection = {};
            (units || []).forEach(u => {
                unitToSection[u.id] = (u.section_id !== null && u.section_id !== undefined) ? u.section_id : 'UNKNOWN-SEC';
                const secId = unitToSection[u.id];
                if (!sectionsMap[secId]) sectionsMap[secId] = { id: secId, name: 'Seksyen Lain', units: {} };
                sectionsMap[secId].units[u.id] = { id: u.id, name: u.unit_name || 'Unit', contracts: {} };
            });

            // 2. Isi data kontrak ke dalam unit yang berkenaan
            //    (hanya untuk unit/seksyen yang dibenarkan - unit_id luar senarai ALLOWED akan diabaikan)
            (orders || []).forEach(item => {
                const c = Array.isArray(item.contract) ? item.contract[0] : item.contract;
                const unitId = c?.unit_id || 'UNKNOWN-UNIT';
                let secId = unitToSection[unitId];
                if (secId === undefined) return; // unit tiada dalam seksyen yang dibenarkan - skip

                if (!sectionsMap[secId]) return; // seksyen tidak dibenarkan - skip
                if (!sectionsMap[secId].units[unitId]) sectionsMap[secId].units[unitId] = { id: unitId, name: 'Unit Lain', contracts: {} };

                const cId = c?.id || item.contract_id || 'UNKNOWN-C';
                const unitObj = sectionsMap[secId].units[unitId];
                if (!unitObj.contracts[cId]) {
                    unitObj.contracts[cId] = { id: cId, code: c?.contract_code || 'No Code', name: c?.contract_name || 'No Name', orders: [] };
                }
                unitObj.contracts[cId].orders.push(item);
            });

            const sectionList = Object.values(sectionsMap).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            if (sectionList.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs italic">${opts.emptyMsg}</div>`;
                return;
            }

            const renderedSeqs = new Set();

            sectionList.forEach(section => {
                const unitList = Object.values(section.units).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                const totalSectionItems = unitList.reduce((s, u) => s + Object.values(u.contracts).reduce((s2, c) => s2 + c.orders.length, 0), 0);

                const sectionWrap = document.createElement('div');
                sectionWrap.className = 'mb-6 bg-purple-50/40 border border-purple-100 rounded-xl p-3';

                sectionWrap.innerHTML = `
                    <div class="flex items-center gap-2 mb-3 px-1">
                        <i class="fa-solid fa-building text-purple-500"></i>
                        <h2 class="text-sm font-extrabold text-purple-800 uppercase tracking-wide">${section.name}</h2>
                        <span class="text-[10px] bg-purple-600 text-white font-bold px-2 py-0.5 rounded-full">${totalSectionItems} item</span>
                    </div>
                `;

                if (unitList.length === 0) {
                    const noUnitDiv = document.createElement('div');
                    noUnitDiv.className = 'text-center py-3 text-gray-400 text-xs italic bg-white rounded-lg border border-dashed border-gray-300';
                    noUnitDiv.textContent = 'Tiada unit berdaftar di bawah seksyen ini.';
                    sectionWrap.appendChild(noUnitDiv);
                }

                unitList.forEach(unit => {
                    const contracts = Object.values(unit.contracts);
                    const totalItems = contracts.reduce((s, c) => s + c.orders.length, 0);

                    let unitHtml = `
                        <div class="flex items-center gap-2 mb-2 px-1 pt-1">
                            <i class="fa-solid fa-sitemap text-gray-400 text-sm"></i>
                            <h3 class="text-sm font-extrabold text-gray-700 uppercase tracking-wide">${unit.name}</h3>
                            <span class="text-[10px] bg-gray-100 text-gray-500 font-bold px-2 py-0.5 rounded-full">${totalItems} item</span>
                        </div>
                    `;

                    if (contracts.length === 0) {
                        unitHtml += `
                            <div class="text-center py-4 text-gray-400 text-xs italic bg-white rounded-lg border border-dashed border-gray-300 mb-4">
                                <i class="fa-solid fa-inbox block text-lg mb-1 text-gray-300"></i> ${opts.emptyMsg}
                            </div>`;
                    } else {
                        contracts.forEach(contract => {
                            const seqGroups = buildSequenceGroups(contract.orders);
                            const accId = `acc-${containerId}-${String(section.id)}-${String(unit.id)}-${String(contract.id)}`.replace(/[^a-zA-Z0-9]/g, '-');
                            const iconId = `icon-${accId}`;

                            unitHtml += `
                                <div class="bg-gray-50 rounded-lg border border-gray-200 shadow-xs mb-3 overflow-hidden">
                                    <button type="button" onclick="toggleAccordion('${accId}','${iconId}')"
                                            class="w-full bg-violet-50 hover:bg-violet-100/80 border-violet-200 px-3 py-2.5 flex items-center justify-between gap-2 transition-colors cursor-pointer text-left border-b">
                                        <div class="flex items-center gap-2 min-w-0 flex-1">
                                            <span class="bg-violet-600 text-white text-[10px] px-1.5 py-0.5 rounded font-mono shadow-xs shrink-0">${contract.code}</span>
                                            <span class="font-bold text-gray-800 text-xs leading-tight break-words">${contract.name}</span>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            <span class="text-[11px] bg-white text-gray-600 border border-gray-300 font-semibold px-2 py-0.5 rounded-full whitespace-nowrap shadow-2xs">${contract.orders.length}</span>
                                            <i id="${iconId}" class="fa-solid fa-chevron-down text-gray-500 text-xs transition-transform duration-200"></i>
                                        </div>
                                    </button>
                                    <div id="${accId}" class="hidden overflow-x-auto bg-white transition-all duration-200">
                                        <table class="min-w-full divide-y divide-gray-200 text-xs">
                                            <thead class="bg-gray-50">
                                                <tr>
                                                    <th class="px-3 py-2 text-left font-medium text-gray-500 uppercase tracking-wider">Work ID</th>
                                                    <th class="px-3 py-2 text-center font-medium text-gray-500 uppercase tracking-wider w-40">Reference</th>
                                                    <th class="px-3 py-2 text-right font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody class="bg-white divide-y divide-gray-200">
                            `;

                            contract.orders.forEach(item => {
    const seq = (item.sequence_no || '').trim();
    const groupKey = seq ? getBlueformGroupKey(item) : null;
    const dedupeKey = groupKey ? `${contract.id}::${groupKey}` : null;
    const isFirstInGroup = !dedupeKey || !renderedSeqs.has(dedupeKey);

    let fullSetBtnHtml;
    if (isFirstInGroup) {
        if (dedupeKey) renderedSeqs.add(dedupeKey);
        const groupItems = groupKey ? (seqGroups[groupKey] || [item]) : [item];
        const countLabel = groupItems.length > 1 ? ` (${groupItems.length})` : '';
        const serializedGroup = encodeURIComponent(JSON.stringify(groupItems));
        fullSetBtnHtml = `
            <button onclick="previewFullSet('${serializedGroup}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-2.5 py-1 rounded-lg text-[11px] shadow-xs cursor-pointer inline-flex items-center gap-1 transition-all">
                <i class="fa-solid fa-print"></i> Blueform${countLabel}
            </button>`;
    } else {
        fullSetBtnHtml = `<span class="text-[10px] text-gray-400 italic">Refer to first row seq ${seq}</span>`;
    }

    const isPendingGroup = !!item.pending_status;
    const actionHtml = !canAct
        ? `<span class="text-[10px] text-gray-400 italic font-semibold px-1"><i class="fa-solid fa-eye mr-1"></i>View Only</span>`
        : isPendingGroup
        ? `<span class="text-[10px] text-amber-600 italic font-semibold px-1"><i class="fa-solid fa-hourglass-half mr-1"></i>Awaiting group blueforms</span>`
        : `<div class="inline-flex items-center gap-1">
            <button onclick="openConfirmModal('${item.work_id}', '${opts.rejectStatus}', 'REJECT')" class="text-white px-2 py-1 rounded bg-red-600 hover:bg-red-700 font-medium transition-all shadow-xs cursor-pointer whitespace-nowrap" title="Reject"><i class="fa-solid fa-xmark"></i></button>
            <button onclick="openConfirmModal('${item.work_id}', '${opts.approveStatus}', 'APPROVE')" class="text-white px-2.5 py-1 rounded bg-purple-600 hover:bg-purple-700 font-medium transition-all shadow-xs cursor-pointer whitespace-nowrap" title="Approve"><i class="fa-solid fa-check"></i></button>
           </div>`;

    unitHtml += `
        <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-3 py-2.5 whitespace-nowrap font-mono text-gray-900 font-medium text-left">${item.work_id}${seq ? ` <span class="text-gray-400 text-[11px]">(${seq})</span>` : ''}</td>
            <td class="px-3 py-2.5 whitespace-nowrap text-center">${fullSetBtnHtml}</td>
            <td class="px-3 py-2.5 whitespace-nowrap text-right">${actionHtml}</td>
        </tr>`;
});
                            unitHtml += `</tbody></table></div></div>`;
                        });
                    }

                    const unitBlock = document.createElement('div');
                    unitBlock.className = 'mb-4';
                    unitBlock.innerHTML = unitHtml;
                    sectionWrap.appendChild(unitBlock);
                });

                container.appendChild(sectionWrap);
            });
        }

        // ============ PDF -> IMAGE PAGE RENDERING (matches Technician view) ============
        async function renderPdfPagesAsElements(pdfUrl) {
            const pages = [];
            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const baseViewport = page.getViewport({ scale: 1 });
                    const scale = (794 * 2) / baseViewport.width;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.width = '100%';
                    img.style.display = 'block';
                    img.alt = `Quotation page ${i}`;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'print-page bg-white shadow-lg';
                    pageDiv.style.width = '210mm';
                    pageDiv.style.boxSizing = 'border-box';
                    pageDiv.appendChild(img);
                    pages.push(pageDiv);

                    canvas.width = 0;
                    canvas.height = 0;
                }
            } catch (err) {
                console.error('Failed to render PDF:', pdfUrl, err);
                const errDiv = document.createElement('div');
                errDiv.className = 'print-page bg-white p-8 shadow-lg w-[210mm] min-h-[297mm] flex items-center justify-center text-center';
                errDiv.innerHTML = `
                    <div>
                        <i class="fa-solid fa-triangle-exclamation text-xl text-amber-500 block mb-2"></i>
                        <p class="text-sm text-gray-600">Failed to display PDF.</p>
                        <a href="${pdfUrl}" target="_blank" class="text-blue-500 underline text-xs">Open PDF in new tab</a>
                    </div>`;
                pages.push(errDiv);
            }
            return pages;
        }

        async function previewFullSet(escapedGroupData) {
            const groupItems = JSON.parse(decodeURIComponent(escapedGroupData));
            const container = document.getElementById('bulkPagesContainer');

            container.innerHTML = '<div class="text-white text-sm p-4 animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Bundling Blueform documents...</div>';
            document.getElementById('bulkPreviewPage').style.display = 'block';

            try {
                let compositeHtml = '';
                const ids = groupItems.map(g => g.id);

                const payload = ids.length > 1
                    ? await buildBlueformDataGroup(ids)
                    : await buildBlueformData(ids[0]);

                if (payload && typeof buildBlueformHTML === 'function') {
                    compositeHtml += buildBlueformHTML(payload);
                } else {
                    compositeHtml += `
                        <div class="print-page bg-white p-8 shadow-lg w-[210mm] min-h-[297mm] text-red-500 font-bold flex items-center justify-center">
                            Error: buildBlueformData or buildBlueformHTML logic failed.
                        </div>
                    `;
                }

                container.innerHTML = compositeHtml;

                const linkedPdfs = [...new Set(groupItems.map(g => g.mapped_pdf_url).filter(Boolean))];

                if (linkedPdfs.length > 0) {
                    for (const pdfUrl of linkedPdfs) {
                        const pageEls = await renderPdfPagesAsElements(pdfUrl);
                        pageEls.forEach(el => container.appendChild(el));
                    }
                } else {
                    const noPdfDiv = document.createElement('div');
                    noPdfDiv.className = 'print-page bg-white p-12 shadow-lg w-[210mm] min-h-[297mm] flex flex-col items-center justify-center text-center';
                    noPdfDiv.style.color = 'gray';
                    noPdfDiv.innerHTML = `
                        <i class="fa-solid fa-file-pdf text-4xl text-gray-300 mb-2"></i>
                        <p class="text-sm font-semibold text-gray-600">No Linked Quotation PDF Found</p>
                        <p class="text-xs text-gray-400">Only the Blueform page will be printed for this record.</p>`;
                    container.appendChild(noPdfDiv);
                }

            } catch (error) {
                console.error("Error creating Blueform preview:", error);
                container.innerHTML = `<div class="text-red-400 p-4 font-mono text-xs">Error bundling documents: ${error.message}</div>`;
            }
        }

        function closeBulkPreview() {
            document.getElementById('bulkPreviewPage').style.display = 'none';
            document.getElementById('bulkPagesContainer').innerHTML = '';
        }

        // Handles both Approve and Reject (with a reason) status changes
        function openConfirmModal(workId, nextStatus, mode) {
    const perm = window.__lastPerm;
    if (perm && !perm.canActDept) { alert('Anda tiada kebenaran untuk membuat tindakan ini (View Only).'); return; }

    const modal = document.getElementById('customConfirmModal');
    const banner = document.getElementById('modalBanner');
    const iconContainer = document.getElementById('modalIconContainer');
    const icon = document.getElementById('modalIcon');
    const title = document.getElementById('modalTitle');
    const msg = document.getElementById('modalMessage');
    const confirmBtn = document.getElementById('modalConfirmBtn');
    const reasonSection = document.getElementById('rejectReasonSection');
    const reasonInput = document.getElementById('rejectReasonInput');
    const errorMsg = document.getElementById('rejectErrorMsg');

    reasonInput.value = '';
    errorMsg.classList.add('hidden');
    reasonInput.classList.remove('border-red-500', 'focus:ring-red-500/20');

    const isReject = mode === 'REJECT';

    if (isReject) {
        reasonSection.classList.remove('hidden');
        banner.className = "p-5 bg-red-50 text-red-600 flex justify-center items-center border-b border-red-100";
        iconContainer.className = "w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-md text-xl text-red-600";
        icon.className = "fa-solid fa-ban";
        title.innerText = "Reject Blueform";
        msg.innerHTML = `Confirm rejection for <span class="font-mono font-bold text-gray-800">${workId}</span>. Status will change to <span class="text-red-600 font-bold">${nextStatus}</span>.`;
        confirmBtn.className = "flex-1 px-4 py-2.5 rounded-xl text-white font-semibold text-sm transition-all shadow-md bg-red-600 hover:bg-red-700 cursor-pointer";
    } else {
        reasonSection.classList.add('hidden');
        banner.className = "p-5 bg-purple-50 text-purple-600 flex justify-center items-center border-b border-purple-100";
        iconContainer.className = "w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-md text-xl text-purple-600";
        icon.className = "fa-solid fa-check-double";
        title.innerText = "Approve Blueform";
        msg.innerHTML = `Approve Blueform <span class="font-mono font-bold text-gray-800">${workId}</span>? Status will change to <span class="text-purple-600 font-bold">${nextStatus}</span>.`;
        confirmBtn.className = "flex-1 px-4 py-2.5 rounded-xl text-white font-semibold text-sm transition-all shadow-md bg-purple-600 hover:bg-purple-700 cursor-pointer";
    }

    confirmBtn.onclick = async () => {
        let reasonText = null;
        if (isReject) {
            reasonText = reasonInput.value.trim();
            if (!reasonText) {
                errorMsg.classList.remove('hidden');
                reasonInput.classList.add('border-red-500');
                reasonInput.focus();
                return;
            }
        }
        closeConfirmModal();
        await executeStatusUpdate(workId, nextStatus, reasonText);
    };

    modal.classList.remove('hidden');
    setTimeout(() => {
        modal.firstElementChild.classList.remove('scale-95');
        modal.firstElementChild.classList.add('scale-100');
    }, 10);
}

function closeConfirmModal() {
    const modal = document.getElementById('customConfirmModal');
    modal.firstElementChild.classList.remove('scale-100');
    modal.firstElementChild.classList.add('scale-95');
    setTimeout(() => {
        modal.classList.add('hidden');
    }, 150);
}

async function executeStatusUpdate(workId, nextStatus, reason = null) {
    try {
        const stampStage = nextStatus === 'APP-HOD' ? 'dept_head' : null;
        const result = await stageGroupDecisionByWorkId(workId, nextStatus, reason, stampStage);
        if (result.waiting) {
            alert('Decision saved. Waiting for other Work Orders in the same sequence to be decided first.');
        }
        fetchDashboard();
    } catch (err) {
        console.error("Error during processing:", err.message);
        alert("Failed to update status: " + err.message);
    }
}
        window.onload = fetchDashboard;
    </script>
