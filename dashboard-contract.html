<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0" defer></script>
    <style>
        :root { 
            --ios-blue: #007AFF; --ios-green: #34C759; --ios-orange: #FF9500; --ios-red: #FF3B30;
            --dark-bg: #1c1c1e; --card-bg: #ffffff; --glass: rgba(255,255,255,0.8);
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif;   
            background: linear-gradient(60deg, #0b3d91 0%, #0077b6 40%, #00b4d8 100%); 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .search-container {
            padding: 5px 10px 10px 0;
            flex-shrink: 0;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #d1d1d6;
            background: white;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s; 
        }
        .search-box:focus {
            border-color: var(--ios-blue);
        }
        .mobile-usage-btn { display: none; } 

        .glass-header { 
            width: 100%; height: 60px; 
            background: linear-gradient(60deg, #0b3d91 0%, #0077b6 40%, #00b4d8 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05); z-index: 1000; flex-shrink: 0;
            position: relative;
            padding: 0 60px;
            box-sizing: border-box;
        }

        .unit-container-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .unit-container {
            display: flex;
            flex-wrap: wrap;         
            justify-content: center; 
            gap: 8px;
            padding: 0;
        }

        .unit-pill { 
            padding: 8px 16px;
            border-radius: 15px;     
            background: rgba(255,255,255,.2);
            color: white;
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 12px; 
            white-space: nowrap; 
            transition: background-color 0.2s, color 0.2s; 
        }
        .unit-pill.active { 
            background: white;
            color: #0b3d91; 
        }

        @media (max-width: 768px) {
            #panel-vendor, 
            .next-container { 
                display: none !important; 
            }

            .flip-card-front > div:first-child {
                position: relative;
            }

            .mobile-usage-btn {
                display: flex;
                background: var(--ios-blue);
                color: white;
                text-decoration: none;
                padding: 0 10px;
                border-radius: 50%;
                font-size: 11px;
                font-weight: 800;
                align-items: center;
                justify-content: center;
                transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.3s ease, padding 0.3s ease;
                will-change: width, border-radius;
                position: absolute;
                right: 0;
                top: 0;
                width: 35px;
                height: 35px;
                box-sizing: border-box;
                overflow: hidden;
                z-index: 1510;
            }

            .mobile-usage-btn .btn-text {
                opacity: 0;
                width: 0;
                white-space: nowrap;
                transition: opacity 0.2s ease, margin 0.3s ease;
                font-size: 11px;
                letter-spacing: 0.5px;
            }

            .mobile-usage-btn .icon-main {
                font-size: 11px;
                flex-shrink: 0;
            }

            .mobile-usage-btn.expanded {
                width: 105px;
                padding: 0 12px;
                border-radius: 10px;
                box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            }

            .mobile-usage-btn.expanded .btn-text {
                opacity: 1;
                width: auto;
                margin-right: 5px;
            }

            .contract-sidebar {
                width: 100% !important;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                will-change: transform;
            }

            .analysis-container {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                bottom: 0;
                width: auto;
                height: auto;
                box-sizing: border-box;
                padding: 10px;
                background: #f2f2f7;
                z-index: 1500;
                transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                will-change: transform;
                overflow-x: hidden;
            }

            body.analysis-active .analysis-container { 
                transform: translateX(0);
            }
            body.analysis-active .contract-sidebar {
                transform: translateX(-100%);
            }

            #analysis-panel {
                border-radius: 20px 20px 0 0 !important;
                height: 100%; 
                min-width: 0;
            }
            .health-grid {
                grid-template-columns: 1fr !important;
                overflow-y: auto !important; 
                min-width: 0;
            }
            .chart-box {
                min-height: 250px;
                flex-shrink: 0; 
                min-width: 0;
            }

            .glass-header {
                padding: 0 10px; 
            }

            .unit-container-wrapper {
                flex: 1;
                overflow: hidden;
                margin: 0 50px;  
            }

            .unit-container {
                flex-wrap: nowrap;           
                justify-content: flex-start;
                overflow-x: auto;
                scroll-behavior: smooth;
                scroll-snap-type: x mandatory;
                scrollbar-width: none;
                padding: 0 16px;
            }

            .unit-container::-webkit-scrollbar { display: none; }

            .unit-container::before,
            .unit-container::after {
                display: block;
                content: "";
                flex: 0 0 50%;
            }

            .unit-pill {
                scroll-snap-align: center;
            }

            .fab {
                top: 12px;
                right: 15px;
                border-radius: 50%;
                will-change: width, border-radius;
            }

        }

        .nav-btn {
            position: absolute;
            background: #e5e5ea;
            border: none;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ios-blue);
            padding: 0 10px;
        }

        .next-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 1px solid rgba(0, 122, 255, 0.2);
        }
        .next-label { font-size: 11px; font-weight: 800; color: #48484a; letter-spacing: 0.8px; text-align: right; }
        .next-btn-circle {
            background: var(--ios-blue);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
        }

        .fab { 
            position: fixed; 
            top: 12px; 
            right: 20px; 
            height: 35px; 
            width: 35px;
            background: var(--ios-blue); 
            color: white; 
            border-radius: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 1100;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
            overflow: hidden;
            box-sizing: border-box;
        }

        .fab .fab-text {
            opacity: 0;
            width: 0;
            white-space: nowrap;
            transition: opacity 0.2s ease, margin 0.3s ease;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .fab .icon-main {
            font-size: 14px;
            flex-shrink: 0;
        }

                    .fab.expanded {
                width: 150px; 
                padding: 0 12px;
                border-radius: 10px;
                justify-content: space-between;
                box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            }

            .fab.expanded .fab-text {
                opacity: 1;
                width: auto;
                margin-right: 5px;
            }

        .main-wrapper { display: flex; flex: 1; overflow: hidden; padding: 10px; gap: 15px; }
        .contract-sidebar { width: 220px; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        #contractList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        
        .c-card { background: var(--card-bg); border-radius: 12px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; border: 1px solid rgba(0,0,0,0.05); }
        .c-card.active { border-color: var(--ios-blue); background: #f0f7ff; }
        .c-card h4 { margin: 0; font-size: 11px; color: #1c1c1e; overflow: hidden; text-overflow: ellipsis; }
        .c-card .sub-text { font-size: 9px; color: #888; margin-top: 2px; }

        .analysis-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* #analysis-panel is now the flip-card "stage": it holds the front (analysis)
           and back (usage trend) faces and rotates between them on click. */
        #analysis-panel {
            display: none;
            background: transparent;
            box-shadow: none;
            border-radius: 20px;
            flex: 1;
            overflow: hidden;
            position: relative;
            perspective: 2200px;
        }

        .health-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; flex: 1; overflow: hidden; margin-top: 5px; cursor: pointer; }
        
        .chart-box { padding: 10px; background: #f9f9fb; border-radius: 15px; flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; transform: translateZ(0); }

        .section-row { background: #fff; border: 1px solid var(--ios-blue); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
        .prog-bar-bg { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-top: 5px; overflow: hidden; }

        .prog-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease-out !important; width: 0 !important; will-change: width;}
        .avg-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .avg-item { font-size: 9px; font-weight: 600; color: #666; }
        .manage-btn { background: #f2f2f7; border: none; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: var(--ios-blue); cursor: pointer; }
        #selectedSectionContainer { flex: 1; overflow-y: auto; padding-right: 5px; }
        .sel-chip { display: inline-block; padding: 4px 10px; border-radius: 12px; background: #e5e5ea; margin: 3px; font-size: 10px; cursor: pointer; font-weight: 600; }
        .sel-chip.active { background: var(--ios-blue); color: white; }
        .selector-warning { font-size: 10px; color: var(--ios-red); font-weight: 700; margin-bottom: 8px; line-height: 1.4; }

        /* ================= FLIP CARD MECHANICS ================= */
        .flip-card-inner {
            position: absolute;
            inset: 0;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        #analysis-panel.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .flip-card-front { padding: 20px; }
        .flip-card-back {
            transform: rotateY(180deg);
            padding: 15px;
            overflow-y: auto;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .flip-card-front, .flip-card-back {
                border-radius: 20px 20px 0 0 !important;
            }
        }

        /* ================= USAGE TREND (page 2, scaled to fit the card) ================= */

.usage-embed {
    font-family: -apple-system, system-ui, sans-serif;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* ================= LIFECYCLE ================= */

.usage-embed .u-lifecycle {
    display: flex;
    align-items: flex-start;
    width: 100%;
    background: #f9f9fb;
    padding: 14px 10px;
    border-radius: 14px;
    margin-bottom: 12px;
    flex-shrink: 0;
    overflow: hidden;
    box-sizing: border-box;
}

/* Semua main step */
.usage-embed .u-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
}

/* Nama bawah bulatan */
.usage-embed .u-step span {
    font-size: 10px;
    font-weight: 800;
    color: #1c1c1e;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
}

/* Bulatan default = belum sampai */
.usage-embed .u-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e5e5ea;
    color: #8e8e93;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
}

/* DONE */
.usage-embed .u-done .u-dot {
    background: var(--ios-green);
    color: white;
}

/* CURRENT */
.usage-embed .u-current .u-dot {
    background: var(--ios-blue);
    color: white;
}

/* COUNT */
.usage-embed .u-count {
    margin-top: 3px;
    font-size: 9px;
    font-weight: 800;
    color: var(--ios-blue);
}


/* ================= CONNECTOR ================= */

.usage-embed .u-connector {
    flex: 0 0 18px;
    height: 3px;
    background: #e5e5ea;

    /*
    14px + half height connector
    supaya connector align dengan
    tengah bulatan utama
    */
    margin: 13px 3px 0;

    align-self: flex-start;
}


/* ================= WO + INTERIM ================= */

* ================= WO + INTERIM VERTICAL GROUP ================= */

.usage-embed .u-branch-group {
    flex: 1 1 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: flex-start;

    gap: 10px;

    min-width: 0;
}


/* WO dan INTERIM duduk dalam satu kolum */
.usage-embed .u-branch-group .u-step {
    flex: none;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: flex-start;

    width: 100%;
}


/* WO sama level dengan AWARD */
.usage-embed .u-branch-group .u-step-wo {
    margin-top: 0;
}


/* INTERIM betul-betul bawah WO */
.usage-embed .u-branch-group .u-step-interim {
    margin-top: 0;
}


/* WO bulatan sama dengan main lifecycle */
.usage-embed .u-branch-group .u-step-wo .u-dot {
    width: 28px;
    height: 28px;
    font-size: 11px;
}


/* INTERIM sedikit kecil */
.usage-embed .u-branch-group .u-step-interim .u-dot {
    width: 22px;
    height: 22px;
    font-size: 9px;
}


/* Label */
.usage-embed .u-branch-group .u-step span {
    margin-top: 5px;
    font-size: 10px;
}


/* Count */
.usage-embed .u-branch-group .u-count {
    margin-top: 2px;
    font-size: 8px;
    font-weight: 800;
    color: var(--ios-blue);
}

/* ================= DESKTOP ONLY ================= */

@media (min-width: 769px) {

    .usage-embed .u-step-award span,
    .usage-embed .u-branch-group .u-step-wo span,
    .usage-embed .u-branch-group .u-step-interim span {
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.3px;
    }


    /* AWARD dan WO sama saiz */
    .usage-embed .u-step-award .u-dot,
    .usage-embed .u-branch-group .u-step-wo .u-dot {
        width: 34px;
        height: 34px;
        font-size: 13px;
    }


    /* INTERIM kecil sedikit */
    .usage-embed .u-branch-group .u-step-interim .u-dot {
        width: 24px;
        height: 24px;
        font-size: 10px;
    }


    /* Connector align dengan AWARD / WO */
    .usage-embed .u-connector {
        margin-top: 16px;
    }


    .usage-embed .u-branch-group {
        flex: 1 1 0;
        padding-top: 0;
        gap: 10px;
    }

}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

    .usage-embed .u-lifecycle {
        padding: 14px 6px;
    }

    .usage-embed .u-dot {
        width: 24px;
        height: 24px;
        font-size: 9px;
    }

    .usage-embed .u-step span {
        font-size: 8px;
        margin-top: 4px;
    }

    .usage-embed .u-branch-group .u-step-wo .u-dot {
        width: 24px;
        height: 24px;
    }

    .usage-embed .u-branch-group .u-step-interim .u-dot {
        width: 19px;
        height: 19px;
    }

    .usage-embed .u-connector {
        flex: 0 0 8px;
        margin: 11px 1px 0;
    }

}
/* ================= SUMMARY ================= */

.usage-embed .u-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
    flex-shrink: 0;
}

.usage-embed .u-card {
    background: #f9f9fb;
    padding: 12px 8px;
    border-radius: 12px;
    text-align: center;
    min-width: 0;
}

.usage-embed .u-label {
    font-size: 9px;
    color: #8e8e93;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.usage-embed .u-value {
    font-size: 15px;
    font-weight: 800;
    margin-top: 5px;
    color: var(--ios-blue);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* ================= CHART ================= */

.usage-embed .u-chartBox {
    background: #f9f9fb;
    padding: 12px;
    border-radius: 14px;
    margin-bottom: 12px;
    flex-shrink: 0;
    height: 190px;
    position: relative;
}


/* ================= TABLE ================= */

.usage-embed .u-tableWrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    border-radius: 12px;
}

.usage-embed table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    font-size: 11px;
}

.usage-embed th,
.usage-embed td {
    padding: 9px 10px;
    text-align: left;
    border-bottom: 1px solid #f2f2f7;
}

.usage-embed th {
    background: #f9f9fb;
    position: sticky;
    top: 0;
    font-size: 10px;
    font-weight: 800;
}
        
    </style>

    <link rel="stylesheet" href="sidebar.css">

    <script src="session.js" defer></script>
    <script src="sidebar.js" defer></script>
</head>
<body>

    <app-sidebar></app-sidebar>
    <div class="fab" id="fabBtn" onclick="handleFabClick(event)">
        <span class="fab-text">REGISTER FORMS</span>
        <i class="fa fa-plus icon-main"></i>
    </div>

    <div class="glass-header">
        <div class="unit-container-wrapper">
            <div class="unit-container" id="unitNav"></div>
        </div>
    </div>

    <div class="next-container">
        <span class="next-label">USAGE<br>SCHEDULE</span>
        <button class="next-btn-circle" onclick="goToUsage()">
            <i class="fa fa-chevron-right"></i>
        </button>
    </div>

    <div class="main-wrapper">
        <div class="contract-sidebar">
            <div class="search-container">
                <input type="text" id="contractSearch" class="search-box" placeholder="Search Code/Contract" onkeyup="debouncedFilterContracts()">
            </div>
            <div id="contractList"></div>
        </div>

        <div class="analysis-container">
            <div id="analysis-panel">
                <div class="flip-card-inner" id="flipCardInner">

                    <!-- FRONT FACE: original analysis view -->
                    <div class="flip-card-front" id="flipCardFront">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #f2f2f7;">
                            <div>
                                <h1 id="panel-title" style="margin:0; font-size: 24px; letter-spacing: -0.5px; color: var(--ios-blue);">Analysis</h1>
                                <p id="panel-vendor" style="margin:2px 0 0 0; color: #8e8e93; font-size: 13px; font-weight: 500;"></p>
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <a href="#" class="mobile-usage-btn" id="mobileUsageBtn" onclick="handleMobileUsageClick(event)">
                                    <span class="btn-text">USAGE</span>
                                    <i class="fa fa-chevron-right icon-main"></i>
                                </a>
                            </div>
                        </div>

                        <div class="health-grid">
                            <div class="chart-box">
                                <div style="font-size: 11px; font-weight: bold; color: #666; margin-bottom: 10px;">MONTHLY AVERAGE: ACTUAL VS PLANNED (RM)</div>
                                <canvas id="healthChart"></canvas>
                            </div>
                            <div style="display: flex; flex-direction: column; overflow: hidden;">
                                <div style="display:flex; justify-content:space-between; align-items:center; flex-shrink: 0; margin-bottom: 8px;">
                                    <h3 style="margin:0; font-size: 16px;">Sections</h3>
                                    <button id="manageBtn" class="manage-btn" onclick="toggleSelector()"><i class="fa fa-cog"></i> Setting</button>
                                </div>
                                <div id="sectionSelector" style="display:none; background: #f9f9fb; padding: 10px; border-radius: 15px; margin-bottom: 10px; border: 1px dashed #ccc;">
                                    <div class="selector-warning">* Sections selected here will be used as the displayed sections in the Blueform.</div>
                                    <div id="fullSectionList"></div>
                                </div>
                                <div id="selectedSectionContainer"></div>
                            </div>
                        </div>
                    </div>

                    <!-- BACK FACE: usage trend dashboard, sized to fit the card -->
                    <div class="flip-card-back" id="flipCardBack">
                        <div class="usage-embed" id="usageEmbedRoot">

                            <div class="u-lifecycle">

    <div class="u-branch-group">

    <!-- WO ATAS -->
    <div class="u-step u-step-wo">
        <div class="u-dot">
            <i class="fa fa-clock"></i>
        </div>

        <span>WO</span>

        <div class="u-count" id="uwWoCount">0</div>
    </div>


    <!-- INTERIM BAWAH -->
    <div class="u-step u-step-interim">
        <div class="u-dot">
            <i class="fa fa-clock"></i>
        </div>

<script>
    var API_URL = 'https://me-connect-api.mech-elec-ranhill.workers.dev';
    const headers = { 'Content-Type': 'application/json' };

    let myChart = null;
    let currentContract = null;
    let currentWO = [];
    let selectedSections = [];
    let searchTimeout = null;
    const cacheContracts = {}; 

    // Setting sekarang dibuka untuk semua pengguna (bukan admin-only lagi)
    function updateAdminUI() {
        const btn = document.getElementById("manageBtn");
        if (btn) {
            btn.style.display = "inline-block";
        }
    }

    window.onload = () => {
        if (typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined') {
            Chart.register(ChartDataLabels);
        }
        updateAdminUI();
        fetchUnits();
    };

    function debouncedFilterContracts() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(filterContracts, 150);
    }

    function filterContracts() {
        const query = document.getElementById('contractSearch').value.toLowerCase();
        const cards = document.querySelectorAll('.c-card');
        
        requestAnimationFrame(() => {
            cards.forEach(card => {
                const code = card.querySelector('h4').innerText.toLowerCase();
                const name = card.querySelector('.sub-text').innerText.toLowerCase();
                card.style.display = (code.includes(query) || name.includes(query)) ? 'block' : 'none';
            });
        });
    }

    const urlParams = new URLSearchParams(window.location.search);
    const selectedSectionName = urlParams.get('section');

    async function fetchUnits() {
        try {
            const [secRes, unitsRes] = await Promise.all([
                fetch(`${API_URL}/rest/v1/me_sections?select=id`, { headers }),
                fetch(`${API_URL}/rest/v1/units?select=id,unit_name,section_id`, { headers })
            ]);
            const sections = await secRes.json();
            const units = await unitsRes.json();

            let selectedSection = null;
            if (selectedSectionName) {
                selectedSection = sections.find(s => s.id == selectedSectionName);
            }

            const filteredUnits = selectedSection
                ? units.filter(u => u.section_id === selectedSection.id)
                : units;

            const nav = document.getElementById('unitNav');
            nav.innerHTML = filteredUnits.map(u => `
                <button class="unit-pill" id="unit-${u.id}" onclick="fetchContracts(${u.id}, this)">
                    ${u.unit_name}
                </button>
            `).join('');

            if (filteredUnits.length > 0) {
                document.getElementById(`unit-${filteredUnits[0].id}`).click();
            }
        } catch (e) {
            console.error("Error units:", e);
        }
    }

    async function fetchContracts(unitId, btn) {
        document.querySelectorAll('.unit-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        centerActiveUnit(btn);

        document.getElementById('contractSearch').value = '';
        document.body.classList.remove('analysis-active');
        document.getElementById('analysis-panel').style.display = 'none';
        document.getElementById('analysis-panel').classList.remove('flipped');

        currentContract = null;
        currentWO = [];
        document.getElementById('panel-title').innerText = 'Analisis';
        document.getElementById('panel-vendor').innerText = '';

        if (cacheContracts[unitId]) {
            renderContractList(cacheContracts[unitId]);
            return;
        }

        try {
            const res = await fetch(
                `${API_URL}/rest/v1/contract?unit_id=eq.${unitId}&select=id,contract_code,contract_name,contract_start,contract_end,selected_sections,contract_sections_breakdown`,
                { headers }
            );
            let data = await res.json();

            data.sort((a, b) => {
                const dateDiff = new Date(a.contract_start) - new Date(b.contract_start);
                if (dateDiff !== 0) return dateDiff;
                return a.contract_code.localeCompare(b.contract_code, undefined, { numeric: true, sensitivity: "base" });
            });

            cacheContracts[unitId] = data;
            renderContractList(data);
        } catch (e) {
            console.error("Error contracts:", e);
        }
    }

    function renderContractList(data) {
        const list = document.getElementById('contractList');
        list.innerHTML = data.map(c => `
            <div class="c-card" id="card-${c.id}">
                <h4>${c.contract_code}</h4>
                <div class="sub-text">${c.contract_name}</div>
            </div>
        `).join('');

        data.forEach(c => {
            const cardEl = document.getElementById(`card-${c.id}`);
            if (cardEl) {
                cardEl.addEventListener('click', () => {
                    selectCard(c.id);
                    openAnalysis(c);
                });
            }
        });

        if (data.length > 0 && window.innerWidth > 768) {
            selectCard(data[0].id);
            openAnalysis(data[0]);
        }
    }

    function selectCard(id) {
        const currentActive = document.querySelector('.c-card.active');
        if(currentActive) currentActive.classList.remove('active');
        const activeCard = document.getElementById(`card-${id}`);
        if(activeCard) activeCard.classList.add('active');
    }

    async function openAnalysis(contract) {
        const mobileBtn = document.getElementById('mobileUsageBtn');
        if(mobileBtn) mobileBtn.classList.remove('expanded');

        // Reset the card to its front (analysis) face whenever a new contract is opened
        document.getElementById('analysis-panel').classList.remove('flipped');
        usageLoadedContractId = null;
        
        document.body.classList.add('analysis-active');
        document.getElementById('analysis-panel').style.display = 'block';
        document.getElementById('panel-title').innerText = contract.contract_code;
        document.getElementById('panel-vendor').innerText = contract.contract_name;

        currentContract = contract;

        try {
            const [resW, resI] = await Promise.all([
                fetch(`${API_URL}/rest/v1/work_orders?contract_id=eq.${currentContract.id}&status=not.in.(CANCEL,REJ,EXEC-REJ,HOS-REJ,HOD-REJ,QUOTATION,QUO-APP,QUO-REJ)&select=interim_no,section_category,status`, { headers }),
                fetch(`${API_URL}/rest/v1/interims?contract_id=eq.${currentContract.id}&order=date_received.asc&select=claim_breakdown`, { headers })
            ]);

            let rawWO = await resW.json();
            
            currentWO = rawWO.map(wo => {
                if (wo.status && wo.status.toLowerCase() === 'claimed') {
                    wo.status = 'CLAIMED';
                }
                return wo;
            });

            const currentInterims = await resI.json();

            selectedSections = (currentContract.selected_sections && currentContract.selected_sections.length > 0) 
                ? currentContract.selected_sections 
                : Object.keys(currentContract.contract_sections_breakdown || {});
            
            renderUI(currentInterims);
        } catch (error) { 
            console.error("Error fetching analysis data:", error); 
        }
    }

    async function renderUI(currentInterims = []) {
        if(!currentContract) return;

        try {
            updateAdminUI();

            const sections = currentContract.contract_sections_breakdown || {};
            const start = new Date(currentContract.contract_start);
            const end = new Date(currentContract.contract_end);
            const today = new Date();

            const totalMonths = Math.max(1, (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth()));
            let monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth()) + 1;
            monthsElapsed = Math.min(totalMonths, Math.max(1, monthsElapsed));

            document.getElementById('fullSectionList').innerHTML = Object.keys(sections).sort().map(s => `
                <span class="sel-chip ${selectedSections.includes(s) ? 'active' : ''}" onclick="toggleSection('${s}')">${s}</span>
            `).join('');

            const mainContainer = document.getElementById('selectedSectionContainer');
            let htmlBuilder = '';

            const interimMap = {};
            const woMap = {};

            currentInterims.forEach(int => {
                if (int.claim_breakdown) {
                    Object.keys(int.claim_breakdown).forEach(s => {
                        interimMap[s] = (interimMap[s] || 0) + (int.claim_breakdown[s].amt || 0);
                    });
                }
            });

            currentWO.forEach(wo => {
                if (!wo.interim_no && wo.section_category) {
                    Object.keys(wo.section_category).forEach(s => {
                        woMap[s] = (woMap[s] || 0) + (wo.section_category[s].amt || 0);
                    });
                }
            });

            let labels = [], targetAvgData = [], actualAvgData = [];

            selectedSections.sort().forEach(s => {
                if(!sections[s]) return;
                
                const totalInterimClaim = interimMap[s] || 0;
                const totalPendingWO = woMap[s] || 0;

                const used = totalInterimClaim + totalPendingWO;
                const budget = sections[s].amt || 0; 
                const plannedTotalToDate = (budget / totalMonths) * monthsElapsed;
                const variance = used - plannedTotalToDate;
                const variancePercent = plannedTotalToDate ? (variance / plannedTotalToDate) * 100 : 0;
                const color = used > plannedTotalToDate ? 'var(--ios-red)' : 'var(--ios-green)';
                const progressPercent = budget ? (used / budget) * 100 : 0;

                labels.push(s);
                targetAvgData.push((budget / totalMonths).toFixed(2));
                actualAvgData.push((used / monthsElapsed).toFixed(2));

                htmlBuilder += `
                    <div class="section-row">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div style="font-weight:bold; font-size:13px; color:var(--ios-blue);">
                                ${s}: ${sections[s].desc || s}
                            </div>
                        </div>
                        <div class="avg-stats">
                            <div class="avg-item">BUDGET: RM ${budget.toLocaleString()}</div>
                            <div class="avg-item" style="color: #8e8e93;">PLANNED: RM ${plannedTotalToDate.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                        </div>
                        <div class="avg-stats">
                            <div class="avg-item">ACTUAL: RM ${used.toLocaleString()}</div>
                            <div class="avg-item" style="color: ${color};">VARIANCE: ${variancePercent > 0 ? '+' : ''}${variancePercent.toFixed(1)}%</div>
                        </div>
                        <div class="prog-bar-bg">
                            <div class="prog-bar-fill" data-width="${Math.min(100, progressPercent)}%" style="background:${color}"></div>
                        </div>
                    </div>
                `;
            });

            mainContainer.innerHTML = htmlBuilder;
            updateChartDirect(labels, targetAvgData, actualAvgData);

            requestAnimationFrame(() => {
                document.querySelectorAll('.prog-bar-fill').forEach(bar => {
                    bar.style.setProperty('width', bar.getAttribute('data-width'), 'important');
                });
            });

        } catch (error) { console.error("Error processing UI:", error); }
    }

    function updateChartDirect(labels, targetAvgData, actualAvgData) {
        const trimmedLabels = labels.map(label => label.replace(/^section\s*/i, ''));

        if (myChart) {
            myChart.data.labels = trimmedLabels;
            myChart.data.datasets[0].data = targetAvgData;
            myChart.data.datasets[1].data = actualAvgData;
            myChart.update('none');
        } else {
            const ctx = document.getElementById('healthChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: trimmedLabels,
                    datasets: [
                        { label: 'Planned', data: targetAvgData, backgroundColor: 'rgba(200, 200, 205, 0.5)', borderRadius: 5 },
                        { label: 'Actual', data: actualAvgData, backgroundColor: '#007AFF', borderRadius: 5 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 150 },
                    layout: {
                        padding: { bottom: 15, top: 15 }
                    },
                    plugins: { 
                        legend: { position: 'top', labels: { font: { size: 10, weight: 'bold' } } },
                        datalabels: { anchor: 'end', align: 'top', font: { size: 9, weight: 'bold' }, formatter: (v) => v > 0 ? `RM${Math.round(v).toLocaleString()}` : '' }
                    },
                    scales: { 
                        y: { beginAtZero: true }, 
                        x: { 
                            ticks: { 
                                font: { size: 10, weight: 'bold' }, 
                                maxRotation: 0, 
                                minRotation: 0  
                            } 
                        } 
                    }
                }
            });
        }
    }

    function updateChart(currentInterims = []) {
        renderUI(currentInterims);
    }

    async function toggleSection(s) {
        if (selectedSections.includes(s)) {
            selectedSections = selectedSections.filter(x => x !== s);
        } else {
            selectedSections.push(s);
        }
        
        renderUI([]);
        
        await fetch(`${API_URL}/rest/v1/contract?id=eq.${currentContract.id}`, {
            method: 'PATCH',
            headers: headers,
            body: JSON.stringify({ selected_sections: selectedSections })
        });
    }

    function toggleSelector() {
        const el = document.getElementById('sectionSelector');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function handleMobileUsageClick(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const btn = document.getElementById('mobileUsageBtn');
        if (!btn.classList.contains('expanded')) {
            btn.classList.add('expanded');
        } else {
            goToUsage();
        }
    }

    document.addEventListener('click', (e) => {
        const btn = document.getElementById('mobileUsageBtn');
        if (btn && btn.classList.contains('expanded')) {
            if (!btn.contains(e.target)) {
                btn.classList.remove('expanded');
            }
        }
    });

    function goToUsage(){
        if(!currentContract){ alert("Please choose a contract"); return; }
        window.location.href = `dashboard-usageschedule.html?id=${currentContract.id}`;
    }

    function handleFabClick(e) {
    e.preventDefault();
    e.stopPropagation();

    const fabBtn = document.getElementById('fabBtn');

    if (!fabBtn.classList.contains('expanded')) {

        // Tutup Usage button jika sedang expanded
        const usageBtn = document.getElementById('mobileUsageBtn');
        if (usageBtn) {
            usageBtn.classList.remove('expanded');
        }

        // First click = expand
        fabBtn.classList.add('expanded');

    } else {

        // Second click = open Contract Forms
        window.location.href = 'contract-forms.html';
    }
}

    document.addEventListener('click', (e) => {
        const usageBtn = document.getElementById('mobileUsageBtn');
        if (usageBtn && usageBtn.classList.contains('expanded')) {
            if (!usageBtn.contains(e.target)) {
                usageBtn.classList.remove('expanded');
            }
        }

        const fabBtn = document.getElementById('fabBtn');
        if (fabBtn && fabBtn.classList.contains('expanded')) {
            if (!fabBtn.contains(e.target)) {
                fabBtn.classList.remove('expanded');
            }
        }
    });

    function centerActiveUnit(btn) {
        if(window.innerWidth <= 768) {
            btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        }
    }

    let touchStartX = 0;
    let touchEndX = 0;
    const contractSidebar = document.querySelector('.contract-sidebar');

    contractSidebar.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    contractSidebar.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleUnitSwipe();
    }, { passive: true });

    function handleUnitSwipe() {
        if(window.innerWidth > 768) return;
        const diff = touchStartX - touchEndX;
        if(Math.abs(diff) < 60) return;

        const units = [...document.querySelectorAll('.unit-pill')];
        const activeIndex = units.findIndex(btn => btn.classList.contains('active'));
        if(activeIndex === -1) return;

        if(diff > 0 && activeIndex < units.length - 1) {
            units[activeIndex + 1].click();
        }
        if(diff < 0 && activeIndex > 0) {
            units[activeIndex - 1].click();
        }
    }

    /* ================================================================
       FLIP CARD: click anywhere on the big analysis card (front or back),
       EXCEPT the "USAGE" button and the "Setting" button/section selector,
       to flip it and reveal the Usage Trend view sized to the card.
       Click again anywhere to flip back.
       ================================================================ */
    let usageChartInstance = null;
    let usageLoadedContractId = null;

    document.getElementById('analysis-panel').addEventListener('click', function (e) {
        if (
            e.target.closest('#mobileUsageBtn') ||
            e.target.closest('#manageBtn') ||
            e.target.closest('#sectionSelector')
        ) {
            return;
        }

        const panel = document.getElementById('analysis-panel');
        const isFlippingToBack = !panel.classList.contains('flipped');
        panel.classList.toggle('flipped');

        if (isFlippingToBack) {
            loadUsageEmbedded();
        }
    });

    function formatRM(value) {
        return "RM " + Number(value || 0).toLocaleString("en-MY", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    async function loadUsageEmbedded() {
        if (!currentContract) return;
        const contractId = currentContract.id;

        try {
            const contractRes = await fetch(
                `${API_URL}/rest/v1/contract?id=eq.${encodeURIComponent(contractId)}&select=*`,
                { headers }
            );
            if (!contractRes.ok) throw new Error(`HTTP ${contractRes.status}`);
            const contractRows = await contractRes.json();
            const contract = Array.isArray(contractRows) ? contractRows[0] : null;

            if (!contract) {
                console.error('Kontrak tidak dijumpai untuk usage embed:', contractId);
                return;
            }

            const [woRes, interimRes] = await Promise.all([
                fetch(`${API_URL}/rest/v1/work_orders?contract_id=eq.${encodeURIComponent(contractId)}&select=id,status,interim_no,section_category`, { headers }),
                fetch(`${API_URL}/rest/v1/interims?contract_id=eq.${encodeURIComponent(contractId)}&order=claim_date.asc&select=*`, { headers })
            ]);
            if (!woRes.ok) throw new Error(`HTTP ${woRes.status}`);
            if (!interimRes.ok) throw new Error(`HTTP ${interimRes.status}`);

            const rawWorkOrders = await woRes.json();
            const interims = await interimRes.json();

            const ignoredWOStatuses = new Set([
    "CANCEL",
    "REJ",
    "EXEC-REJ",
    "HOS-REJ",
    "HOD-REJ",
    "QUOTATION",
    "QUO-APP",
    "QUO-REJ"
]);
            const validWorkOrders = (Array.isArray(rawWorkOrders) ? rawWorkOrders : []).filter(row => {
                const status = String(row.status || "").trim().toUpperCase();
                return !ignoredWOStatuses.has(status);
            });
            const safeInterims = Array.isArray(interims) ? interims : [];

            document.getElementById('uwWoCount').innerText = validWorkOrders.length.toLocaleString('en-MY');
            document.getElementById('uwInterimCount').innerText = safeInterims.length.toLocaleString('en-MY');

            const contractValue = Number(contract.contract_sum || 0);

            // Already claimed (submitted via interims)
            const claimedAmount = safeInterims.reduce((sum, row) => sum + Number(row.net_amount || row.claim_amount || 0), 0);

            // Valid WOs not yet attached to an interim = belum claim
            const pendingAmount = validWorkOrders.reduce((sum, wo) => {
                if (!wo.interim_no && wo.section_category) {
                    const sectionTotal = Object.values(wo.section_category).reduce((s, sec) => s + Number((sec && sec.amt) || 0), 0);
                    return sum + sectionTotal;
                }
                return sum;
            }, 0);

            const totalUsed = claimedAmount + pendingAmount;
            const balance = contractValue - totalUsed;
            const progress = contractValue ? ((totalUsed / contractValue) * 100).toFixed(1) : 0;

            document.getElementById('uwContractValue').innerText = formatRM(contractValue);
            document.getElementById('uwUsedValue').innerText = formatRM(totalUsed);
            document.getElementById('uwBalanceValue').innerText = formatRM(balance);
            document.getElementById('uwProgressValue').innerText = progress + '%';

            const monthlyMap = {};
            safeInterims.forEach(item => {
                if (!item.claim_date) return;
                const date = new Date(item.claim_date);
                const month = date.toLocaleString('en', { month: 'short' });
                monthlyMap[month] = (monthlyMap[month] || 0) + Number(item.net_amount || item.claim_amount || 0);
            });

            let months = Object.keys(monthlyMap);
            let actual = Object.values(monthlyMap);
            if (months.length === 0) {
                months = ['Jan', 'Feb', 'Mar'];
                actual = [0, 0, 0];
            }
            const planned = months.map(() => contractValue / 12);

            buildUsageChart(months, planned, actual);
            buildUsageTable(Object.keys(monthlyMap), planned, actual);
            updateUsageLifecycle(contract, safeInterims);

            usageLoadedContractId = contractId;
        } catch (err) {
            console.error('Ralat usage embed:', err);
        }
    }

    function buildUsageChart(months, planned, actual) {
        const ctx = document.getElementById('uwChart');
        if (!ctx) return;
        if (usageChartInstance) { usageChartInstance.destroy(); }

        usageChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    { label: 'Planned', data: planned, borderColor: '#8e8e93', borderDash: [6, 4], fill: false, tension: 0.3, pointRadius: 2 },
                    { label: 'Actual', data: actual, borderColor: '#007AFF', backgroundColor: 'rgba(0,122,255,0.15)', fill: true, tension: 0.35, pointRadius: 3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { font: { size: 9, weight: 'bold' } } },
                    datalabels: { display: false }
                },
                scales: {
                    y: { beginAtZero: true, ticks: { font: { size: 8 } } },
                    x: { ticks: { font: { size: 8 } } }
                }
            }
        });
    }

    function buildUsageTable(months, planned, actual) {
        const body = document.getElementById('uwTableBody');
        if (!body) return;
        body.innerHTML = '';

        if (months.length === 0) {
            body.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#8e8e93;">Tiada rekod tuntutan interim</td></tr>`;
            return;
        }

        months.forEach((m, i) => {
            const variance = (actual[i] || 0) - (planned[i] || 0);
            const color = variance > 0 ? '#FF3B30' : '#34C759';
            body.innerHTML += `<tr><td>${m}</td><td>${formatRM(planned[i])}</td><td>${formatRM(actual[i])}</td><td style="color:${color}; font-weight:700;">${formatRM(variance)}</td></tr>`;
        });
    }

    function updateUsageLifecycle(contract, interims) {

    const root = document.getElementById('flipCardBack');
    if (!root) return;

    const awardNode = root.querySelector('.u-step-award');
    const woNode = root.querySelector('.u-step-wo');
    const interimNode = root.querySelector('.u-step-interim');
    const cpcNode = root.querySelector('.u-step-cpc');
    const cmgdNode = root.querySelector('.u-step-cmgd');
    const sfaNode = root.querySelector('.u-step-sfa');

    const allNodes = [
        awardNode,
        woNode,
        interimNode,
        cpcNode,
        cmgdNode,
        sfaNode
    ];

    /*
    =====================================================
    RESET SEMUA STEP
    Default = belum sampai = jam kelabu
    =====================================================
    */

    allNodes.forEach(node => {

        if (!node) return;

        node.classList.remove('u-done', 'u-current');

        const dot = node.querySelector('.u-dot');

        if (dot) {
            dot.innerHTML = `
                <i class="fa fa-clock"></i>
            `;
        }

    });


    /*
    =====================================================
    AWARD
    Contract wujud = Award sudah ada
    =====================================================
    */

    if (contract && awardNode) {

        awardNode.classList.add('u-done');

        const dot = awardNode.querySelector('.u-dot');

        if (dot) {
            dot.innerHTML = `
                <i class="fa fa-check"></i>
            `;
        }

    }


    /*
    =====================================================
    WO
    Check berdasarkan jumlah WO sebenar
    =====================================================
    */

    const woCount = Number(
        document.getElementById('uwWoCount')?.innerText || 0
    );

    if (woCount > 0 && woNode) {

        woNode.classList.add('u-done');

        const dot = woNode.querySelector('.u-dot');

        if (dot) {
            dot.innerHTML = `
                <i class="fa fa-check"></i>
            `;
        }

    }


    /*
    =====================================================
    INTERIM
    Kalau ada interim = done/current
    =====================================================
    */

    if (interims && interims.length > 0 && interimNode) {

        interimNode.classList.add('u-current');

        const dot = interimNode.querySelector('.u-dot');

        if (dot) {
            dot.innerHTML = `
                <i class="fa fa-clock"></i>
            `;
        }

    }


    /*
    =====================================================
    CURRENT STEP LOGIC
    Kalau tiada WO -> WO jadi current
    Kalau ada WO tapi tiada Interim -> Interim jadi current
    =====================================================
    */

    if (woCount === 0 && woNode) {

        woNode.classList.remove('u-done');
        woNode.classList.add('u-current');

    } else if (
        woCount > 0 &&
        (!interims || interims.length === 0) &&
        interimNode
    ) {

        interimNode.classList.add('u-current');

    }


    /*
    =====================================================
    CPC
    Bila contract tamat
    =====================================================
    */

    if (contract && contract.contract_end) {

        const today = new Date();
        const endDate = new Date(contract.contract_end);

        if (
            !isNaN(endDate.getTime()) &&
            today > endDate
        ) {

            if (interimNode) {
                interimNode.classList.remove('u-current');
                interimNode.classList.add('u-done');

                const dot = interimNode.querySelector('.u-dot');

                if (dot) {
                    dot.innerHTML = `
                        <i class="fa fa-check"></i>
                    `;
                }
            }

            if (cpcNode) {
                cpcNode.classList.add('u-current');
            }

        }

    }

}
</script>
</body>
</html>
